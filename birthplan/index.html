<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Birth Plan | Pregnancy Support</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/i18next@23/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://unpkg.com/jquery-i18next@1/jquery-i18next.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="../common/js/config.js"></script>
    <script src="../common/js/toast.js"></script>
    <link rel="stylesheet" href="../style.css"/>
    <style>
        .vac-question {
            margin-top: 16px;
            position: relative;
            overflow: hidden;
        }
        .vac-question:last-child {
            margin-bottom: 0;
        }

        .vac-question.is-disabled {
            background: var(--surface);
            color: var(--sub-text);
            opacity: 0.7;
        }

        .vac-question.is-disabled::before,
        .vac-question.is-disabled::after {
            display: none;
        }

        .vac-question.is-answered::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top: 32px solid var(--success);
            border-left: 32px solid transparent;
            pointer-events: none;
        }

        .vac-question.is-answered::before {
            content: "✓";
            position: absolute;
            top: 2px;
            right: 5px;
            color: var(--background);
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            z-index: 1;
            pointer-events: none;
        }

        .vac-question.is-unanswered::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top: 32px solid var(--border);
            border-left: 32px solid transparent;
            pointer-events: none;
        }
        .vac-question.is-unanswered::before {
            content: "○";
            position: absolute;
            top: 2px;
            right: 5px;
            color: var(--background);
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            z-index: 1;
            pointer-events: none;
        }

        .vac-question-label {
            margin: 0 0 8px;
            font-weight: 600;
        }

        .bp-question-help,
        .bp-question-preface {
            margin: 0 0 8px;
            color: var(--sub-text);
            font-size: 0.92rem;
            line-height: 1.4;
        }

        .bp-question-preface {
            color: #3f5973;
            font-weight: 600;
        }

        .vac-options {
            margin-top: 6px;
        }

        .bp-free-text {
            margin-top: 8px;
            min-height: 76px;
        }
        .bp-free-text:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .bp-sticky-actions {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            background: #fff;
            border-top: 1px solid var(--line);
            padding: 0 24px calc(10px + env(safe-area-inset-bottom));
            box-shadow: 0 -5px 5px 10px var(--background);
        }

        .bp-sticky-actions .btn-column {
            margin-top: 0;
        }

        .bp-form-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-start;
        }

        #birthPlanForm {
            position: relative;
        }

        .bp-global-progress {
            position: fixed;
            right: 0;
            left: 0;
            padding: 0 24px;
            bottom: calc(70px + env(safe-area-inset-bottom));
            z-index: 21;
            margin: 0;
            pointer-events: auto;
        }

        .bp-progress-container {
            display: flex;
            justify-content: flex-end;
        }

        .bp-progress {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            padding: 16px 12px;
            border: 1px solid var(--primary-light);
            border-radius: 12px;
            background: var(--background);
            box-shadow: var(--shadow);
        }

        .bp-progress-text {
            font-size: 13px;
            line-height: 1.2;
            color: var(--sub-text);
            white-space: nowrap;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .bp-progress-track {
            position: relative;
            width: 72px;
            height: 6px;
            background: var(--background);
            border: 1px solid var(--primary-border);
            border-radius: 999px;
            overflow: visible;
        }

        .bp-progress-fill {
            display: block;
            height: 100%;
            width: 0;
            background: var(--primary);
            border-radius: inherit;
            transition: width 0.18s ease;
        }

        .bp-progress-end {
            position: absolute;
            top: 50%;
            right: -8px;
            width: 16px;
            height: 16px;
            transform: translateY(-50%);
            border-radius: 999px;
            color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .bp-progress-track.is-complete .bp-progress-end {
            border-color: var(--background);
            background: var(--success);
            color: var(--background);
        }

        #birthPlanForm > section > h2 {
            position: sticky;
            top: 86px;
            z-index: 15;
            background: var(--background);
            box-shadow: 0 -10px 0 var(--background);
            line-height: 1.0;
        }

        #birthPlanForm > section > section > h3 {
            position: sticky;
            top: 130px;
            z-index: 14;
            box-shadow: 0 -22px 0 var(--background), 0 5px 5px 10px var(--background);
        }

        main {
            padding-bottom: 120px;
        }
    </style>
</head>
<body>
<div id="header-container" class="header-wrapper"></div>

<main>
    <article class="main-container">
        <h1 data-i18n="[html]title.birthplan"></h1>
        <p class="desc" data-i18n="[html]bp.desc"></p>
        <div class="card">
            <div class="state-card-inner">
                <iconify-icon icon="material-symbols:info-rounded" width="24" height="24" style="color:var(--info-state)"></iconify-icon>
                <div>
                    <p class="small" data-i18n="[html]bp.info1"></p>
                    <p id="unsupportedNotice" class="small" data-i18n="[html]bp.info2" hidden></p>
                </div>
            </div>
        </div>
        <form id="birthPlanForm"></form>
        <div class="bp-form-footer">
            <button type="button" id="clearDraftBtn" class="btn tertiary btn-small" data-i18n="[html]button.clear"></button>
        </div>
        <div class="bp-sticky-actions">
            <div class="fixed-container">
                <div class="btn-column">
                    <button type="button" id="saveDraftBtn" class="btn btn-primary" data-i18n="[html]button.save"></button>
                </div>
            </div>
        </div>
    </article>
</main>

<div class="overlay is-open" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script>
    const currentPage = "birthplan";
    const FORM_SCHEMA_URL = "./plan.structure.json";

    /** @type {import('@line/liff').Liff} */
    const liff = window.liff;

    const state = {
        schema: null,
        answers: {},
        initialized: false,
        allQuestionIds: [],
        totalQuestions: 0,
        birthPlanSettings: {},
        idToken: null
    };

    $(function () {
        const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";

        liff.init({
            liffId: LIFF_ID, // Use own liffId
            withLoginOnExternalBrowser: !isDev, // Enable automatic login process
        }).then(() => {
            return Promise.all([
                main(liff.getIDToken()),
                loadHeader()
            ]);
        }).then(() => {
            localizeBirthPlanForm();
            $("#loadingOverlay").removeClass('is-open');
        }).catch((err) => {
            console.error("LIFF init failed:", err);
            alert("LIFF init failed.");
        });

        $("#saveDraftBtn").on("click", handleSaveDraft);
        $("#clearDraftBtn").on("click", function(){
            handleClearDraft();
            localizeBirthPlanForm();
        });
    });

    async function main(idToken) {
        try {
            state.idToken = idToken;
            const schemaResponse = await fetch(FORM_SCHEMA_URL, {cache: "no-cache"});
            const [birthPlanSettings, birthPlanItems] = await Promise.all([
                    fetchBirthPlanSettings(idToken),
                    fetchBirthPlanAnswers(idToken)
                ]);
            state.schema = await schemaResponse.json();
            state.birthPlanSettings = birthPlanSettings;
            $("#unsupportedNotice").prop("hidden", !hasBirthPlanSettings(birthPlanSettings));
            state.answers = buildAnswersFromBirthPlanItems(state.schema, birthPlanItems);
            clearDisabledAnswersFromSchema(state.schema);
            state.initialized = true;
            renderForm();
        } catch (error) {
            console.error("main failed:", error);
            alert("Failed to load birth plan schema.");
        }

    }

    function fetchBirthPlanSettings(idToken) {
        return $.ajax({
            url: API_URL,
            type: "POST",
            dataType: "json",
            data: JSON.stringify({
                path: "birthplanSettings",
                method: "get",
                idToken: idToken
            }),
            timeout: 30000,
        }).then(function (response) {
            if (response.statusCode === 401) {
                liff.logout();
                window.location.reload();
                return {};
            }
            if (response.statusCode !== 200) {
                console.error(response.message);
                alert(response.message);
                return {};
            }
            return normalizeBirthPlanSettings(response.data && response.data.items);
        }, function () {
            alert("Network error!birthplanSettings");
            return {};
        });
    }

    function fetchBirthPlanAnswers(idToken) {
        return $.ajax({
            url: API_URL,
            type: "POST",
            dataType: "json",
            data: JSON.stringify({
                path: "birthplan",
                method: "get",
                idToken: idToken
            }),
            timeout: 30000,
        }).then(function (response) {
            if (response.statusCode === 401) {
                liff.logout();
                window.location.reload();
                return [];
            }
            if (response.statusCode !== 200) {
                console.error(response.message);
                alert(response.message);
                return [];
            }
            return response.data && Array.isArray(response.data.items) ? response.data.items : [];
        }, function () {
            alert("Network error!birthplan");
            return [];
        });
    }

    /**
     * ヘッダーの読み込み
     */
    function loadHeader(){
        return new Promise((resolve, reject) => {
            $("#header-container").load("../common/header.html", function(responseText, status) {
                if (status === "error") {
                    reject(new Error("Failed to load header.html"));
                    return;
                }

                // header.js内の翻訳初期化完了イベントを待機
                document.addEventListener('i18n-initialized', function() {
                    resolve();
                }, { once: true });

                $.getScript("../common/js/header.js")
                    .fail(function() {
                        reject(new Error("Failed to load header.js"));
                    });
            });
        });
    }

    function localizeBirthPlanForm() {
        if ($.fn.localize && window.i18next && i18next.isInitialized) {
            $("#birthPlanForm").localize();
        }
    }

    function renderForm() {
        const form = $("#birthPlanForm");
        form.empty();
        if (!state.schema || !Array.isArray(state.schema.categories)) {
            return;
        }
        form.append(`
            <div id="globalProgress" class="bp-global-progress" aria-live="polite">
                <div class="fixed-container bp-progress-container">
                    <span class="bp-progress">
                        <span class="bp-progress-text">0 / 0</span>
                        <span class="bp-progress-track">
                            <span class="bp-progress-fill"></span>
                            <span class="bp-progress-end" aria-hidden="true">✓</span>
                        </span>
                    </span>
                </div>
            </div>
        `);
        state.allQuestionIds = collectQuestionIdsFromSchema(state.schema);
        state.totalQuestions = state.allQuestionIds.length;
        let questionCounter = 0;

        state.schema.categories.forEach((category) => {
            const categoryEl = $("<section>");
            categoryEl.append(
                $("<h2>")
                    .attr("data-i18n", `[html]bp.${category.labelKey}`)
            );

            category.sections.forEach((section) => {
                const sectionEl = $("<section>");
                sectionEl.append(
                    $("<h3>")
                        .attr("data-i18n", `[html]bp.${section.labelKey}`)
                );

                section.questions.forEach((question) => {
                    questionCounter += 1;
                    const questionEl = renderQuestion(question, String(questionCounter));
                    sectionEl.append(questionEl);
                });

                categoryEl.append(sectionEl);
            });

            form.append(categoryEl);
        });
        updateProgressIndicators();
    }

    function renderQuestion(question, questionNumber) {
        const questionEnabled = isItemEnabled(question.labelKey);
        if (!questionEnabled) {
            clearQuestionAnswerDeep(question);
        }

        const wrap = $("<article>")
            .addClass("vac-question card")
            .toggleClass("is-disabled", !questionEnabled)
            .attr("aria-disabled", String(!questionEnabled));
        const prefaceVisible = shouldShowPreface(question);
        if (question.prefaceKey && prefaceVisible) {
            wrap.append(
                $("<p>")
                    .addClass("bp-question-preface")
                    .attr("data-i18n", `[html]bp.${question.prefaceKey}`)
            );
        }

        wrap.append(
            $("<p>")
                .addClass("vac-question-label")
                .append(
                    $("<span>")
                        .addClass("bp-question-number")
                        .text(`${questionNumber}. `)
                )
                .append(
                    $("<span>")
                        .attr("data-i18n", `[html]bp.${question.labelKey}`)
                )
        );

        if (question.helpKey) {
            wrap.append(
                $("<p>")
                    .addClass("bp-question-help")
                    .attr("data-i18n", `[html]bp.${question.helpKey}`)
            );
        }

        const answer = getAnswer(question.id);
        const isSingle = question.inputType === "single" || question.inputType === "singleText";
        let followUpsContainer = null;
        let textArea = null;

        const optionsEl = $("<div>").addClass(`radio-row vac-options ${isSingle ? "single-select" : "multi-select"}`);

        question.options.forEach((option) => {
            const optionEnabled = questionEnabled && isItemEnabled(option.labelKey);
            if (!optionEnabled) {
                clearOptionAnswer(question, option.id);
            }
            const isActive = isSingle
                ? answer.selected === option.id
                : Array.isArray(answer.selected) && answer.selected.includes(option.id);
            const chip = $("<button>")
                .attr("type", "button")
                .addClass("radio-chip")
                .toggleClass("active", isActive && optionEnabled)
                .toggleClass("disabled", !optionEnabled)
                .prop("disabled", !optionEnabled)
                .attr("aria-disabled", String(!optionEnabled))
                .attr("data-value", option.id)
                .attr("data-i18n", `[html]bp.${option.labelKey}`)
                .on("click", function () {
                    if (!isItemEnabled(question.labelKey) || !isItemEnabled(option.labelKey)) {
                        return;
                    }
                    updateSelection(question, option.id);
                    syncQuestionUi(question, wrap, true);
                    updateProgressIndicators();
                });

            optionsEl.append(chip);
        });

        wrap.append(optionsEl);

        if (question.inputType === "singleText" || question.inputType === "multiText") {
            textArea = $("<textarea>")
                .addClass("bp-free-text")
                .attr("data-i18n", "[placeholder]placeholder.free")
                .val(answer.text || "")
                .on("input", function () {
                    if (!isItemEnabled(question.labelKey)) {
                        return;
                    }
                    updateFreeText(question.id, $(this).val());
                    syncAnsweredFlag(question, wrap);
                    updateProgressIndicators();
                });
            toggleFreeTextAvailability(question, textArea);
            wrap.append(textArea);
        }

        if (Array.isArray(question.followUps) && question.followUps.length > 0) {
            followUpsContainer = $("<div>").addClass("followups");
            question.followUps.forEach((followUpQuestion, index) => {
                const followUpNumber = `${questionNumber}-${index + 1}`;
                const followUpEl = renderQuestion(followUpQuestion, followUpNumber)
                    .attr("data-followup-id", followUpQuestion.id);
                if (!shouldShowFollowUp(question, followUpQuestion)) {
                    followUpEl.hide();
                }
                followUpsContainer.append(followUpEl);
            });
            wrap.append(followUpsContainer);
        }
        syncAnsweredFlag(question, wrap);

        return wrap;
    }

    function syncQuestionUi(question, questionEl, animate = false) {
        if (!questionEl || !questionEl.length) {
            return;
        }
        const answer = getAnswer(question.id);
        const isSingle = question.inputType === "single" || question.inputType === "singleText";
        questionEl.children(".bp-options").find(".radio-chip").each(function () {
            const optionId = $(this).data("value");
            const option = getQuestionOptionById(question, optionId);
            const optionEnabled = isItemEnabled(question.labelKey) && (!option || isItemEnabled(option.labelKey));
            if (!optionEnabled) {
                clearOptionAnswer(question, optionId);
            }
            const isActive = isSingle
                ? answer.selected === optionId
                : Array.isArray(answer.selected) && answer.selected.includes(optionId);
            $(this)
                .toggleClass("active", isActive && optionEnabled)
                .toggleClass("disabled", !optionEnabled)
                .prop("disabled", !optionEnabled)
                .attr("aria-disabled", String(!optionEnabled));
        });

        const textArea = questionEl.children("textarea.bp-free-text");
        if (textArea.length) {
            textArea.val(answer.text || "");
            toggleFreeTextAvailability(question, textArea);
        }

        const followUpsContainer = questionEl.children(".followups");
        if (followUpsContainer.length) {
            toggleFollowUpsVisibility(question, followUpsContainer, animate);
        }
        syncAnsweredFlag(question, questionEl);
    }

    function toggleFollowUpsVisibility(parentQuestion, followUpsContainer, animate = false) {
        if (!followUpsContainer || !followUpsContainer.length || !Array.isArray(parentQuestion.followUps)) {
            return;
        }
        parentQuestion.followUps.forEach((followUpQuestion) => {
            const shouldShow = shouldShowFollowUp(parentQuestion, followUpQuestion);
            const followUpEl = followUpsContainer
                .children(`[data-followup-id="${followUpQuestion.id}"]`);
            if (!shouldShow) {
                clearQuestionAnswerDeep(followUpQuestion);
            }
            syncQuestionUi(followUpQuestion, followUpEl, animate);
            if (animate) {
                followUpEl.stop(true, true);
                if (shouldShow) {
                    followUpEl.slideDown(180);
                } else {
                    followUpEl.slideUp(160);
                }
            } else {
                followUpEl.toggle(shouldShow);
            }
        });
    }

    function clearQuestionAnswerDeep(question) {
        const answer = getAnswer(question.id);
        answer.selected = null;
        answer.text = "";
        if (Array.isArray(question.followUps)) {
            question.followUps.forEach((followUpQuestion) => clearQuestionAnswerDeep(followUpQuestion));
        }
    }

    function clearOptionAnswer(question, optionId) {
        const answer = getAnswer(question.id);
        if (Array.isArray(answer.selected)) {
            answer.selected = answer.selected.filter((selectedId) => selectedId !== optionId);
        } else if (answer.selected === optionId) {
            answer.selected = null;
        }
        if (!shouldEnableFreeText(question)) {
            answer.text = "";
        }
    }

    function isTextInputQuestion(question) {
        return question.inputType === "singleText" || question.inputType === "multiText";
    }

    function shouldEnableFreeText(question) {
        if (!isTextInputQuestion(question) || !Array.isArray(question.options)) {
            return false;
        }
        const triggerOptionIds = question.options
            .filter((option) => option.activatesText)
            .map((option) => option.id);
        if (triggerOptionIds.length === 0) {
            return true;
        }
        const selected = getAnswer(question.id).selected;
        if (Array.isArray(selected)) {
            return selected.some((value) => triggerOptionIds.includes(value));
        }
        return selected != null && triggerOptionIds.includes(selected);
    }

    function toggleFreeTextAvailability(question, textAreaEl) {
        if (!textAreaEl || !textAreaEl.length || !isTextInputQuestion(question)) {
            return;
        }
        textAreaEl.prop("disabled", !isItemEnabled(question.labelKey) || !shouldEnableFreeText(question));
    }

    function shouldShowPreface(question) {
        if (!question.showPrefaceWhen) {
            return true;
        }
        return isConditionMatch(question.showPrefaceWhen.questionId, question.showPrefaceWhen.is || []);
    }

    function shouldShowFollowUp(parentQuestion, followUpQuestion) {
        if (!isItemEnabled(parentQuestion.labelKey) || !isItemEnabled(followUpQuestion.labelKey)) {
            return false;
        }
        if (!Array.isArray(followUpQuestion.showWhenParentIs) || followUpQuestion.showWhenParentIs.length === 0) {
            return true;
        }
        const parentAnswer = getAnswer(parentQuestion.id).selected;
        if (Array.isArray(parentAnswer)) {
            return parentAnswer.some((value) => followUpQuestion.showWhenParentIs.includes(value));
        }
        return followUpQuestion.showWhenParentIs.includes(parentAnswer);
    }

    function isConditionMatch(questionId, requiredValues) {
        const selected = getAnswer(questionId).selected;
        if (Array.isArray(selected)) {
            return selected.some((value) => requiredValues.includes(value));
        }
        return requiredValues.includes(selected);
    }

    function getAnswer(questionId) {
        if (!state.answers[questionId]) {
            state.answers[questionId] = {selected: null, text: ""};
        }
        return state.answers[questionId];
    }

    function normalizeBirthPlanSettings(items) {
        const settings = {};
        if (!Array.isArray(items)) {
            return settings;
        }
        items.forEach((item) => {
            if (!item || typeof item !== "object") {
                return;
            }
            Object.keys(item).forEach((key) => {
                settings[key] = Number(item[key]);
            });
        });
        return settings;
    }

    function hasBirthPlanSettings(settings) {
        return settings && typeof settings === "object" && Object.keys(settings).length > 0;
    }

    function isItemEnabled(labelKey) {
        if (!labelKey || !Object.prototype.hasOwnProperty.call(state.birthPlanSettings, labelKey)) {
            return true;
        }
        return Number(state.birthPlanSettings[labelKey]) !== 0;
    }

    function getQuestionOptionById(question, optionId) {
        if (!question || !Array.isArray(question.options)) {
            return null;
        }
        return question.options.find((option) => option.id === optionId) || null;
    }

    function buildAnswersFromBirthPlanItems(schema, items) {
        const responseMap = normalizeBirthPlanAnswers(items);
        const answers = {};
        if (!schema || !Array.isArray(schema.categories)) {
            return answers;
        }
        schema.categories.forEach((category) => {
            if (!Array.isArray(category.sections)) {
                return;
            }
            category.sections.forEach((section) => {
                if (Array.isArray(section.questions)) {
                    mapBirthPlanItemsToAnswers(section.questions, responseMap, answers);
                }
            });
        });
        return answers;
    }

    function normalizeBirthPlanAnswers(items) {
        const responseMap = {};
        if (!Array.isArray(items)) {
            return responseMap;
        }
        items.forEach((item) => {
            if (!item || typeof item !== "object" || !item.responceKey) {
                return;
            }
            responseMap[item.responceKey] = {
                other: typeof item.other === "string" ? item.other : ""
            };
        });
        return responseMap;
    }

    function mapBirthPlanItemsToAnswers(questions, responseMap, answers) {
        if (!Array.isArray(questions)) {
            return;
        }
        questions.forEach((question) => {
            const isSingle = question.inputType === "single" || question.inputType === "singleText";
            const answer = {selected: isSingle ? null : [], text: ""};

            if (Array.isArray(question.options)) {
                question.options.forEach((option) => {
                    const item = responseMap[option.labelKey];
                    if (!item) {
                        return;
                    }
                    if (isSingle) {
                        answer.selected = option.id;
                    } else if (!answer.selected.includes(option.id)) {
                        answer.selected.push(option.id);
                    }
                    if (item.other) {
                        answer.text = item.other;
                    }
                });
            }

            if (responseMap[question.labelKey] && responseMap[question.labelKey].other) {
                answer.text = responseMap[question.labelKey].other;
            }

            if ((Array.isArray(answer.selected) && answer.selected.length > 0) || answer.selected != null || answer.text) {
                answers[question.id] = answer;
            }

            if (Array.isArray(question.followUps)) {
                mapBirthPlanItemsToAnswers(question.followUps, responseMap, answers);
            }
        });
    }

    function clearDisabledAnswersFromSchema(schema) {
        if (!schema || !Array.isArray(schema.categories)) {
            return;
        }
        schema.categories.forEach((category) => {
            if (!Array.isArray(category.sections)) {
                return;
            }
            category.sections.forEach((section) => {
                if (Array.isArray(section.questions)) {
                    clearDisabledAnswers(section.questions);
                }
            });
        });
    }

    function clearDisabledAnswers(questions) {
        if (!Array.isArray(questions)) {
            return;
        }
        questions.forEach((question) => {
            if (!isItemEnabled(question.labelKey)) {
                clearQuestionAnswerDeep(question);
                return;
            }
            if (Array.isArray(question.options)) {
                question.options.forEach((option) => {
                    if (!isItemEnabled(option.labelKey)) {
                        clearOptionAnswer(question, option.id);
                    }
                });
            }
            if (Array.isArray(question.followUps)) {
                clearDisabledAnswers(question.followUps);
            }
        });
    }

    function updateSelection(question, optionId) {
        const option = getQuestionOptionById(question, optionId);
        if (!isItemEnabled(question.labelKey) || (option && !isItemEnabled(option.labelKey))) {
            return;
        }
        const answer = getAnswer(question.id);
        const isSingle = question.inputType === "single" || question.inputType === "singleText";
        if (isSingle) {
            answer.selected = answer.selected === optionId ? null : optionId;
            return;
        }

        const list = Array.isArray(answer.selected) ? answer.selected.slice() : [];
        if (!list.includes(optionId)) {
            list.push(optionId);
        } else {
            list.splice(list.indexOf(optionId), 1);
        }
        answer.selected = list;
    }

    function updateFreeText(questionId, value) {
        const answer = getAnswer(questionId);
        answer.text = value;
    }

    function syncAnsweredFlag(question, questionEl) {
        if (!questionEl || !questionEl.length) {
            return;
        }
        const answered = isItemEnabled(question.labelKey) && isQuestionAnswered(question.id);
        questionEl.toggleClass("is-answered", answered);
        questionEl.toggleClass("is-unanswered", isItemEnabled(question.labelKey) && !answered);
    }

    function collectQuestionIdsFromSchema(schema) {
        const ids = [];
        if (!schema || !Array.isArray(schema.categories)) {
            return ids;
        }
        schema.categories.forEach((category) => {
            if (!Array.isArray(category.sections)) {
                return;
            }
            category.sections.forEach((section) => {
                if (!Array.isArray(section.questions)) {
                    return;
                }
                collectQuestionIds(section.questions, ids);
            });
        });
        return ids;
    }

    function collectQuestionIds(questions, ids) {
        if (!Array.isArray(questions)) {
            return;
        }
        questions.forEach((question) => {
            if (!isItemEnabled(question.labelKey)) {
                return;
            }
            ids.push(question.id);
            if (Array.isArray(question.followUps)) {
                collectQuestionIds(question.followUps, ids);
            }
        });
    }

    function isQuestionAnswered(questionId) {
        const answer = state.answers[questionId];
        if (!answer) {
            return false;
        }
        if (Array.isArray(answer.selected)) {
            return answer.selected.length > 0;
        }
        if (answer.selected != null) {
            return true;
        }
        return typeof answer.text === "string" && answer.text.trim().length > 0;
    }

    function updateProgressIndicators() {
        const total = state.totalQuestions || 0;
        const answered = countAnsweredQuestionsFromSchema(state.schema);
        const percent = total > 0 ? Math.round((answered / total) * 100) : 0;

        $("#globalProgress .bp-progress-text").text(`${answered} / ${total}`);
        $("#globalProgress .bp-progress-fill")
            .css("width", `${percent}%`)
            .attr("aria-valuenow", String(percent));
        $("#globalProgress .bp-progress-track").toggleClass("is-complete", percent >= 100);
    }

    function countAnsweredQuestionsFromSchema(schema) {
        if (!schema || !Array.isArray(schema.categories)) {
            return 0;
        }
        let answered = 0;
        schema.categories.forEach((category) => {
            if (!Array.isArray(category.sections)) {
                return;
            }
            category.sections.forEach((section) => {
                if (!Array.isArray(section.questions)) {
                    return;
                }
                section.questions.forEach((question) => {
                    answered += countAnsweredForQuestion(question);
                });
            });
        });
        return answered;
    }

    function countAnsweredForQuestion(question) {
        if (!isItemEnabled(question.labelKey)) {
            return 0;
        }
        let answered = isQuestionAnswered(question.id) ? 1 : 0;
        if (!Array.isArray(question.followUps)) {
            return answered;
        }
        const parentSelected = hasSelectedOption(question.id);

        question.followUps.forEach((followUpQuestion) => {
            if (shouldShowFollowUp(question, followUpQuestion)) {
                answered += countAnsweredForQuestion(followUpQuestion);
            } else if (parentSelected) {
                answered += countQuestionTreeSize(followUpQuestion);
            }
        });
        return answered;
    }

    function countQuestionTreeSize(question) {
        if (!isItemEnabled(question.labelKey)) {
            return 0;
        }
        let size = 1;
        if (!Array.isArray(question.followUps)) {
            return size;
        }
        question.followUps.forEach((followUpQuestion) => {
            size += countQuestionTreeSize(followUpQuestion);
        });
        return size;
    }

    function hasSelectedOption(questionId) {
        const answer = state.answers[questionId];
        if (!answer) {
            return false;
        }
        if (Array.isArray(answer.selected)) {
            return answer.selected.length > 0;
        }
        return answer.selected != null;
    }

    async function handleSaveDraft() {
        clearDisabledAnswersFromSchema(state.schema);

        const saveButton = $("#saveDraftBtn");
        saveButton.prop("disabled", true);
        $("#loadingOverlay").addClass('is-open');
        try {
            const saved = await saveBirthPlanAnswers(state.idToken, buildBirthPlanPostItems(state.schema));
            if (!saved) {
                return;
            }
        } finally {
            $("#loadingOverlay").removeClass('is-open');
            saveButton.prop("disabled", false);
        }

        const toastManager = createToastManager();
        toastManager.show({
            title: i18next.t("toast.success", "せいこう"),
            message: i18next.t("success.save", "ほぞんしました"),
            color: 'var(--success)',
            bg: 'var(--toast-bg-success)',
            icon: 'material-symbols:check-circle-rounded'
        });
    }

    function handleClearDraft() {
        state.answers = {};
        renderForm();
    }

    function saveBirthPlanAnswers(idToken, items) {
        console.log(items);
        return $.ajax({
            url: API_URL,
            type: "POST",
            dataType: "json",
            data: JSON.stringify({
                path: "birthplan",
                method: "post",
                idToken: idToken,
                postData: {
                    items: items
                }
            }),
            timeout: 30000,
        }).then(function (response) {
            if (response.statusCode === 401) {
                liff.logout();
                window.location.reload();
                return false;
            }
            if (response.statusCode !== 200) {
                console.error(response.message);
                alert(response.message);
                return false;
            }
            return true;
        }, function () {
            alert("Network error!saveBirthplan");
            return false;
        });
    }

    function buildBirthPlanPostItems(schema) {
        const items = [];
        if (!schema || !Array.isArray(schema.categories)) {
            return items;
        }
        schema.categories.forEach((category) => {
            if (!Array.isArray(category.sections)) {
                return;
            }
            category.sections.forEach((section) => {
                if (Array.isArray(section.questions)) {
                    appendBirthPlanPostItems(section.questions, items);
                }
            });
        });
        return items;
    }

    function appendBirthPlanPostItems(questions, items) {
        if (!Array.isArray(questions)) {
            return;
        }
        questions.forEach((question) => {
            if (!isItemEnabled(question.labelKey)) {
                return;
            }
            const answer = state.answers[question.id];
            if (answer && Array.isArray(question.options)) {
                const selectedIds = Array.isArray(answer.selected)
                    ? answer.selected
                    : (answer.selected != null ? [answer.selected] : []);
                selectedIds.forEach((optionId) => {
                    const option = getQuestionOptionById(question, optionId);
                    if (!option || !isItemEnabled(option.labelKey)) {
                        return;
                    }
                    const value = option.activatesText && answer.text ? answer.text : 1;
                    items.push({[option.labelKey]: value});
                });
            }
            if (Array.isArray(question.followUps)) {
                appendBirthPlanPostItems(question.followUps, items);
            }
        });
    }
</script>
