<!DOCTYPE html>
<html lang="ja" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>病院データ登録 | Pregnancy Support</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/i18next@23/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://unpkg.com/jquery-i18next@1/jquery-i18next.min.js"></script>
    <script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="../common/js/config.js"></script>
    <script src="../common/js/toast.js"></script>
    <link rel="stylesheet" href="../style.css"/>
    <style>
        .hospital-form {
            margin-top: 20px;
        }

        .main-container .hospital-section {
            margin-top: 20px;
        }

        .hospital-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 14px;
            color: var(--primary-dark);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.35;
            border-left: none;
            padding-left: 0;
        }

        .hospital-field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .hospital-field-full {
            grid-column: 1 / -1;
        }

        .hospital-badge {
            display: inline-flex;
            align-items: center;
            margin-left: 6px;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.45;
            vertical-align: middle;
        }

        .hospital-badge-required {
            background: var(--toast-bg-error);
            color: var(--error);
        }

        .hospital-badge-optional {
            background: var(--surface);
            color: var(--sub-text);
        }

        .hospital-actions {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            background: #fff;
            border-top: 1px solid var(--line);
            padding: 0 24px calc(10px + env(safe-area-inset-bottom));
            box-shadow: 0 -5px 5px 10px var(--background);
        }

        .hospital-actions .btn-column {
            margin-top: 0;
        }

        .hospital-secondary-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .hospital-danger-btn {
            background: var(--background);
            border: 2px solid var(--error);
            color: var(--error);
        }

        .hospital-qrcode-card.is-hidden {
            display: none;
        }

        .hospital-qrcode {
            width: 220px;
            max-width: 100%;
            height: auto;
            padding: 12px;
            background: var(--background);
            margin: 0 auto;
        }

        .hospital-download-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hospital-download-actions .btn {
            min-height: 56px;
            line-height: 1.35;
            text-align: center;
        }

        .hospital-form input:read-only {
            background: var(--surface);
            color: var(--sub-text);
        }

        .hospital-form select:disabled {
            opacity: 1;
            background-color: var(--surface);
            color: var(--sub-text);
        }

        .hospital-form input.is-invalid-field {
            border-color: var(--error);
            background: var(--toast-bg-error);
        }

        .hospital-actions .btn:disabled {
            background: var(--border);
            border-color: var(--border);
            color: var(--sub-text);
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .hospital-field-warning {
            display: none;
            margin: 6px 0 0;
            color: var(--error);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.45;
        }

        .hospital-field-warning.is-visible {
            display: block;
        }

        main {
            padding-bottom: 170px;
        }

        @media (max-width: 520px) {
            .hospital-field-grid,
            .hospital-secondary-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div id="header-container" class="header-wrapper"></div>

<main>
    <article class="main-container">
        <h1>病院データ登録/編集</h1>
        <p class="desc">
            以下の病院データを登録すると、病院QRコードが発行されます。<br>
            発行された病院QRコードを患者さまにご提示し、病院設定の画面から病院QRコードを読み取るようご依頼ください。<br>
            患者さまからの共有データ（予防接種記録、バースプラン、EPDSなど）を閲覧できるようになります。
        </p>
        <form name="form_hospital" class="h-adr hospital-form">
            <section class="card hospital-section">
                <h2 class="hospital-section-title">
                    <iconify-icon icon="material-symbols:local-hospital-rounded" width="24" height="24" aria-hidden="true"></iconify-icon>
                    <span>病院名</span>
                </h2>
                <div class="hospital-field-grid">
                    <label>
                        病院名（日本語）<span class="hospital-badge hospital-badge-required">必須</span>
                        <input class="hospital_name_placeholder" type="text" autocomplete="organization" required>
                    </label>
                    <label>
                        病院名（英語）<span class="hospital-badge hospital-badge-required">必須</span>
                        <input class="hospital_name_en_placeholder" type="text" autocomplete="organization" required>
                    </label>
                    <label class="hospital-field-full">
                        病院名（ふりがな）<span class="hospital-badge hospital-badge-required">必須</span>
                        <input class="hospital_name_furigana_placeholder" type="text" autocomplete="off" required>
                    </label>
                </div>
            </section>

            <section class="card hospital-section">
                <h2 class="hospital-section-title">
                    <iconify-icon icon="material-symbols:location-on-rounded" width="24" height="24" aria-hidden="true"></iconify-icon>
                    <span>住所</span>
                </h2>
                <span class="p-country-name" style="display:none;">Japan</span>
                <div class="hospital-field-grid">
                    <label>
                        郵便番号<span class="hospital-badge hospital-badge-required">必須</span>
                        <input type="text" class="hospital_postalcode_placeholder p-postal-code js-halfwidth-number-field" maxlength="16" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]+" title="半角数字のみ入力できます" required>
                        <span class="hospital-field-warning">半角数字のみ入力できます。</span>
                    </label>
                    <label>
                        都道府県<span class="hospital-badge hospital-badge-required">必須</span>
                        <select id="region" class="hospital_address1_placeholder p-region" required>
                                <option value=""></option>
                                <option value="北海道">北海道</option>
                                <option value="青森県">青森県</option>
                                <option value="秋田県">秋田県</option>
                                <option value="岩手県">岩手県</option>
                                <option value="山形県">山形県</option>
                                <option value="宮城県">宮城県</option>
                                <option value="福島県">福島県</option>
                                <option value="茨城県">茨城県</option>
                                <option value="栃木県">栃木県</option>
                                <option value="群馬県">群馬県</option>
                                <option value="千葉県">千葉県</option>
                                <option value="埼玉県">埼玉県</option>
                                <option value="東京都">東京都</option>
                                <option value="神奈川県">神奈川県</option>
                                <option value="新潟県">新潟県</option>
                                <option value="長野県">長野県</option>
                                <option value="山梨県">山梨県</option>
                                <option value="静岡県">静岡県</option>
                                <option value="愛知県">愛知県</option>
                                <option value="岐阜県">岐阜県</option>
                                <option value="三重県">三重県</option>
                                <option value="富山県">富山県</option>
                                <option value="石川県">石川県</option>
                                <option value="福井県">福井県</option>
                                <option value="和歌山県">和歌山県</option>
                                <option value="奈良県">奈良県</option>
                                <option value="滋賀県">滋賀県</option>
                                <option value="京都府">京都府</option>
                                <option value="大阪府">大阪府</option>
                                <option value="兵庫県">兵庫県</option>
                                <option value="岡山県">岡山県</option>
                                <option value="広島県">広島県</option>
                                <option value="山口県">山口県</option>
                                <option value="鳥取県">鳥取県</option>
                                <option value="島根県">島根県</option>
                                <option value="徳島県">徳島県</option>
                                <option value="香川県">香川県</option>
                                <option value="高知県">高知県</option>
                                <option value="愛媛県">愛媛県</option>
                                <option value="福岡県">福岡県</option>
                                <option value="佐賀県">佐賀県</option>
                                <option value="長崎県">長崎県</option>
                                <option value="大分県">大分県</option>
                                <option value="宮崎県">宮崎県</option>
                                <option value="熊本県">熊本県</option>
                                <option value="鹿児島県">鹿児島県</option>
                                <option value="沖縄県">沖縄県</option>
                            </select>
                    </label>
                    <label class="hospital-field-full">
                        市区町村<span class="hospital-badge hospital-badge-required">必須</span>
                        <input type="text" id="locality" class="hospital_address2_placeholder p-locality" autocomplete="address-level2" required>
                    </label>
                    <label class="hospital-field-full">
                        町域<span class="hospital-badge hospital-badge-required">必須</span>
                        <input type="text" id="street-address" class="hospital_address3_placeholder p-street-address" autocomplete="address-level3" required>
                    </label>
                    <label class="hospital-field-full">
                        それ以降<span class="hospital-badge hospital-badge-required">必須</span>
                        <input type="text" id="extended-address" class="hospital_address4_placeholder p-extended-address" autocomplete="street-address" required>
                    </label>
                </div>
            </section>

            <section class="card hospital-section">
                <h2 class="hospital-section-title">
                    <iconify-icon icon="material-symbols:phone-in-talk-rounded" width="24" height="24" aria-hidden="true"></iconify-icon>
                    <span>電話番号</span>
                </h2>
                <div class="hospital-field-grid">
                    <label class="hospital-field-full">
                        代表電話番号<span class="hospital-badge hospital-badge-required">必須</span>
                        <input class="phone_number1_placeholder js-halfwidth-number-field" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9]+" title="半角数字のみ入力できます" required>
                        <span class="hospital-field-warning">半角数字のみ入力できます。</span>
                    </label>
                    <label>
                        産科外来電話番号<span class="hospital-badge hospital-badge-optional">任意</span>
                        <input class="phone_number2_placeholder js-halfwidth-number-field" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9]*" title="半角数字のみ入力できます">
                        <span class="hospital-field-warning">半角数字のみ入力できます。</span>
                    </label>
                    <label>
                        夜間（診察時間外）電話番号<span class="hospital-badge hospital-badge-optional">任意</span>
                        <input class="phone_number3_placeholder js-halfwidth-number-field" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9]*" title="半角数字のみ入力できます">
                        <span class="hospital-field-warning">半角数字のみ入力できます。</span>
                    </label>
                </div>
            </section>

            <div class="hospital-actions">
                <div class="fixed-container">
                    <div class="btn-column">
                        <button type="button" class="btn btn_register">
                            <iconify-icon icon="material-symbols:save-rounded" width="22" height="22" aria-hidden="true"></iconify-icon>
                            <span>登録</span>
                        </button>
                        <div class="hospital-secondary-actions">
                            <button type="button" class="btn hospital-edit-btn btn_edit">
                                <iconify-icon icon="material-symbols:edit" width="22" height="22" aria-hidden="true"></iconify-icon>
                                <span>編集</span>
                            </button>
                            <button type="button" class="btn hospital-danger-btn btn_delete">
                                <iconify-icon icon="material-symbols:delete-rounded" width="22" height="22" aria-hidden="true"></iconify-icon>
                                <span>削除</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <section class="hospital-qrcode-card is-hidden">
            <h2>病院QRコード</h2>
            <p class="desc">以下のQRコードを患者さまに提示してください。</p>
            <div class="row-list">
                <div class="card">
                    <div class="state-card-inner">
                        <iconify-icon icon="material-symbols:info-rounded" width="24" height="24" style="color:var(--info-state)"></iconify-icon>
                        <div>
                            <p class="small">このQRコードは固定なので、病院データを編集しても、QRコードや案内シートを差し替える必要はありません。</p>
                        </div>
                    </div>
                </div>
                <img src="" class="qrcode hospital-qrcode" alt="病院QRコード">
            </div>
            <div class="btn-column">
                <a href="" type="button" class="btn tertiary hospital-download-btn btn_download">
                    <iconify-icon icon="material-symbols:download-rounded" width="22" height="22" aria-hidden="true"></iconify-icon>
                    <span>病院QRコードのみをダウンロード</span>
                </a>
                <button type="button" class="btn btn_sheet" data-qrcode="" data-qrsheet="">
                    <iconify-icon icon="material-symbols:download-rounded" width="22" height="22" aria-hidden="true"></iconify-icon>
                    <span>病院QRコードの案内シートをダウンロード</span>
                </button>
            </div>
        </section>

    </article>
</main>

<div class="overlay is-open" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script>
    const currentPage = "hospital";

    /** @type {import('@line/liff').Liff} */
    const liff = window.liff;

    $(function () {
        const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";

        liff.init({
            liffId: LIFF_ID, // Use own liffId
            withLoginOnExternalBrowser: !isDev, // Enable automatic login process
        }).then(() => {
            return Promise.all([
                main(liff.getIDToken()),
                loadHeader()
            ]);
        }).then(() => {
            $("#loadingOverlay").removeClass('is-open');
        }).catch((err) => {
            console.error("LIFF init failed:", err);
            alert("LIFF init failed.");
        });

        $(".btn_register").on("click", function(e){
            if (!$('form[name="form_hospital"]')[0].reportValidity()) {
                return false;
            } else {
                setHospital(liff.getIDToken());
            }
        });
        $(".btn_edit").on("click", function(e){
            editHospital(liff.getIDToken());
        });
        $(".btn_delete").on("click", function(e){
            deleteHospital(liff.getIDToken());
        });
        $(".btn_download").on("click", function(e){
            e.preventDefault();
            const url = $(".btn_download").attr("href");
            liff.openWindow({
                url: url,
                external: true,
            });
        });
        $(".btn_sheet").on("click", function(e){
            e.preventDefault();
            downloadSheet(liff.getIDToken());
        });
        $(".js-halfwidth-number-field").on("input", function () {
            toggleHalfwidthNumberWarning(this);
            updateRegisterButtonState();
        });
        $('form[name="form_hospital"]').on("input change", "input, select", function () {
            updateRegisterButtonState();
        });
    });

    async function main(idToken) {
        try {
            const response = await $.ajax(
                getAccessObj({
                    path: "hospital",
                    method : "get",
                    idToken: idToken
                })
            );

            if(response.statusCode === 401){
                liff.logout();
                window.location.reload();
                return;
            }
            else if(response.statusCode !== 200){
                console.error(response.message);
                alert(response.message);
                return;
            }
            else {
                const data = response.data || {};
                $(".hospital_name_placeholder").val(data.hospitalName || "");
                $(".hospital_name_en_placeholder").val(data.hospitalNameEn || "");
                $(".hospital_name_furigana_placeholder").val(data.hospitalNameFurigana || "");
                $(".hospital_postalcode_placeholder").val(data.hospitalPostalcode || "");
                $(".hospital_address1_placeholder").val(data.hospitalAddress1 || "");
                $(".hospital_address2_placeholder").val(data.hospitalAddress2 || "");
                $(".hospital_address3_placeholder").val(data.hospitalAddress3 || "");
                $(".hospital_address4_placeholder").val(data.hospitalAddress4 || "");
                $(".phone_number1_placeholder").val(data.phoneNumber1 || "");
                $(".phone_number2_placeholder").val(data.phoneNumber2 || "");
                $(".phone_number3_placeholder").val(data.phoneNumber3 || "");
                setQrCodeData(data);
                refreshHalfwidthNumberWarnings();

                setHospitalMode(Boolean(data.hospitalName));
            }
        } catch (error) {
            console.error("main failed:", error);
            alert("Network error!");
        }
    }

    function loadHeader() {
        return new Promise((resolve, reject) => {
            $("#header-container").load("../common/header.html", function (responseText, status) {
                if (status === "error") {
                    reject(new Error("Failed to load header.html"));
                    return;
                }

                $.getScript("../common/js/header2.js")
                    .done(function () {
                        resolve();
                    })
                    .fail(function () {
                        reject(new Error("Failed to load header2.js"));
                    });
            });
        });
    }

    const getAccessObj = (data) => {
        return {
            url: API_URL,
            type: "POST",
            dataType: "json",
            data: JSON.stringify(data),
            timeout: 30000,
        }
    }

    const hospitalFieldSelectors = [
        ".hospital_name_placeholder",
        ".hospital_name_en_placeholder",
        ".hospital_name_furigana_placeholder",
        ".hospital_postalcode_placeholder",
        ".hospital_address1_placeholder",
        ".hospital_address2_placeholder",
        ".hospital_address3_placeholder",
        ".hospital_address4_placeholder",
        ".phone_number1_placeholder",
        ".phone_number2_placeholder",
        ".phone_number3_placeholder"
    ];

    function toggleHalfwidthNumberWarning(field) {
        const hasInvalidValue = /[^0-9]/.test(field.value);
        $(field).toggleClass("is-invalid-field", hasInvalidValue);
        $(field).siblings(".hospital-field-warning").toggleClass("is-visible", hasInvalidValue);
    }

    function hasRequiredEmptyField() {
        return $('form[name="form_hospital"]')
            .find("[required]")
            .toArray()
            .some((field) => !String($(field).val()).trim());
    }

    function hasInvalidHalfwidthNumberField() {
        return $(".js-halfwidth-number-field")
            .toArray()
            .some((field) => /[^0-9]/.test(field.value));
    }

    function updateRegisterButtonState() {
        $(".btn_register").prop("disabled", hasRequiredEmptyField() || hasInvalidHalfwidthNumberField());
        $(".btn_edit").prop("disabled", hasRequiredEmptyField() || hasInvalidHalfwidthNumberField());
    }

    function refreshHalfwidthNumberWarnings() {
        $(".js-halfwidth-number-field").each(function () {
            toggleHalfwidthNumberWarning(this);
        });
        updateRegisterButtonState();
    }

    function setHospitalFormReadonly(isReadonly) {
        hospitalFieldSelectors.forEach((selector) => {
            const field = $(selector);
            if (field.is("select")) {
                field.prop("disabled", isReadonly);
            } else {
                field.prop("readOnly", isReadonly);
            }
        });
    }

    function setHospitalMode(hasHospital) {
        $(".btn_delete").toggle(hasHospital);
        $(".btn_edit").toggle(hasHospital);
        $(".btn_register").toggle(!hasHospital);
        $(".hospital-qrcode-card").toggleClass("is-hidden", !hasHospital);
        $(".btn_download").toggle(hasHospital);
        $(".btn_sheet").toggle(hasHospital);
        setHospitalFormReadonly(hasHospital);
        updateRegisterButtonState();
    }

    function setQrCodeData(data) {
        $(".qrcode").attr("src", data.qrcodeImageUrl || "");
        $(".btn_download").attr("href", data.qrcodeDownloadUrl || "");
        $(".btn_sheet")
            .attr({
                "data-qrcode": data.qrcodeId || "",
                "data-qrsheet": data.qrSheetId || ""
            })
            .data("qrcode", data.qrcodeId || "")
            .data("qrsheet", data.qrSheetId || "");
    }

    function getHospitalPostData() {
        return {
            hospitalName: $(".hospital_name_placeholder").val(),
            hospitalNameEn: $(".hospital_name_en_placeholder").val(),
            hospitalNameFurigana: $(".hospital_name_furigana_placeholder").val(),
            hospitalPostalcode: $(".hospital_postalcode_placeholder").val(),
            hospitalAddress1: $(".hospital_address1_placeholder").val(),
            hospitalAddress2: $(".hospital_address2_placeholder").val(),
            hospitalAddress3: $(".hospital_address3_placeholder").val(),
            hospitalAddress4: $(".hospital_address4_placeholder").val(),
            phoneNumber1: $(".phone_number1_placeholder").val(),
            phoneNumber2: $(".phone_number2_placeholder").val(),
            phoneNumber3: $(".phone_number3_placeholder").val()
        };
    }

    function setHospital(idToken){
        $("#loadingOverlay").addClass('is-open');
        $.ajax(
            getAccessObj({
                path: "hospital",
                method : "post",
                idToken: idToken,
                postData: getHospitalPostData()
            })
        ).done(function(response) {
            if(response.statusCode === 401){
                liff.logout();
                window.location.reload();
            }
            else if(response.statusCode !== 200){
                console.error(response.message);
                alert(response.message);
            }
            else {
                setQrCodeData(response.data || {});

                setHospitalMode(true);

                const toastManager = createToastManager();
                toastManager.show({
                    title: "成功",
                    message: "保存しました",
                    color: 'var(--success)',
                    bg: 'var(--toast-bg-success)',
                    icon: 'material-symbols:check-circle-rounded'
                });
            }
            $("#loadingOverlay").removeClass('is-open');
        }).fail(function(XMLHttpRequest, textStatus, errorThrown) {
            $("#loadingOverlay").removeClass('is-open');
            alert("Network error!");
        });
    }

    function deleteHospital(idToken){
        $("#loadingOverlay").addClass('is-open');
        $.ajax(
            getAccessObj({
                path: "hospital",
                method : "delete",
                idToken: idToken
            })
        ).done(function(response) {
            if(response.statusCode === 401){
                liff.logout();
                window.location.reload();
            }
            else if(response.statusCode !== 200){
                console.error(response.message);
                alert(response.message);
            }
            else {
                setQrCodeData({});

                hospitalFieldSelectors.forEach((selector) => $(selector).val(""));
                refreshHalfwidthNumberWarnings();
                setHospitalMode(false);

                const toastManager = createToastManager();
                toastManager.show({
                    title: "成功",
                    message: "削除しました",
                    color: 'var(--success)',
                    bg: 'var(--toast-bg-success)',
                    icon: 'material-symbols:check-circle-rounded'
                });
            }
            $("#loadingOverlay").removeClass('is-open');
        }).fail(function(XMLHttpRequest, textStatus, errorThrown) {
            $("#loadingOverlay").removeClass('is-open');
            alert("Network error!");
        });
    }

    function editHospital(){
        $(".btn_delete").hide();
        $(".btn_edit").hide();
        $(".btn_register").show();
        setHospitalFormReadonly(false);
        updateRegisterButtonState();
    }

    function downloadSheet(idToken){
        $("#loadingOverlay").addClass('is-open');
        $.ajax(
            getAccessObj({
                path: "qrsheet",
                method : "post",
                idToken: idToken,
                postData: {
                    qrcodeId: $(".btn_sheet").data("qrcode"),
                    qrSheetId: $(".btn_sheet").data("qrsheet"),
                }
            })
        ).done(function(response) {
            if(response.statusCode === 401){
                liff.logout();
                window.location.reload();
            }
            else if(response.statusCode !== 200){
                console.error(response.message);
                alert(response.message);
            }
            else {
                liff.openWindow({
                    url: response.data.qrSheetDownloadUrl,
                    external: true,
                });
            }
            $("#loadingOverlay").removeClass('is-open');
        }).fail(function(XMLHttpRequest, textStatus, errorThrown) {
            alert("Network error!");
            $("#loadingOverlay").removeClass('is-open');
        });
    }

</script>
</body>
</html>
