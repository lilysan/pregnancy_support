        dialog.classList.remove("is-hidden");

      function closeLanguageDialog() {
        const dialog = document.getElementById("languageDialog");
        dialog.classList.add("is-hidden");
        dialog.style.display = "none";
      }

      function loadInitialLanguage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && languageOptions.some((lang) => lang.code === saved))
          return saved;
        return detectInitialLanguage();
      }

      function detectInitialLanguage() {
        const raw = String(navigator.language || "en-US").toLowerCase();
        if (raw.startsWith("ja")) return "ja";
        if (raw.startsWith("zh")) return "zh";
        if (raw.startsWith("fr")) return "fr";
        if (raw.startsWith("ko")) return "ko";
        if (raw.startsWith("pt")) return "pr";
        if (raw.startsWith("tl") || raw.startsWith("fil")) return "tl";
        if (raw.startsWith("vi")) return "ve";
        if (raw.startsWith("th")) return "th";
        if (raw.startsWith("de")) return "de";
        if (raw.startsWith("id")) return "id";
        if (raw.startsWith("ru")) return "ru";
        if (raw.startsWith("ne")) return "ne";
        if (raw.startsWith("lo")) return "lo";
        if (raw.startsWith("uk")) return "uk";
        if (raw.startsWith("fa")) return "fa-AF";
        if (raw.startsWith("si")) return "si";
        if (raw.startsWith("ms")) return "ms";
        if (raw.startsWith("my")) return "my";
        if (raw.startsWith("bn")) return "bn";
        if (raw.startsWith("ur")) return "ur";
        return "en-US";
      }

      function getI18nLanguage(langCode) {
        const supported = new Set(languageOptions.map((lang) => lang.code));
        return supported.has(langCode) ? langCode : "en-US";
      }

      async function initI18n(langCode) {
        if (!window.i18next) return;
        const target = getI18nLanguage(langCode);
        if (!i18next.isInitialized) {
          await i18next.use(i18nextHttpBackend).init({
            lng: target,
            fallbackLng: "en-US",
            backend: {
              loadPath: "./i18n/{{lng}}.json",
            },
          });
          return;
        }
        await i18next.changeLanguage(target);
      }

      function tr(key, fallback, options) {
        if (!window.i18next || !i18next.isInitialized) return fallback || "";
        const value = i18next.t(key, options || {});
        return value === key ? fallback || "" : value;
      }

      function renderLanguageButtons() {
        syncHeaderLanguageLabel();
        const list = document.getElementById("languageOptionList");
        list.innerHTML = "";
        languageOptions.forEach((lang) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className =
            "language-option-btn" +
            (selectedLanguage === lang.code ? " active" : "");
          btn.textContent = lang.label;
          btn.addEventListener("click", async () => {
            selectedLanguage = lang.code;
            localStorage.setItem(STORAGE_KEY, selectedLanguage);
            await initI18n(selectedLanguage);
            closeLanguageDialog();
            renderLanguageButtons();
            renderDialogText();
            renderTagFilters();
            renderQaList();
          });
          list.appendChild(btn);
        });
      }

      function syncHeaderLanguageLabel() {
        const currentLanguageLabel = document.getElementById("currentLanguage");
        if (!currentLanguageLabel) return;
        const shortLabels = {
          ja: "やさしい",
          "en-US": "English",
          zh: "中文",
          fr: "Français",
          ko: "한국어",
          pr: "Português",
          tl: "Tagalog",
          ve: "Tiếng Việt",
          th: "ภาษาไทย",
          de: "Deutsch",
          id: "Indonesia",
          ru: "Русский",
          ne: "नेपाली",
          lo: "ລາວ",
          uk: "Українська",
          "fa-AF": "دری",
          si: "සිංහල",
          ms: "Melayu",
          my: "မြန်မာ",
          bn: "বাংলা",
          ur: "اردو",
        };
        currentLanguageLabel.textContent =
          shortLabels[selectedLanguage] || "Language";
      }

      function renderDialogText() {
        document.getElementById("languageSettingBtn").textContent =
          tr("settings", "言語設定");
        document.getElementById("languageDialogTitle").textContent =
          tr("settings", "設定");
        document.getElementById("languageSectionTitle").textContent =
          tr("language", "言語設定");
        document.getElementById("closeLanguageBtn").textContent = tr(
          "close",
          "閉じる",
        );
        document.getElementById("pageTitle").textContent = tr(
          "page_title",
          "妊娠中の性交渉について",
        );
        document.getElementById("pageLead").textContent =
          tr(
            "page_lead",
            "妊婦さんとパートナーが、安全と安心を大切にしながら確認できる情報をまとめています。",
          );
        document.getElementById("keywordSearchLabel").textContent =
          tr("keyword_search", "フリーワード検索");
        document.getElementById("keywordSearch").placeholder =
          tr("keyword_placeholder", "質問や答えを入力");
        document.getElementById("tagSearchLabel").textContent = tr(
          "tag_search",
          "タグ検索",
        );
        renderTagFilters();
      }

      function renderTagFilters() {
        const container = document.getElementById("tagFilterList");
        const tags = Array.from(
          new Set(qaItems.flatMap((item) => item.tags || [])),
        );
        const filters = [
          {
            id: "all",
            label: tr("all_tags", "すべて"),
          },
          ...tags.map((tag) => ({
            id: tag,
            label: tag,
          })),
        ];
        container.innerHTML = "";
        filters.forEach((tag) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className =
            "tag-filter-btn" + (selectedTag === tag.id ? " active" : "");
          btn.innerHTML = escapeHtml(
            tag.id === "all" ? tag.label : translateTag(tag.label),
          );
          btn.addEventListener("click", () => {
            selectedTag = tag.id;
            renderTagFilters();
            renderQaList();
          });
          container.appendChild(btn);
        });
      }

      function renderQaList() {
        const list = document.getElementById("qaList");
        list.innerHTML = "";
        const filteredItems = qaItems.filter(matchesFilter);
        document.getElementById("searchResultMeta").textContent =
          filteredItems.length
            ? tr("result_count", `${filteredItems.length} 件表示`, {
                count: filteredItems.length,
              })
            : tr("no_result", "該当する項目はありません。");

        filteredItems.forEach((item, index) => {
          const details = document.createElement("details");
          details.className = "qa-card";
          if (index === 0) details.open = true;
          const primaryQuestion = getPrimaryQuestion(item);

          const summary = document.createElement("summary");
          summary.className = "qa-summary";
          summary.innerHTML = `
          <p class="qa-ja">${escapeHtml(primaryQuestion)}</p>
        `;

          const panel = document.createElement("div");
          panel.className = "qa-panel";
          panel.appendChild(buildAnswerBlock(item));

          details.appendChild(summary);
          details.appendChild(panel);
          list.appendChild(details);
        });
      }

      function matchesFilter(item) {
        const tagMatch =
          selectedTag === "all" || (item.tags || []).includes(selectedTag);
        if (!tagMatch) return false;
        if (!keyword) return true;
        const haystack = [
          item.jaQ,
          item.enQ,
          item.jaA,
          item.enA,
          getPrimaryQuestion(item),
          getPrimaryAnswer(item),
          ...(item.tags || []),
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(keyword);
      }

      function getItemIndex(item) {
        const index = Number(String(item.jaQ || "").match(/^(\d+)/)?.[1] || 0);
        return index;
      }

      function getPrimaryQuestion(item) {
        const index = getItemIndex(item);
        return tr(`item_${index}_title`, item.jaQ || "");
      }

      function getPrimaryAnswer(item) {
        const index = getItemIndex(item);
        return tr(`item_${index}_detail`, item.jaA || "");
      }

      function translateTag(tag) {
        const key = tagTranslationKeys[tag];
        return key ? tr(key, tag) : tag;
      }

      function renderBilingualText(jaText, translatedText) {
        if (
          selectedLanguage === "ja" ||
          !translatedText ||
          translatedText === jaText
        ) {
          return escapeHtml(jaText);
        }
        return `<span class="chip-ja">${escapeHtml(jaText)}</span><span class="chip-tr">${escapeHtml(translatedText)}</span>`;
      }

      function buildAnswerBlock(item) {
        const block = document.createElement("div");
        block.className = "answer-block";

        const label = document.createElement("p");
        label.className = "answer-label";
        label.textContent = "A";
        block.appendChild(label);

        const p = document.createElement("p");
        p.className = "answer-ja answer-preline";
        p.textContent = getPrimaryAnswer(item);
        block.appendChild(p);

        if (Array.isArray(item.answerBlocks) && item.answerBlocks.length) {
          item.answerBlocks.forEach((part) => {
            if (part.type === "text") {
              return;
            }
            if (part.type === "image") {
              const figure = document.createElement("figure");
              figure.className = "answer-image-frame";
              const img = document.createElement("img");
              img.className = "answer-image";
              img.src = part.src;
              img.alt = part.alt || "";
              const caption = document.createElement("figcaption");
              caption.className = "answer-image-credit";
              caption.textContent = "Created by ChatGPT";
              figure.appendChild(img);
              figure.appendChild(caption);
              block.appendChild(figure);
            }
          });
        }

        return block;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    </script>
  </body>
</html>
