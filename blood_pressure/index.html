<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blood Pressure Tracker</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/i18next@23/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://unpkg.com/jquery-i18next@1/jquery-i18next.min.js"></script>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <script src="../common/js/config.js"></script>
    <script src="../common/js/toast.js"></script>
    <link rel="stylesheet" href="../style.css" />
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.13.18/jquery.timepicker.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="header-container" class="header-wrapper"></div>

    <div class="loader is-hidden">
      <div class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>

    <main>
      <article class="main-container blood-pressure-main">
        <h1 class="title_bp" id="titleBp">血圧記録</h1>
        <button
          type="button"
          id="openAddFormBtn"
          class="open-add-form-btn"
          onclick="openAddForm()"
        >
          データを追加
        </button>
        <!-- データ追加フォーム -->
        <div id="addFormPanel" class="add-form-panel" aria-hidden="true">
          <form id="addDataForm">
            <label for="date" id="labelDate">日付</label>
            <input type="text" id="date" placeholder="日付を選択" /><br />
            <label for="periodSelect" id="labelPeriod">時間</label>
            <section class="dropdown">
              <select id="periodSelect">
                <option value="1" id="periodMorning">朝</option>
                <option value="2" id="periodNoon">昼</option>
                <option value="3" id="periodNight">夜</option>
              </select>
            </section>
            <br />
            <label for="higth" id="labelHigh">最高血圧</label>
            <input
              type="number"
              id="higth"
              class="high"
              placeholder="最高血圧"
            /><br />
            <label for="low" id="labelLow">最低血圧</label>
            <input
              type="number"
              id="low"
              class="low"
              placeholder="最低血圧"
            /><br />
            <span id="labelMedicine" class="form-group-label">内服</span>
            <div
              id="medicine"
              class="medicine medicine-radio-group"
              role="radiogroup"
              aria-labelledby="labelMedicine"
            >
              <label class="medicine-radio-option" for="medicineNone">
                <input
                  type="radio"
                  id="medicineNone"
                  name="medicineStatus"
                  value="なし"
                  checked
                />
                <span id="medicineNoneLabel">なし</span>
              </label>
              <label class="medicine-radio-option" for="medicineYes">
                <input
                  type="radio"
                  id="medicineYes"
                  name="medicineStatus"
                  value="あり"
                />
                <span id="medicineYesLabel">あり</span>
              </label>
            </div>
            <button type="button" id="adddata">登録</button>
            <button type="button" id="closeAddFormBtn" onclick="closeAddForm()">
              閉じる
            </button>
          </form>
        </div>
        <div id="chart-container-all">
          <div id="chart-container" class="chart-container active-content">
            <h2 id="chartRangeTitle" class="chart-range-title"></h2>
            <canvas id="bloodPressureChart"></canvas>
          </div>

          <div id="olderChartsContainer" class="older-charts-container"></div>
          <button type="button" id="loadOlderChartBtn" class="load-older-btn">
            以前の情報をみる
          </button>
        </div>
        <div id="table-container" class="table-container content">
          <!-- データ編集テーブル -->

          <table id="table">
            <thead>
              <tr>
                <th>日付</th>
                <th id="thPeriod">時間帯</th>
                <th id="thHigh">最高血圧</th>
                <th id="thLow">最低血圧</th>
                <th id="thMedicine">内服</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <button type="button" id="loadOlderTableBtn" class="load-older-btn">
            以前の情報をみる
          </button>
        </div>

        <div id="edit-container" class="edit-container content">
          <div id="edit_table">
            <div id="edit_table_container">
              <!-- データ編集テーブル -->
              <table id="editTable">
                <thead>
                  <tr>
                    <th>日付</th>
                    <th id="ethPeriod">時間帯</th>
                    <th id="ethHigh">最高血圧</th>
                    <th id="ethLow">最低血圧</th>
                    <th id="ethMedicine">内服</th>
                    <th id="ethEdit">編集</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <button type="button" id="loadOlderEditBtn" class="load-older-btn">
            以前の情報をみる
          </button>
        </div>

        <!-- ダイアログ -->
        <div id="editDialog" class="is-hidden">
          <form id="editForm">
            <label for="editDate" id="editDateLabel">日付</label>
            <input type="text" id="editDate" class="datepicker2" /><br /><br />

            <label for="editPeriod" id="editPeriodLabel">時間</label>
            <select id="editPeriod" class="periodpicker2">
              <option value="1" id="editPeriodMorning">朝</option>
              <option value="2" id="editPeriodNoon">昼</option>
              <option value="3" id="editPeriodNight">夜</option></select
            ><br /><br />

            <label for="editHigh" id="editHighLabel">最高血圧</label>
            <input type="number" id="editHigh" class="high2" /><br /><br />
            <label for="editLow" id="editLowLabel">最低血圧</label>
            <input type="number" id="editLow" class="low2" /><br /><br />
            <span id="editMedicineLabel" class="form-group-label">内服</span>
            <div
              id="editMedicine"
              class="medicine2 medicine-radio-group"
              role="radiogroup"
              aria-labelledby="editMedicineLabel"
            >
              <label class="medicine-radio-option" for="editMedicineNone">
                <input
                  type="radio"
                  id="editMedicineNone"
                  name="editMedicineStatus"
                  value="なし"
                  checked
                />
                <span id="editMedicineNoneLabel">なし</span>
              </label>
              <label class="medicine-radio-option" for="editMedicineYes">
                <input
                  type="radio"
                  id="editMedicineYes"
                  name="editMedicineStatus"
                  value="あり"
                />
                <span id="editMedicineYesLabel">あり</span>
              </label>
            </div>
            <br /><br />

            <button type="button" id="saveButton">保存</button>
            <button type="button" id="cancelButton">キャンセル</button>
            <button type="button" id="deleteButton">削除</button>
          </form>
        </div>

        <!-- 下部タブメニュー -->
        <div class="tab-bar">
          <button
            id="tabChart"
            class="tab-button active"
            onclick="switchTab('chart-container', event)"
          >
            グラフ
          </button>
          <button
            id="tabTable"
            class="tab-button"
            onclick="switchTab('table-container', event)"
          >
            テーブル
          </button>
          <button
            id="tabEdit"
            class="tab-button"
            onclick="switchTab('edit-container', event)"
          >
            編集
          </button>
        </div>

        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.13.18/jquery.timepicker.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
        <script src="https://cdn.jsdelivr.net/npm/date-fns@2.21.1/dist/date-fns.min.js"></script>
      </article>
    </main>
    <script src="./js/language.js"></script>
    <script src="./js/liff-api.js"></script>
    <script src="./js/canvas.js"></script>
    <script src="./js/table-tab.js"></script>
    <script src="./js/edit-tab.js"></script>
  </body>
</html>
