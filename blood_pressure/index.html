<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Pressure Tracker</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.13.18/jquery.timepicker.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="loader" style="display: none;">
        <div class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <h1 class="title_bp" id="titleBp">血圧記録</h1>
    <button type="button" id="settingsBtn" class="settings-btn" onclick="openSettingsDialog()">設定</button>

    <div id="settingsDialog" style="display:none;">
        <div id="settingsDialogPanel">
            <div class="settings-header">
                <h2 id="settingsDialogTitle">設定</h2>
                <button type="button" id="closeSettingsBtnTop" class="settings-close-top-btn"
                    onclick="closeSettingsDialog()">閉じる</button>
            </div>
            <div class="settings-block">
                <p id="guideToggleLabel" class="settings-label">ガイド表示</p>
                <button type="button" id="guideToggleBtn" class="guide-toggle-btn">表示中</button>
            </div>
            <p id="languageSectionTitle" class="settings-label">言語設定</p>
            <div id="languageOptionList" class="language-option-list"></div>
            <button type="button" id="closeSettingsBtn" onclick="closeSettingsDialog()">閉じる</button>
        </div>
    </div>
    <button type="button" id="openAddFormBtn" class="open-add-form-btn" onclick="openAddForm()">データを追加</button>
    <!-- データ追加フォーム -->
    <div id="addFormPanel" class="add-form-panel" aria-hidden="true">
        <form id="addDataForm">
            <label for="date" id="labelDate">日付</label>
            <input type="text" id="date" placeholder="日付を選択"><br>
            <label for="date" id="labelPeriod">時間</label>
            <section class="dropdown">
                <select id="periodSelect">
                    <option value="1" id="periodMorning">朝</option>
                    <option value="2" id="periodNoon">昼</option>
                    <option value="3" id="periodNight">夜</option>
                </select>
            </section><br>
            <label for="higth" id="labelHigh">最高血圧</label>
            <input type="number" id="higth" class="high" placeholder="最高血圧"><br>
            <label for="low" id="labelLow">最低血圧</label>
            <input type="number" id="low" class="low" placeholder="最低血圧">
            <button type="button" id="adddata">登録</button>
            <button type="button" id="closeAddFormBtn" onclick="closeAddForm()">閉じる</button>
        </form>
    </div>
    <div id="chart-container-all">
        <div id="chart-container" class="chart-container active-content">
            <h2 id="chartRangeTitle" class="chart-range-title"></h2>
            <canvas id="bloodPressureChart"></canvas>
        </div>

        <div id="olderChartsContainer" class="older-charts-container"></div>
        <button type="button" id="loadOlderChartBtn" class="load-older-btn">以前の情報を見る</button>

    </div>
    <div id="table-container" class="table-container content">
        <!-- データ編集テーブル -->

        <table id="table">
            <thead>
                <tr>
                    <th>日付</th>
                    <th id="thPeriod">時間帯</th>
                    <th id="thHigh">最高血圧</th>
                    <th id="thLow">最低血圧</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <button type="button" id="loadOlderTableBtn" class="load-older-btn">以前の情報を見る</button>

    </div>

    <div id="edit-container" class="edit-container content">
        <div id="edit_table">
            <div id="edit_table_container">
                <!-- データ編集テーブル -->
                <table id="editTable">
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th id="ethPeriod">時間帯</th>
                            <th id="ethHigh">最高血圧</th>
                            <th id="ethLow">最低血圧</th>
                            <th id="ethEdit">編集</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ダイアログ -->
    <div id="editDialog" style="display:none;">
        <form id="editForm">
            <label for="editDate" id="editDateLabel">日付</label>
            <input type="text" id="editDate" class="datepicker2"><br><br>

            <label for="editPeriod" id="editPeriodLabel">時間</label>
            <select id="editPeriod" class="periodpicker2">
                <option value="1" id="editPeriodMorning">朝</option>
                <option value="2" id="editPeriodNoon">昼</option>
                <option value="3" id="editPeriodNight">夜</option>
            </select><br><br>

            <label for="editHigh" id="editHighLabel">最高血圧</label>
            <input type="number" id="editHigh" class="high2"><br><br>
            <label for="editLow" id="editLowLabel">最低血圧</label>
            <input type="number" id="editLow" class="low2"><br><br>


            <button type="button" id="saveButton">保存</button>
            <button type="button" id="cancelButton">キャンセル</button>
            <button type="button" id="deleteButton">削除</button>
        </form>
    </div>

    <!-- 下部タブメニュー -->
    <div class="tab-bar">
        <button id="tabChart" class="tab-button active" onclick="switchTab('chart-container', event)">グラフ</button>
        <button id="tabTable" class="tab-button" onclick="switchTab('table-container', event)">テーブル</button>
        <button id="tabEdit" class="tab-button" onclick="switchTab('edit-container', event)">編集</button>
    </div>

            return `${ja} / ${tx(key, selectedUiLang)}`;

        function periodLabel(periodValue) {
            if (Number(periodValue) === 1) return bt("morning");
            if (Number(periodValue) === 2) return bt("noon");
            return bt("night");
        }

        function chartPeriodLabelLines(periodValue) {
            let key = "night";
            if (Number(periodValue) === 1) key = "morning";
            if (Number(periodValue) === 2) key = "noon";

            if (selectedUiLang === "ja") return [ja];
            return [ja, tx(key, selectedUiLang)];

        function formatChartDateShort(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return String(dateStr || "");
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        function formatYmd(dateObj) {
            const m = dateObj.getMonth() + 1;
            const d = dateObj.getDate();
            return `${m}/${d}`;
        }

        function updateChartRangeTitle() {
            const titleEl = document.getElementById("chartRangeTitle");
            if (!titleEl) return;
            const today = new Date();
            const weekAgo = new Date(today);
            weekAgo.setDate(today.getDate() - 7);
            titleEl.textContent = `${formatYmd(weekAgo)}　ー　${formatYmd(today)}`;
        }

        function isSupportedLang(code) {
            return code === "ja" || LANGUAGE_OPTIONS.some(item => item.code === code);
        }

        function normalizeLangToUi(lang) {
            const l = String(lang || "ja").toLowerCase();
            if (l.startsWith("zh")) return "zh";
            if (l.startsWith("fr")) return "fr";
            if (l.startsWith("de")) return "de";
            if (l.startsWith("vi")) return "ve";
            if (l.startsWith("pt")) return "pr";
            if (l.startsWith("ko")) return "ko";
            if (l.startsWith("tl")) return "tl";
            if (l.startsWith("th")) return "th";
            if (l.startsWith("id")) return "id";
            if (l.startsWith("ru")) return "ru";
            if (l.startsWith("ne")) return "ne";
            if (l.startsWith("lo")) return "lo";
            if (l.startsWith("uk")) return "uk";
            if (l.startsWith("fa") || l.startsWith("prs")) return "fa-AF";
            if (l.startsWith("si")) return "si";
            if (l.startsWith("ms")) return "ms";
            if (l.startsWith("my")) return "my";
            if (l.startsWith("bn")) return "bn";
            if (l.startsWith("ur")) return "ur";
            if (l.startsWith("en")) return "en-US";
            return "ja";
        }

            const chartBtn = document.getElementById("loadOlderChartBtn");
            const tableBtn = document.getElementById("loadOlderTableBtn");
            const label = loadingOlderPressure ? bt("loading") : (hasOlderPressure ? bt("older") : bt("noMore"));

                if (!btn) return;
                btn.textContent = label;
                btn.disabled = loadingOlderPressure || !hasOlderPressure;

        function dedupePressureItems(items) {
            const map = new Map();
            (items || []).forEach((item) => {
                if (!item) return;
                const key = `${String(item.date || "")}|${Number(item.period || 0)}`;
                map.set(key, item);
            });
            return Array.from(map.values());
        }

        function fetchPressurePage(page, mergeMode) {
            const query = {
                unit: "date",
                limit: 7,
                page: page
            };
            const req = loadData(token, "pressure", query, mergeMode || "replace");
            return Promise.resolve(req).then((items) => Array.isArray(items) ? items : []);
        }

        function loadOlderPressureData() {
            if (loadingOlderPressure || !hasOlderPressure) return;
            loadingOlderPressure = true;
            syncOlderButtons();
            const nextPage = loadedWeekPages + 1;
            fetchPressurePage(nextPage, "append").then((items) => {
                if (!items.length) {
                    hasOlderPressure = false;
                } else {
                    pressurePage = nextPage;
                    loadedWeekPages = nextPage;
                    allData = dedupePressureItems(allData);
                    updateChart(allData);
                    createTablePage();
                    populateTable();
                }
            }).catch((e) => {
                console.error("load older error:", e);
            }).finally(() => {
                loadingOlderPressure = false;
                syncOlderButtons();
            });
        }

        function setLanguage(langCode) {
            selectedUiLang = isSupportedLang(langCode) ? langCode : "ja";

            renderLanguageOptions();
            applyI18n();
            updateChart(allData);

        selectedUiLang = isSupportedLang(initialSavedLang) ? initialSavedLang : "ja";
        localStorage.setItem(LANG_STORAGE_KEY, selectedUiLang);
        showGuideOverlay = localStorage.getItem(GUIDE_VISIBLE_KEY) !== "0";
        renderLanguageOptions();

        function startPressureApp(idToken) {
            token = idToken;
            if (typeof changeLanguage === "function") {
                changeLanguage("ja");
            }
            pressurePage = 1;
            loadedWeekPages = 1;
            hasOlderPressure = true;
            loadingOlderPressure = false;
            syncOlderButtons();
            loadInitialPressureWindow().then(() => {
                createTablePage();
                populateTable();
            }).catch((e) => {
                console.error("initial load error:", e);
            });
        }

        function loadInitialPressureWindow() {
            return fetchPressurePage(1, "replace").then((items) => {
                if (items.length > 0) {
                    allData = dedupePressureItems(items);
                    updateChart(allData);
                    return;
                }
                // If there is no record in the latest week, auto-load older weeks
                // so the screen is not empty at startup.
                const maxAutoPages = 12;
                const walk = (page) => {
                    if (page > maxAutoPages) {
                        hasOlderPressure = false;
                        syncOlderButtons();
                        allData = [];
                        updateChart(allData);
                        return;
                    }
                    return fetchPressurePage(page, "append").then((more) => {
                        if (more.length > 0) {
                            loadedWeekPages = page;
                            pressurePage = page;
                            allData = dedupePressureItems(allData);
                            updateChart(allData);
                            syncOlderButtons();
                            return;
                        }
                        return walk(page + 1);
                    });
                };
                return walk(2);
            });
        }

        function reloadPressureDataAndRender() {
            pressurePage = 1;
            loadedWeekPages = 1;
            hasOlderPressure = true;
            loadingOlderPressure = false;
            return loadInitialPressureWindow().then(() => {
                createTablePage();
                populateTable();
            });
        }

        function bootPressureApp() {
            if (window.IS_TEST_MODE) {
                // Skip LIFF auth in test mode so UI/data flow can be verified locally.
                startPressureApp("TEST_ID_TOKEN");
                return;
            }
            liff.init({
                liffId: LIFF_ID,
                withLoginOnExternalBrowser: true,
            }).then(() => {
                const idToken = liff.getIDToken();
                const lang = liff.getAppLanguage();
                if (!isSupportedLang(initialSavedLang)) {
                    selectedUiLang = normalizeLangToUi(lang);
                    localStorage.setItem(LANG_STORAGE_KEY, selectedUiLang);
                    renderLanguageOptions();
                    applyI18n();
                }
                startPressureApp(idToken);
            }).catch(() => {
                liff.logout();
                alert("LIFF init failed.");
            });
        }

        function updateChart(data) {
            const sorted = (Array.isArray(data) ? data.slice() : []).sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                if (dateA - dateB !== 0) {
                    return dateA - dateB;
                }
                return Number(a.period || 0) - Number(b.period || 0);
            });
            allData = sorted;
            renderWeeklyCharts(sorted);
        }

        const ctx = document.getElementById('bloodPressureChart').getContext('2d');
        //ctx.height = 350;
        const isHighAlertValue = (v) => Number(v) >= 140;
        const isLowAlertValue = (v) => Number(v) <= 70;
        const chartY = (ctx) => {
            if (!ctx || !ctx.parsed) return NaN;
            return Number(ctx.parsed.y);
        };

        // カスタムプラグインを定義（特定のy座標範囲の背景色を塗る）
        const rangeBackgroundPlugin = {
            id: 'rangeBackground',
            beforeDraw: function (chart) {
                if (!showGuideOverlay) return;
                const ctx = chart.ctx;
                const chartArea = chart.chartArea;
                const yAxis = chart.scales.y;

                ctx.save();

                // 140以上の背景を赤色に塗る
                const topY = yAxis.getPixelForValue(140); // Y=140のピクセル位置を取得
                ctx.fillStyle = 'rgba(255, 99, 132, 0.10)'; // 赤色
                ctx.fillRect(chartArea.left, chartArea.top, chartArea.right - chartArea.left, topY - chartArea
                    .top);

                // 70未満の背景を青色に塗る
                const bottomY = yAxis.getPixelForValue(70); // Y=70のピクセル位置を取得
                ctx.fillStyle = 'rgba(54, 162, 235, 0.10)'; // 青色
                ctx.fillRect(chartArea.left, bottomY, chartArea.right - chartArea.left, chartArea.bottom -
                    bottomY);

                ctx.restore();
            }
        };

        function buildPressureChartConfig() {
            return {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                            label: bt("systolic"),
                            data: [],
                            borderColor: '#e5546f',
                            backgroundColor: 'rgba(229, 84, 111, 0.20)',
                            fill: true,
                            tension: 0.28,
                            pointRadius: (ctx) => isHighAlertValue(chartY(ctx)) ? 6 : 3.5,
                            pointHoverRadius: (ctx) => isHighAlertValue(chartY(ctx)) ? 8 : 6,
                            pointBackgroundColor: (ctx) => isHighAlertValue(chartY(ctx)) ? '#ff2d55' : '#ffffff',
                            pointBorderColor: (ctx) => isHighAlertValue(chartY(ctx)) ? '#ff2d55' : '#e5546f',
                            pointBorderWidth: 2
                        },
                        {
                            label: bt("diastolic"),
                            data: [],
                            borderColor: '#3f8ee8',
                            backgroundColor: 'rgba(63, 142, 232, 0.20)',
                            fill: true,
                            tension: 0.28,
                            pointRadius: (ctx) => isLowAlertValue(chartY(ctx)) ? 6 : 3.5,
                            pointHoverRadius: (ctx) => isLowAlertValue(chartY(ctx)) ? 8 : 6,
                            pointBackgroundColor: (ctx) => isLowAlertValue(chartY(ctx)) ? '#2f80ff' : '#ffffff',
                            pointBorderColor: (ctx) => isLowAlertValue(chartY(ctx)) ? '#2f80ff' : '#3f8ee8',
                            pointBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: "index",
                        intersect: false
                    },
                    // --- ここから追加 ---
                    layout: {
                        padding: {
                            bottom: 20 // 下側に20pxの余白を強制的に作る
                        }
                    },
                    plugins: {
                        legend: {
                            position: "top",
                            labels: {
                                usePointStyle: true,
                                pointStyle: "circle",
                                boxWidth: 10,
                                color: "#22324a",
                                font: {
                                    size: 12,
                                    weight: "700"
                                },
                                generateLabels: function (chart) {
                                    const originalLabels = Chart.defaults.plugins.legend.labels.generateLabels(
                                        chart);
                                    originalLabels.forEach(label => {
                                        // 中の色（fillStyle）を「白」に固定
                                        label.fillStyle = '#ffffff';
                                        // 枠線の色（strokeStyle）を各データセットの色（赤/青）に合わせる
                                        const dataset = chart.data.datasets[label.datasetIndex];
                                        label.strokeStyle = dataset.borderColor;
                                        // 枠線の太さを少し出すと見やすいです
                                        label.lineWidth = 2;
                                    });
                                    return originalLabels;
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: "rgba(28, 43, 66, 0.92)",
                            titleColor: "#fff",
                            bodyColor: "#fff",
                            padding: 10,
                            displayColors: true
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: bt("yAxis")
                            },
                            min: 50,
                            max: 200,
                            grid: {
                                color: "rgba(132, 161, 204, 0.20)"
                            },
                            ticks: {
                                color: "#405370",
                                stepSize: 10
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: bt("xAxis")
                            },
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: "#405370",
                                maxRotation: 20,
                                minRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 8
                            }
                        }
                    }
                },
                plugins: [rangeBackgroundPlugin]
            };
        }

        function getWeekWindow(page) {
            const to = new Date();
            to.setHours(23, 59, 59, 999);
            to.setDate(to.getDate() - 7 * (page - 1));
            const from = new Date(to);
            from.setDate(from.getDate() - 7);
            from.setHours(0, 0, 0, 0);
            return {
                from,
                to
            };
        }

        function getItemsForWeekPage(items, page) {
            const win = getWeekWindow(page);
            return (items || []).filter((item) => {
                const d = new Date(item.date);
                return !isNaN(d.getTime()) && win.from.getTime() < d.getTime() && d.getTime() <= win.to
                    .getTime();
            }).sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                if (dateA - dateB !== 0) return dateA - dateB;
                return Number(a.period || 0) - Number(b.period || 0);
            });
        }

        function setChartData(chart, items) {
            const labelsLocal = [];
            const highLocal = [];
            const lowLocal = [];
            (items || []).forEach((item) => {
                labelsLocal.push([formatChartDateShort(item.date), ...chartPeriodLabelLines(item.period)]);
                highLocal.push(Number(item.high));
                lowLocal.push(Number(item.low));
            });
            chart.data.labels = labelsLocal;
            chart.data.datasets[0].label = bt("systolic");
            chart.data.datasets[1].label = bt("diastolic");
            chart.data.datasets[0].data = highLocal;
            chart.data.datasets[1].data = lowLocal;
            chart.options.scales.y.title.text = bt("yAxis");
            chart.options.scales.x.title.text = bt("xAxis");
            chart.update();
        }

        function renderWeeklyCharts(items) {
            const page1 = getItemsForWeekPage(items, 1);
            setChartData(bloodPressureChart, page1);

            chartInstances.forEach((c) => c.destroy());
            chartInstances = [];

            const container = document.getElementById("olderChartsContainer");
            if (!container) return;
            container.innerHTML = "";

            for (let p = 2; p <= loadedWeekPages; p++) {
                const weekItems = getItemsForWeekPage(items, p);
                if (!weekItems.length) continue;
                const card = document.createElement("section");
                card.className = "older-chart-card";
                const title = document.createElement("h3");
                title.className = "older-chart-title";
                const win = getWeekWindow(p);
                const start = new Date(win.from);
                start.setDate(start.getDate() + 1);
                title.textContent =
                    `${p - 1}週間前 (${formatChartDateShort(start)}-${formatChartDateShort(win.to)})`;
                const canvas = document.createElement("canvas");
                //canvas.height = 350;
                card.appendChild(title);
                card.appendChild(canvas);
                container.appendChild(card);

                const c = new Chart(canvas.getContext('2d'), buildPressureChartConfig());
                setChartData(c, weekItems);
                chartInstances.push(c);
            }
        }

        // Chart.jsの設定
        let bloodPressureChart = new Chart(ctx, buildPressureChartConfig());

        // jQuery UIのdatepickerの初期化
        $(function () {
            $("#date").datepicker({
                dateFormat: 'yy/mm/dd'
            });
        });

        function openAddForm() {
            const panel = document.getElementById("addFormPanel");
            const openBtn = document.getElementById("openAddFormBtn");
            if (!panel) return;
            panel.classList.add("open");
            panel.style.maxHeight = "520px";
            panel.style.opacity = "1";
            panel.style.transform = "translateY(0)";
            panel.setAttribute("aria-hidden", "false");
            if (openBtn) openBtn.style.display = "none";
        }

        function closeAddForm() {
            const panel = document.getElementById("addFormPanel");
            const openBtn = document.getElementById("openAddFormBtn");
            if (!panel) return;
            panel.classList.remove("open");
            panel.style.maxHeight = "0";
            panel.style.opacity = "0";
            panel.style.transform = "translateY(-8px)";
            panel.setAttribute("aria-hidden", "true");
            if (openBtn) openBtn.style.display = "";
        }

        function openSettingsDialog() {
            const dlg = document.getElementById("settingsDialog");
            if (!dlg) return;
            dlg.style.display = "block";
        }

        function closeSettingsDialog() {
            const dlg = document.getElementById("settingsDialog");
            if (!dlg) return;
            dlg.style.display = "none";
        }

        document.getElementById("settingsBtn").addEventListener("click", openSettingsDialog);
        document.getElementById("closeSettingsBtn").addEventListener("click", closeSettingsDialog);
        document.getElementById("guideToggleBtn").addEventListener("click", () => {
            showGuideOverlay = !showGuideOverlay;
            localStorage.setItem(GUIDE_VISIBLE_KEY, showGuideOverlay ? "1" : "0");
            applySettingsUi();
            updateChart(allData);
        });
        document.getElementById("openAddFormBtn").addEventListener("click", openAddForm);
        document.getElementById("closeAddFormBtn").addEventListener("click", closeAddForm);
        document.getElementById("loadOlderChartBtn").addEventListener("click", loadOlderPressureData);
        document.getElementById("loadOlderTableBtn").addEventListener("click", loadOlderPressureData);

        document.getElementById("adddata").onclick = function () {
            try {
                const date = document.getElementById("date").value.trim();
                const time = Number(document.getElementById("periodSelect").value);
                const high = Number(document.getElementById("higth").value);
                const low = Number(document.getElementById("low").value);

                if (!date || !Number.isFinite(time) || !Number.isFinite(high) || !Number.isFinite(low)) {
                    alert(bt("fillAll"));
                    return;
                }

                const list = {
                    date: String(date),
                    period: time,
                    high: Math.round(high),
                    low: Math.round(low)
                };

                if (typeof addData !== "function") {
                    alert("登録処理の読み込みに失敗しました。ページを再読み込みしてください。");
                    return;
                }
                const savePressure = (typeof setPressure === "function") ?
                    setPressure :
                    ((payload) => addData(payload, "pressure"));
                Promise.resolve(savePressure(list)).then(() => {
                    return reloadPressureDataAndRender();
                }).then(() => {
                    switchTab("chart-container", {
                        currentTarget: document.getElementById("tabChart")
                    });
                    document.getElementById("date").value = "";
                    document.getElementById("higth").value = "";
                    document.getElementById("low").value = "";
                    closeAddForm();
                }).catch((e) => {
                    console.error("add/register error:", e);
                    alert("登録処理でエラーが発生しました。");
                });
            } catch (e) {
                console.error("adddata error:", e);
                alert("登録処理でエラーが発生しました。");
            }

        }

        let before_dateValue
        let before_periodValue

        function populateTable(id) {
            var tableBody;

            tableBody = document.querySelector('#editTable tbody');
            tableBody.innerHTML = ''; // テーブルをクリア

            allData.forEach((label, index) => {
                const datePart = String(label.date); // 日付部分
                const periodPart = label.period; // 朝/夜部分
                const highAlertClass = Number(label.high) >= 140 ? "bp-alert-high" : "";
                const lowAlertClass = Number(label.low) <= 70 ? "bp-alert-low" : "";

                const row = `<tr>
                            <!-- 日付部分: datepickerを使用 -->
                            <td class="date-picker">${String(datePart)}</td>
                            <td class="time-picker">${dataArray[periodPart]}</td>

                            <!-- 体重部分: contenteditable -->
                            <td class="high1 ${highAlertClass}">${label.high}</td>
                            <td class="low1 ${lowAlertClass}">${label.low}</td>

                            <td><button class="edit-btn">${bt("edit")}</button></td>
                        </tr>`;


                tableBody.insertAdjacentHTML('beforeend', row);
                $(".date-picker").datepicker({
                    dateFormat: 'yy-mm-dd'
                });
            });



            const editButtons = document.querySelectorAll(".edit-btn");
            const dialog = document.getElementById("editDialog");




            editButtons.forEach((button) => {
                button.addEventListener("click", function () {
                    currentRow1 = this.closest("tr");

                    // 元の値を取得してダイアログに設定
                    const dateValue = currentRow1.querySelector(".date-picker").innerText;
                    const timeValue = currentRow1.querySelector(".time-picker").innerText;
                    const highValue = currentRow1.querySelector(".high1").innerText;
                    const lowValue = currentRow1.querySelector(".low1").innerText;

                    document.getElementById("editDate").value = dateValue;
                    document.getElementById("editPeriod").value = dataArray.indexOf(timeValue);
                    document.getElementById("editHigh").value = highValue;
                    document.getElementById("editLow").value = lowValue;

                    before_dateValue = dateValue
                    before_periodValue = dataArray.indexOf(timeValue)
                    // ダイアログを表示
                    dialog.style.display = "block";

                });
            });

            const saveButton = document.getElementById("saveButton");
            saveButton.removeEventListener("click", savebutton); // 既存のリスナーを削除
            saveButton.addEventListener("click", savebutton); // 新しいリスナーを登録




            // キャンセルボタンの処理
            document.getElementById("cancelButton").onclick = () => {
                // ダイアログを閉じる
                dialog.style.display = "none";
            };

            // 削除ボタンの処理
            document.getElementById("deleteButton").onclick = () => {
                list = {
                    date: before_dateValue,
                    period: before_periodValue
                }

                Promise.resolve(deleteData(list, "pressure"))
                    .then(() => reloadPressureDataAndRender())
                    .then(() => {
                        dialog.style.display = "none";
                    })
                    .catch((error) => {
                        console.error("delete error:", error);
                        alert("削除処理でエラーが発生しました。");
                    });
            };


        }


        function savebutton() {

            let dialog = document.getElementById("editDialog");

            // 保存ボタンの処理
            const newDate = document.getElementById("editDate").value;
            const newTime = document.getElementById("editPeriod").value;
            const newHigh = document.getElementById("editHigh").value;
            const newLow = document.getElementById("editLow").value;

            if (newDate && newHigh && newTime && newLow) {
                var olddata = {
                    date: before_dateValue,
                    period: before_periodValue
                }

                var newdata = {
                    date: String(newDate),
                    period: parseInt(newTime),
                    high: parseInt(newHigh),
                    low: parseInt(newLow)

                }
                const sameKey =
                    String(olddata.date) === String(newdata.date) &&
                    Number(olddata.period) === Number(newdata.period);

                const savePressure = (typeof setPressure === "function") ?
                    setPressure :
                    ((payload) => addData(payload, "pressure"));
                const request = sameKey ?
                    Promise.resolve(savePressure(newdata)) :
                    Promise.resolve(savePressure(newdata))
                    .then(() => deleteData(olddata, "pressure"));

                request.then(() => {
                    // 保存後は再取得して表示を揃える
                    return reloadPressureDataAndRender();
                }).then(() => {
                    dialog.style.display = "none";
                }).catch((error) => {
                    console.error("save/update error:", error);
                    alert("保存処理でエラーが発生しました。");
                });

            } else {
                alert(bt("fillAll"));
            }
            //                allData = allData.filter(item => !(item.date == before_dateValue && item.period ==
            //                    before_periodValue));


            //               allData.push({
            //                   date: newDate,
            //                   period: newTime,
            //                   high: newHigh,
            //                   low: newLow
            //               })


        }

        function createTablePage() {
            tableBody = document.querySelector('#table tbody');
            tableBody.innerHTML = ''; // テーブルをクリア

            allData.forEach((label, index) => {
                datetime = label.date
                const highAlertClass = Number(label.high) >= 140 ? "bp-alert-high" : "";
                const lowAlertClass = Number(label.low) <= 70 ? "bp-alert-low" : "";
                const row = `<tr>
                    <!-- 日付部分: datepickerを使用 -->
                    <td>${datetime}</td>
                    <td>${dataArray[label.period]}</td>
                    <!-- 最高血圧部分: contenteditable -->
                    <td class="${highAlertClass}">${label.high}</td>
                    <td class="${lowAlertClass}">${label.low}</td>

                </tr>`;

                tableBody.insertAdjacentHTML('beforeend', row);
                $(".date-picker").datepicker({
                    dateFormat: 'yy-mm-dd HH:mm'
                });
            });
        }

        function setallData() {
            allData = allData.filter(item => !(item.date == before_dateValue && item.period == before_periodValue));
            currentRow1.remove();
        }
        applyI18n();
        window.addEventListener("load", bootPressureApp);
    </script>
