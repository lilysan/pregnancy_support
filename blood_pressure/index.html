<html lang="ja">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">

        href="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.13.18/jquery.timepicker.min.css">

</head>

<body>
    <div id="header-container" class="header-wrapper"></div>

    <div class="loader is-hidden">
        <div class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <main>
        <article class="main-container blood-pressure-main">
            <h1 class="title_bp" id="titleBp">血圧記録</h1>
            <button type="button" id="openAddFormBtn" class="open-add-form-btn" onclick="openAddForm()">データを追加</button>
            <!-- データ追加フォーム -->
            <div id="addFormPanel" class="add-form-panel" aria-hidden="true">
                <form id="addDataForm">
                    <label for="date" id="labelDate">日付</label>
                    <input type="text" id="date" placeholder="日付を選択"><br>
                    <label for="periodSelect" id="labelPeriod">時間</label>
                    <section class="dropdown">
                        <select id="periodSelect">
                            <option value="1" id="periodMorning">朝</option>
                            <option value="2" id="periodNoon">昼</option>
                            <option value="3" id="periodNight">夜</option>
                        </select>
                    </section><br>
                    <label for="higth" id="labelHigh">最高血圧</label>
                    <input type="number" id="higth" class="high" placeholder="最高血圧"><br>
                    <label for="low" id="labelLow">最低血圧</label>
                    <input type="number" id="low" class="low" placeholder="最低血圧"><br>
                    <span id="labelMedicine" class="form-group-label">内服</span>
                    <div id="medicine" class="medicine medicine-radio-group" role="radiogroup"
                        aria-labelledby="labelMedicine">
                        <label class="medicine-radio-option">
                            <input type="radio" name="medicineStatus" value="なし" checked>
                            <span id="medicineNoneLabel">なし</span>
                        </label>
                        <label class="medicine-radio-option">
                            <input type="radio" name="medicineStatus" value="あり">
                            <span id="medicineYesLabel">あり</span>
                        </label>
                    </div>
                    <button type="button" id="adddata">登録</button>
                    <button type="button" id="closeAddFormBtn" onclick="closeAddForm()">閉じる</button>
                </form>
            </div>
            <div id="chart-container-all">
                <div id="chart-container" class="chart-container active-content">
                    <h2 id="chartRangeTitle" class="chart-range-title"></h2>
                    <canvas id="bloodPressureChart"></canvas>
                </div>

                <div id="olderChartsContainer" class="older-charts-container"></div>
                <button type="button" id="loadOlderChartBtn" class="load-older-btn">以前の情報をみる</button>

            </div>
            <div id="table-container" class="table-container content">
                <!-- データ編集テーブル -->

                <table id="table">
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th id="thPeriod">時間帯</th>
                            <th id="thHigh">最高血圧</th>
                            <th id="thLow">最低血圧</th>
                            <th id="thMedicine">内服</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
                <button type="button" id="loadOlderTableBtn" class="load-older-btn">以前の情報をみる</button>

            </div>

            <div id="edit-container" class="edit-container content">
                <div id="edit_table">
                    <div id="edit_table_container">
                        <!-- データ編集テーブル -->
                        <table id="editTable">
                            <thead>
                                <tr>
                                    <th>日付</th>
                                    <th id="ethPeriod">時間帯</th>
                                    <th id="ethHigh">最高血圧</th>
                                    <th id="ethLow">最低血圧</th>
                                    <th id="ethMedicine">内服</th>
                                    <th id="ethEdit">編集</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ダイアログ -->
            <div id="editDialog" class="is-hidden">
                <form id="editForm">
                    <label for="editDate" id="editDateLabel">日付</label>
                    <input type="text" id="editDate" class="datepicker2"><br><br>

                    <label for="editPeriod" id="editPeriodLabel">時間</label>
                    <select id="editPeriod" class="periodpicker2">
                        <option value="1" id="editPeriodMorning">朝</option>
                        <option value="2" id="editPeriodNoon">昼</option>
                        <option value="3" id="editPeriodNight">夜</option>
                    </select><br><br>

                    <label for="editHigh" id="editHighLabel">最高血圧</label>
                    <input type="number" id="editHigh" class="high2"><br><br>
                    <label for="editLow" id="editLowLabel">最低血圧</label>
                    <input type="number" id="editLow" class="low2"><br><br>
                    <span id="editMedicineLabel" class="form-group-label">内服</span>
                    <div id="editMedicine" class="medicine2 medicine-radio-group" role="radiogroup"
                        aria-labelledby="editMedicineLabel">
                        <label class="medicine-radio-option">
                            <input type="radio" name="editMedicineStatus" value="なし" checked>
                            <span id="editMedicineNoneLabel">なし</span>
                        </label>
                        <label class="medicine-radio-option">
                            <input type="radio" name="editMedicineStatus" value="あり">
                            <span id="editMedicineYesLabel">あり</span>
                        </label>
                    </div><br><br>


                    <button type="button" id="saveButton">保存</button>
                    <button type="button" id="cancelButton">キャンセル</button>
                    <button type="button" id="deleteButton">削除</button>
                </form>
            </div>

            <!-- 下部タブメニュー -->
            <div class="tab-bar">
                <button id="tabChart" class="tab-button active"
                    onclick="switchTab('chart-container', event)">グラフ</button>
                <button id="tabTable" class="tab-button" onclick="switchTab('table-container', event)">テーブル</button>
                <button id="tabEdit" class="tab-button" onclick="switchTab('edit-container', event)">編集</button>
            </div>

            <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.13.18/jquery.timepicker.min.js">
            </script>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
            <script src="https://cdn.jsdelivr.net/npm/date-fns@2.21.1/dist/date-fns.min.js"></script>
        </article>
    </main>
    <script>
        window.IS_TEST_MODE = new URLSearchParams(window.location.search).get("test") === "1" ||
            location.hostname === "localhost" ||
            location.hostname === "127.0.0.1";
        if (window.IS_TEST_MODE) {
            window.liff = {
                init: function () {
                    return new Promise(function (resolve) {
                        setTimeout(resolve, 0);
                    });
                },
                getIDToken: function () {
                    return "TEST_ID_TOKEN";
                },
                getAppLanguage: function () {
                    const lang = (navigator.language || "en").toLowerCase();
                    if (lang.startsWith("ja")) return "ja";
                    return "en";
                },
                logout: function () {},
                closeWindow: function () {}
            };
        }
    </script>

        const getAccessObj = (data) => {
            return {
                url: API_URL,
                type: "POST",
                dataType: "json",
                data: JSON.stringify(data),
                timeout: 30000,
            };
        };

        function toPressureApiPostData(method, data) {
            const value = data || {};
            if (method === "get") {
                return {
                    unit: value.unit || "date",
                    limit: Number(value.limit || 1),
                    page: Number(value.page || 1)
                };
            }
            if (method === "delete") {
                return {
                    date: value.date || "",
                    period: Number(value.period || 0)
                };
            }
            const mapped = {
                date: value.date || "",
                period: Number(value.period || 0),
                high: Number(value.high || 0),
                low: Number(value.low || 0),
                medicine: hasMedicineFlag(value.medicine) ? 1 : 0
            };
            if (method === "put") {
                mapped.itemId = value.itemId || "";
            }
            return mapped;
        }

        function pressurePayload(method, data) {
            return toPressureApiPostData(method, data);
        }

        function normalizePressureItem(item) {
            if (!item) return null;
            return {
                itemId: item.itemId || item.id || "",
                date: item.date || "",
                period: Number(item.period || 0),
                high: Number(item.high || 0),
                low: Number(item.low || 0),
                medicine: item.medicine || 0
            };
        }

        function extractPressureItems(response) {
            const data = response && response.data ? response.data : {};
            const rawItems = data.items || [];
            return Array.isArray(rawItems) ? rawItems.map(normalizePressureItem).filter(Boolean) : [];
        }

        function loadData(idToken, type, postData, mergeMode) {
            showAppLoader();
            const method = "get";
            const safePostData = type === "pressure" ? pressurePayload(method, postData) : (postData || {});
            const safeMergeMode = mergeMode || "replace";
            if (window.IS_TEST_MODE && type === "pressure") {
                const page = Number(safePostData.page || 1);
                const limit = Math.max(1, Number(safePostData.limit || 7));
                const start = (page - 1) * limit;
                const items = MOCK_PRESSURE_ITEMS.slice(start, start + limit);
                if (safeMergeMode === "append") {
                    allData = (Array.isArray(allData) ? allData : []).concat(items);
                } else {
                    allData = items;
                }
                updateChart(allData);
                hideAppLoader();
                return Promise.resolve(items);
            }
            return $.ajax(
                getAccessObj({
                    path: type,
                    method: method,
                    idToken: idToken,
                    postData: safePostData
                })
            ).then(function (response) {
                if (response.statusCode === 401) {
                    liff.logout();
                    window.location.reload();
                    return [];
                } else if (response.statusCode !== 200) {
                    console.error(response.message);
                    alert(response.message);
                    return [];
                } else {
                    const items = type === "pressure" ? extractPressureItems(response) :
                        ((response.data && Array.isArray(response.data.items)) ? response.data.items : []);
                    if (safeMergeMode === "append") {
                        allData = (Array.isArray(allData) ? allData : []).concat(items);
                    } else {
                        allData = items;
                    }
                    updateChart(allData);
                    return items;
                }
            }, function () {
                alert("Network error!");
                return [];
            }).always(function () {
                hideAppLoader();
            });
        }

        function addData(data, type) {
            showAppLoader();
            const method = "post";
            if (window.IS_TEST_MODE && type === "pressure") {
                MOCK_PRESSURE_ITEMS.unshift(Object.assign({
                    itemId: `mock-${Date.now()}`

                    }
                });

            return $.ajax(

                    idToken: token,

                })

                const idx = MOCK_PRESSURE_ITEMS.findIndex((item) =>

            const target = document.querySelector(`input[name="${name}"][value="${targetValue}"]`);
            if (target) target.checked = true;
        }

        function hasMedicineFlag(value) {
            const normalized = String(value || "").trim();
            return normalized !== "" &&
                normalized !== "なし" &&
                normalized !== "-" &&
                normalized !== "0" &&
                normalized !== "false" &&
                normalized !== "null" &&
                normalized !== "undefined";
        }

        function medicineMark(value) {
            return hasMedicineFlag(value) ? "○" : "-";
        }

        function periodLabel(periodValue) {
            if (Number(periodValue) === 1) return bt("morning");
            if (Number(periodValue) === 2) return bt("noon");
            return bt("night");

        function chartPeriodLabelLines(periodValue) {
            let key = "night";

            if (Number(periodValue) === 2) key = "noon";

        }

        function formatChartDateShort(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return String(dateStr || "");
            return `${d.getMonth() + 1}/${d.getDate()}`;
        }

        function parsePressureDateValue(value) {
            if (value instanceof Date && !isNaN(value.getTime())) return value;
            const raw = String(value || "").trim();
            if (!raw) return null;
            const normalized = raw.replace(/\./g, "/").replace(/-/g, "/");
            const d = new Date(normalized);
            if (isNaN(d.getTime())) return null;
            return d;
        }

        function formatDisplayDate(value) {
            const d = parsePressureDateValue(value);
            if (!d) return String(value || "");
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
        }

        function getSortedPressureData() {
            const items = Array.isArray(allData) ? allData.slice() : [];
            return items.sort((a, b) => {
                const da = parsePressureDateValue(a && a.date);
                const db = parsePressureDateValue(b && b.date);
                const ta = da ? da.getTime() : 0;
                const tb = db ? db.getTime() : 0;
                if (ta !== tb) return ta - tb;
                return Number((a && a.period) || 0) - Number((b && b.period) || 0);
            });
        }

        function formatYmd(dateObj) {
            const m = dateObj.getMonth() + 1;
            const d = dateObj.getDate();
            return `${m}/${d}`;
        }

            return Promise.resolve(req).then((items) => Array.isArray(items) ? items : []);

        function loadOlderPressureData() {
            if (loadingOlderPressure || !hasOlderPressure) return;
            loadingOlderPressure = true;
            syncOlderButtons();
            const startPage = loadedWeekPages + 1;
            const maxSearchPages = 120;
            const walk = (page) => {
                if (page > maxSearchPages) {
                    hasOlderPressure = false;
                    return Promise.resolve(false);
                }
                return fetchPressurePage(page, "append").then((items) => {
                    if (!items.length) {
                        return walk(page + 1);
                    }
                    pressurePage = page;
                    loadedWeekPages = page;
                    allData = dedupePressureItems(allData);
                    updateChart(allData);
                    createTablePage();
                    populateTable();
                    return true;
                });
            };
            walk(startPage).then((found) => {
                if (!found) {
                    hasOlderPressure = false;
                }
            }).catch((e) => {
                console.error("load older error:", e);
            }).finally(() => {
                loadingOlderPressure = false;
                syncOlderButtons();
            });
        }

        function startPressureApp(idToken) {
            token = idToken;

            syncOlderButtons();

        function loadInitialPressureWindow() {
            return fetchPressurePage(1, "replace").then((items) => {
                if (items.length > 0) {
                    allData = dedupePressureItems(items);
                    updateChart(allData);
                    return;
                }
                // If there is no record in the latest week, auto-load older weeks
                // so the screen is not empty at startup.
                const maxAutoPages = 120;
                const walk = (page) => {
                    if (page > maxAutoPages) {
                        syncOlderButtons();
                        allData = [];
                        updateChart(allData);
                        return;
                    }
                    return fetchPressurePage(page, "append").then((more) => {
                        if (more.length > 0) {
                            loadedWeekPages = page;
                            pressurePage = page;
                            allData = dedupePressureItems(allData);
                            updateChart(allData);
                            syncOlderButtons();
                            return;
                        }
                        return walk(page + 1);
                    });
                };
                return walk(2);
            });
        }

            });

        // カスタムプラグインを定義（特定のy座標範囲の背景色を塗る）
        const rangeBackgroundPlugin = {
            id: 'rangeBackground',
            beforeDraw: function (chart) {
                if (!showGuideOverlay) return;
                const ctx = chart.ctx;
                const chartArea = chart.chartArea;
                const yAxis = chart.scales.y;

                ctx.save();

                // 140以上の背景を赤色に塗る
                const topY = yAxis.getPixelForValue(140); // Y=140のピクセル位置を取得
                ctx.fillStyle = 'rgba(255, 99, 132, 0.10)'; // 赤色
                ctx.fillRect(chartArea.left, chartArea.top, chartArea.right - chartArea.left, topY - chartArea
                    .top);

                // 70未満の背景を青色に塗る
                const bottomY = yAxis.getPixelForValue(70); // Y=70のピクセル位置を取得
                ctx.fillStyle = 'rgba(54, 162, 235, 0.10)'; // 青色
                ctx.fillRect(chartArea.left, bottomY, chartArea.right - chartArea.left, chartArea.bottom -
                    bottomY);

                ctx.restore();
            }
        };

        function getWeekWindow(page) {
            const to = new Date();
            to.setHours(23, 59, 59, 999);
            to.setDate(to.getDate() - 7 * (page - 1));
            const from = new Date(to);
            from.setDate(from.getDate() - 7);
            from.setHours(0, 0, 0, 0);
            return {
                from,
                to
            };
        }

        function getItemsForWeekPage(items, page) {
            const win = getWeekWindow(page);
            return (items || []).filter((item) => {
                const d = new Date(item.date);
                return !isNaN(d.getTime()) && win.from.getTime() < d.getTime() && d.getTime() <= win.to
                    .getTime();
            }).sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                if (dateA - dateB !== 0) return dateA - dateB;
                return Number(a.period || 0) - Number(b.period || 0);
            });
        }

        function setChartData(chart, items) {
            const labelsLocal = [];
            const highLocal = [];
            const lowLocal = [];
            (items || []).forEach((item) => {
                const lines = [formatChartDateShort(item.date), ...chartPeriodLabelLines(item.period)];
                if (hasMedicineFlag(item.medicine)) {
                    lines.push("💊");
                }
                labelsLocal.push(lines);
                highLocal.push(Number(item.high));
                lowLocal.push(Number(item.low));
            });
            chart.data.labels = labelsLocal;
            chart.data.datasets[0].label = bt("systolic");
            chart.data.datasets[1].label = bt("diastolic");
            chart.data.datasets[0].data = highLocal;
            chart.data.datasets[1].data = lowLocal;
            chart.options.scales.y.title.text = bt("yAxis");
            chart.options.scales.x.title.text = bt("xAxis");
            chart.update();
        }

        function renderWeeklyCharts(items) {
            const page1 = getItemsForWeekPage(items, 1);
            setChartData(bloodPressureChart, page1);

            chartInstances.forEach((c) => c.destroy());
            chartInstances = [];

            const container = document.getElementById("olderChartsContainer");
            if (!container) return;
            container.innerHTML = "";

            for (let p = 2; p <= loadedWeekPages; p++) {
                const weekItems = getItemsForWeekPage(items, p);
                if (!weekItems.length) continue;
                const card = document.createElement("section");
                card.className = "older-chart-card";
                const title = document.createElement("h3");
                title.className = "older-chart-title";
                const win = getWeekWindow(p);
                const start = new Date(win.from);
                start.setDate(start.getDate() + 1);
                title.textContent =
                    `${p - 1}週間前 (${formatChartDateShort(start)}-${formatChartDateShort(win.to)})`;
                const canvas = document.createElement("canvas");
                //canvas.height = 350;
                card.appendChild(title);
                card.appendChild(canvas);
                container.appendChild(card);

                const c = new Chart(canvas.getContext('2d'), buildPressureChartConfig());
                setChartData(c, weekItems);
                chartInstances.push(c);
            }
        }

                    setPressure :
                    ((payload) => addData(payload, "pressure"));
                Promise.resolve(savePressure(list)).then(() => {
                    return reloadPressureDataAndRender();
                }).then(() => {
                    switchTab("chart-container", {
                        currentTarget: document.getElementById("tabChart")
                    });
                    document.getElementById("date").value = "";
                    document.getElementById("higth").value = "";
                    document.getElementById("low").value = "";
                    setMedicineRadioValue("medicineStatus", 0);
                    closeAddForm();
                }).catch((e) => {
                    console.error("add/register error:", e);
                    alert("登録処理でエラーが発生しました。");
                });
            } catch (e) {
                console.error("adddata error:", e);
                alert("登録処理でエラーが発生しました。");
            }

        }

        let before_dateValue
        let before_periodValue
        let before_itemId

        function populateTable(id) {
            var tableBody;

            tableBody = document.querySelector('#editTable tbody');
            tableBody.innerHTML = ''; // テーブルをクリア

            const sortedData = getSortedPressureData();
            sortedData.forEach((label, index) => {
                const rawDate = String(label.date || "");
                const datePart = formatDisplayDate(rawDate); // 日付部分
                const periodPart = label.period; // 朝/夜部分
                const medicinePart = medicineMark(label.medicine);
                const highAlertClass = Number(label.high) >= 140 ? "bp-alert-high" : "";
                const lowAlertClass = Number(label.low) <= 70 ? "bp-alert-low" : "";

                const row = `<tr data-item-id="${label.itemId || ""}">
                            <!-- 日付部分: datepickerを使用 -->
                            <td class="date-picker" data-raw-date="${rawDate}">${String(datePart)}</td>
                            <td class="time-picker">${dataArray[periodPart]}</td>

                            <!-- 体重部分: contenteditable -->
                            <td class="high1 ${highAlertClass}">${label.high}</td>
                            <td class="low1 ${lowAlertClass}">${label.low}</td>
                            <td class="medicine1">${medicinePart}</td>

                            <td><button type="button" class="edit-btn">${bt("edit")}</button></td>
                        </tr>`;


                tableBody.insertAdjacentHTML('beforeend', row);
                $(".date-picker").datepicker({
                    dateFormat: 'yy-mm-dd'
                });
            });



            const editButtons = document.querySelectorAll(".edit-btn");
            const dialog = document.getElementById("editDialog");




            editButtons.forEach((button) => {
                button.addEventListener("click", function () {
                    currentRow1 = this.closest("tr");

                    // 元の値を取得してダイアログに設定
                    const dateCell = currentRow1.querySelector(".date-picker");
                    const dateValue = dateCell.getAttribute("data-raw-date") || dateCell.innerText;
                    const timeValue = currentRow1.querySelector(".time-picker").innerText;
                    const highValue = currentRow1.querySelector(".high1").innerText;
                    const lowValue = currentRow1.querySelector(".low1").innerText;
                    const medicineValue = currentRow1.querySelector(".medicine1").innerText;

                    document.getElementById("editDate").value = formatDisplayDate(dateValue);
                    document.getElementById("editPeriod").value = dataArray.indexOf(timeValue);
                    document.getElementById("editHigh").value = highValue;
                    document.getElementById("editLow").value = lowValue;
                    setMedicineRadioValue("editMedicineStatus", medicineValue);

                    before_dateValue = dateValue
                    before_periodValue = dataArray.indexOf(timeValue)
                    before_itemId = currentRow1.getAttribute("data-item-id") || ""
                    // ダイアログを表示
                    dialog.classList.remove("is-hidden");

                });
            });

            const saveButton = document.getElementById("saveButton");
            saveButton.removeEventListener("click", savebutton); // 既存のリスナーを削除
            saveButton.addEventListener("click", savebutton); // 新しいリスナーを登録




            // キャンセルボタンの処理
            document.getElementById("cancelButton").onclick = () => {
                // ダイアログを閉じる
                dialog.classList.add("is-hidden");
            };

            // 削除ボタンの処理
            document.getElementById("deleteButton").onclick = () => {
                list = {
                    date: before_dateValue,
                    period: before_periodValue
                }

                Promise.resolve(deleteData(list, "pressure"))
                    .then(() => reloadPressureDataAndRender())
                    .then(() => {
                        dialog.classList.add("is-hidden");
                    })
                    .catch((error) => {
                        console.error("delete error:", error);
                        alert("削除処理でエラーが発生しました。");
                    });
            };


        }


        function savebutton() {

            let dialog = document.getElementById("editDialog");

            // 保存ボタンの処理
            const newDate = document.getElementById("editDate").value;
            const newTime = document.getElementById("editPeriod").value;
            const newHigh = document.getElementById("editHigh").value;
            const newLow = document.getElementById("editLow").value;
            const newMedicine = readMedicineRadioValue("editMedicineStatus");

            if (newDate && newHigh && newTime && newLow) {
                var olddata = {
                    date: before_dateValue,
                    period: before_periodValue
                }

                var newdata = {
                    itemId: before_itemId,
                    date: String(newDate),
                    period: parseInt(newTime),
                    high: parseInt(newHigh),
                    low: parseInt(newLow),
                    medicine: newMedicine

                }
                const sameKey =
                    String(olddata.date) === String(newdata.date) &&
                    Number(olddata.period) === Number(newdata.period);

                const savePressure = (typeof setPressure === "function") ?
                    setPressure :
                    ((payload) => addData(payload, "pressure"));
                const updatePressure = (typeof putData === "function") ?
                    putData :
                    ((payload) => addData(payload, "pressure"));
                const request = sameKey ?
                    Promise.resolve(updatePressure(newdata, "pressure")) :
                    Promise.resolve(updatePressure(newdata, "pressure"))
                    .then(() => deleteData(olddata, "pressure"));

                request.then(() => {
                    // 保存後は再取得して表示を揃える
                    return reloadPressureDataAndRender();
                }).then(() => {
                    dialog.classList.add("is-hidden");
                }).catch((error) => {
                    console.error("save/update error:", error);
                    alert("保存処理でエラーが発生しました。");
                });

            } else {
                alert(bt("fillAll"));
            }
            //                allData = allData.filter(item => !(item.date == before_dateValue && item.period ==
            //                    before_periodValue));


            //               allData.push({
            //                   date: newDate,
            //                   period: newTime,
            //                   high: newHigh,
            //                   low: newLow
            //               })


        }

        function createTablePage() {
            tableBody = document.querySelector('#table tbody');
            tableBody.innerHTML = ''; // テーブルをクリア

            const sortedData = getSortedPressureData();
            sortedData.forEach((label, index) => {
                datetime = formatDisplayDate(label.date)
                const medicinePart = medicineMark(label.medicine);
                const highAlertClass = Number(label.high) >= 140 ? "bp-alert-high" : "";
                const lowAlertClass = Number(label.low) <= 70 ? "bp-alert-low" : "";
                const row = `<tr>
                    <!-- 日付部分: datepickerを使用 -->
                    <td>${datetime}</td>
                    <td>${dataArray[label.period]}</td>
                    <!-- 最高血圧部分: contenteditable -->
                    <td class="${highAlertClass}">${label.high}</td>
                    <td class="${lowAlertClass}">${label.low}</td>
                    <td>${medicinePart}</td>

                </tr>`;

                tableBody.insertAdjacentHTML('beforeend', row);
                $(".date-picker").datepicker({
                    dateFormat: 'yy-mm-dd HH:mm'
                });
            });
        }

        function setallData() {
            allData = allData.filter(item => !(item.date == before_dateValue && item.period == before_periodValue));
            currentRow1.remove();
        }
        document.addEventListener("language-changed", function (event) {
            setLanguage(normalizeLangToUi(event.detail && event.detail.langId));
        });
        applyI18n();
        window.addEventListener("load", bootPressureApp);
    </script>
