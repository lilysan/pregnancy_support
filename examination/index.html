<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>しんさつコミュニケーションボード</title>
</head>

<body>
    <header class="app-header">
        <h1>しんさつコミュニケーションボード</h1>
        <p>カテゴリごとに、必要なやり取りだけテキストと音でお手伝いします。</p>
    </header>

    <section id="languagePicker" class="language-picker" aria-label="言語選択"></section>

    <main class="app-shell">
        <nav id="categoryTabs" class="category-tabs" aria-label="カテゴリ"></nav>
        <section id="accordionList" class="accordion-list" aria-live="polite"></section>
    </main>
    <button id="freeTranslateBtn" class="free-translate-btn" type="button" aria-label="自由入力翻訳">自由入力/翻訳</button>
    <section id="freeTranslatePanel" class="free-translate-panel" aria-label="自由入力翻訳パネル">
        <div class="free-translate-head">
            <p class="free-translate-title">自由入力翻訳</p>
            <button id="freeTranslateCloseBtn" class="free-translate-close" type="button" aria-label="閉じる">閉じる</button>
        </div>
        <textarea id="freeTranslateInput" class="free-translate-input" placeholder="日本語を入力"></textarea>
        <button id="freeTranslateRunBtn" class="free-translate-run" type="button">翻訳する</button>
        <p id="freeTranslateStatus" class="free-translate-status"></p>
        <div id="freeTranslateOutput" class="free-translate-output"></div>
    </section>
    <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="ページトップへ戻る">▲</button>

    <script>
        const languageConfig = [{
                code: "en-US",
                label: "英語 / English",
                csv: "enData.csv",
                speech: "en-US"
            },
            {
                code: "zh",
                label: "中国語 / 中文",
                csv: "zhData.csv",
                speech: "zh-CN"
            },
            {
                code: "de",
                label: "ドイツ語 / Deutsch",
                csv: "deData.csv",
                speech: "de-DE"
            },
            {
                code: "ve",
                label: "ベトナム語 / Tiếng Việt",
                csv: "ve.csv",
                speech: "vi-VN"
            },
            {
                code: "pr",
                label: "ポルトガル語 / Português",
                csv: "pr.csv",
                speech: "pt-PT"
            },
            {
                code: "ko",
                label: "韓国語 / 한국어",
                csv: "ko.csv",
                speech: "ko-KR"
            }
        ];

        let localData = [];
        let translatedByLanguage = {};
        let selectedLanguage = "en-US";
        let selectedType = "";
        let scrollTopBtn = null;
        let freeTranslatePanel = null;
        let freeTranslateStatus = null;
        let freeTranslateOutput = null;
        const pharmacySelections = new Set();

        window.addEventListener("load", init);

        async function init() {
            setupScrollTopButton();
            setupFreeTranslatePanel();
            renderLanguagePicker();
            setLoading("データを読み込んでいます...");

            await fetchAllData();

            const types = [...new Set(localData.map(item => item.type || "その他"))];
            selectedType = types[0] || "";
            renderAll();
        }

        function setupFreeTranslatePanel() {
            const trigger = document.getElementById("freeTranslateBtn");
            freeTranslatePanel = document.getElementById("freeTranslatePanel");
            const runBtn = document.getElementById("freeTranslateRunBtn");
            const input = document.getElementById("freeTranslateInput");
            const closeBtn = document.getElementById("freeTranslateCloseBtn");
            freeTranslateStatus = document.getElementById("freeTranslateStatus");
            freeTranslateOutput = document.getElementById("freeTranslateOutput");
            if (!trigger || !freeTranslatePanel || !runBtn || !input || !closeBtn || !freeTranslateStatus || !freeTranslateOutput) return;

            trigger.addEventListener("click", () => {
                freeTranslatePanel.classList.toggle("open");
                if (freeTranslatePanel.classList.contains("open")) input.focus();
            });
            closeBtn.addEventListener("click", () => {
                freeTranslatePanel.classList.remove("open");
            });

            runBtn.addEventListener("click", async () => {
                const text = String(input.value || "").trim();
                if (!text) {
                    freeTranslateStatus.textContent = "日本語を入力してください。";
                    freeTranslateOutput.textContent = "";
                    return;
                }

                freeTranslateStatus.textContent = "翻訳中...";
                freeTranslateOutput.textContent = "";
                const target = getFreeTranslateTargetCode(selectedLanguage);

                try {
                    const translated = await translateFreeFromJapanese(text, target);
                    freeTranslateStatus.textContent = "";
                    freeTranslateOutput.textContent = translated || "(翻訳結果なし)";
                    if (translated) {
                        speakPair(text, translated);
                    }
                } catch (err) {
                    freeTranslateStatus.textContent = "翻訳に失敗しました。通信環境をご確認ください。";
                    freeTranslateOutput.textContent = "";
                    console.error(err);
                }
            });
        }

        function getFreeTranslateTargetCode(langCode) {
            const map = {
                "en-US": "en",
                "zh": "zh-CN",
                "de": "de",
                "ve": "vi",
                "pr": "pt",
                "ko": "ko"
            };
            return map[langCode] || "en";
        }

        async function translateFreeFromJapanese(text, targetCode) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=${encodeURIComponent(targetCode)}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error("Translate API failed");
            const data = await response.json();
            if (!Array.isArray(data) || !Array.isArray(data[0])) return "";
            return data[0].map(part => Array.isArray(part) ? (part[0] || "") : "").join("");
        }

        function setupScrollTopButton() {
            scrollTopBtn = document.getElementById("scrollTopBtn");
            if (!scrollTopBtn) return;

            scrollTopBtn.addEventListener("click", () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });

            window.addEventListener("scroll", updateScrollTopButtonVisibility, {
                passive: true
            });
            updateScrollTopButtonVisibility();
        }

        function updateScrollTopButtonVisibility() {
            if (!scrollTopBtn) return;
            if (window.scrollY > 200) {
                scrollTopBtn.classList.add("visible");
            } else {
                scrollTopBtn.classList.remove("visible");
            }
        }

        function normalizeDataRow(item) {
            return {
                type: String((item && item.type) || "その他").trim() || "その他",
                category: String((item && item.category) || "").trim(),
                data: [
                    item && item.data1,
                    item && item.data2,
                    item && item.data3,
                    item && item.data4,
                    item && item.data5,
                    item && item.data6,
                    item && item.data7,
                    item && item.data8,
                    item && item.data9,
                    item && item.data10,
                    item && item.data11,
                    item && item.data12,
                    item && item.data13,
                    item && item.data14,
                    item && item.data15,
                    item && item.data16,
                    item && item.data17,
                    item && item.data18,
                    item && item.data19,
                    item && item.data20,
                    item && item.data21
                ].map(function (v) {
                    return String(v || "").trim();
                })
            };
        }

        function isPregnancyScope(row) {
            const text = `${row.type} ${row.category}`.toLowerCase();
            return !/産後|postpartum|postnatal|puerper/i.test(text);
        }

        async function fetchAllData() {
            const localRaw = await getDataFromCSV("localData.csv");
            const keepIndexes = [];
            localRaw.forEach((row, idx) => {
                if (isPregnancyScope(row)) keepIndexes.push(idx);
            });

            localData = keepIndexes.map(idx => localRaw[idx]);

            for (const lang of languageConfig) {
                const translatedRaw = await getDataFromCSV(lang.csv);
                translatedByLanguage[lang.code] = keepIndexes.map(idx => translatedRaw[idx] || {
                    type: "",
                    category: "",
                    data: ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "",
                        ""
                    ]
                });
            }
        }

        async function getDataFromCSV(fileName) {
            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error(`Failed to fetch ${fileName}`);
                const csvText = await response.text();
                const rows = parseCSV(csvText).filter(row => row.some(v => String(v || "").trim() !== ""));
                if (!rows.length) return [];
                const header = rows[0].map(h => String(h || "").trim());
                const hIndex = {};
                header.forEach((h, i) => {
                    hIndex[h] = i;
                });

                const dataRows = rows.slice(1);
                return dataRows.map(row => {
                    const obj = {
                        type: row[hIndex.type] || "",
                        type2: row[hIndex.type2] || "",
                        category: row[hIndex.category] || "",
                        data1: row[hIndex.data1] || "",
                        data2: row[hIndex.data2] || "",
                        data3: row[hIndex.data3] || "",
                        data4: row[hIndex.data4] || "",
                        data5: row[hIndex.data5] || "",
                        data6: row[hIndex.data6] || "",
                        data7: row[hIndex.data7] || "",
                        data8: row[hIndex.data8] || "",
                        data9: row[hIndex.data9] || "",
                        data10: row[hIndex.data10] || "",
                        data11: row[hIndex.data11] || "",
                        data12: row[hIndex.data12] || "",
                        data13: row[hIndex.data13] || "",
                        data14: row[hIndex.data14] || "",
                        data15: row[hIndex.data15] || "",
                        data16: row[hIndex.data16] || "",
                        data17: row[hIndex.data17] || "",
                        data18: row[hIndex.data18] || "",
                        data19: row[hIndex.data19] || "",
                        data20: row[hIndex.data20] || "",
                        data21: row[hIndex.data21] || "",
                    };
                    return normalizeDataRow(obj);
                }).filter(row => row.category || row.data.some(v => v));
            } catch (error) {
                console.error(error);
                return [];
            }
        }

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                const next = text[i + 1];

                if (ch === "\"") {
                    if (inQuotes && next === "\"") {
                        field += "\"";
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                    continue;
                }

                if (ch === "," && !inQuotes) {
                    row.push(field);
                    field = "";
                    continue;
                }

                if ((ch === "\n" || ch === "\r") && !inQuotes) {
                    if (ch === "\r" && next === "\n") i++;
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = "";
                    continue;
                }

                field += ch;
            }

            if (field.length > 0 || row.length > 0) {
                row.push(field);
                rows.push(row);
            }

            return rows;
        }

        function renderLanguagePicker() {
            const picker = document.getElementById("languagePicker");
            picker.innerHTML = "";

            languageConfig.forEach(lang => {
                const btn = document.createElement("button");
                btn.className = "language-btn" + (lang.code === selectedLanguage ? " active" : "");
                btn.type = "button";
                btn.textContent = lang.label;
                btn.addEventListener("click", () => {
                    selectedLanguage = lang.code;
                    renderAll();
                });
                picker.appendChild(btn);
            });
        }

        function renderCategoryTabs() {
            const tabs = document.getElementById("categoryTabs");
            tabs.innerHTML = "";

            const types = [...new Set(localData.map(item => item.type || "その他"))];
            types.forEach(type => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "tab-btn" + (type === selectedType ? " active" : "");
                const translatedType = getTranslatedTypeLabel(type);
                btn.innerHTML = `
                    <span class="tab-ja">${escapeHtml(type)}</span>
                    <span class="tab-tr">${escapeHtml(translatedType)}</span>
                `;
                btn.addEventListener("click", () => {
                    selectedType = type;
                    renderAccordion();
                    renderCategoryTabs();
                });
                tabs.appendChild(btn);
            });
        }

        function getTranslatedTypeLabel(localType) {
            if (selectedLanguage === "ja" || selectedLanguage === "ja-JP") return "";
            const translated = translatedByLanguage[selectedLanguage] || [];
            for (let i = 0; i < localData.length; i++) {
                const row = localData[i];
                if ((row.type || "その他") !== localType) continue;
                const tRow = translated[i];
                const tType = tRow && tRow.type ? String(tRow.type).trim() : "";
                if (tType && tType !== localType) return tType;
            }
            return "";
        }

        function renderAccordion() {
            const container = document.getElementById("accordionList");
            container.innerHTML = "";

            const translated = translatedByLanguage[selectedLanguage] || [];
            const rows = [];

            localData.forEach((row, index) => {
                if ((row.type || "その他") === selectedType) rows.push({
                    row,
                    index
                });
            });

            if (!rows.length) {
                setLoading("このカテゴリには表示できるやり取りがありません。");
                return;
            }

            rows.forEach((item, orderIndex) => {
                const row = item.row;
                const rowIndex = item.index;
                const isPharmacyCategory = ((row.type || "").trim() === "薬局");
                const tRow = translated[rowIndex] || {
                    category: "",
                    data: []
                };

                const details = document.createElement("details");
                details.className = "talk-card";
                if ((row.type || "").trim() === "ママと赤ちゃんのサポートシリーズ") {
                    details.open = true;
                }

                const summary = document.createElement("summary");
                summary.className = "talk-summary";
                summary.innerHTML = `
                    <div class="summary-texts">
                        <p class="talk-title">やり取り ${orderIndex + 1}</p>
                        <p class="ja-text">${escapeHtml(row.category)}</p>
                        <p class="translated-text">${escapeHtml(tRow.category || "")}</p>
                    </div>
                `;

                const panel = document.createElement("div");
                panel.className = "talk-panel";

                const speakCategoryBtn = document.createElement("button");
                speakCategoryBtn.type = "button";
                speakCategoryBtn.className = "speak-btn large-btn";
                speakCategoryBtn.textContent = "この質問を読み上げ";
                speakCategoryBtn.addEventListener("click", () => {
                    speakPair(row.category, tRow.category || "");
                });

                const answerGrid = document.createElement("div");
                answerGrid.className = "answer-grid";

                row.data.forEach((jaText, answerIndex) => {
                    if (!jaText) return;
                    const translatedText = (tRow.data && tRow.data[answerIndex]) ? tRow.data[
                        answerIndex] : "";
                    const jaParsed = parseLinkText(jaText);
                    const trParsed = parseLinkText(translatedText);
                    const specialItems = buildSpecialItems(jaText);

                    if (specialItems) {
                        const tokenWrap = document.createElement("div");
                        tokenWrap.className = "token-wrap";

                        const tokenTitle = document.createElement("p");
                        tokenTitle.className = "token-title";
                        tokenTitle.textContent = specialItems.titleJa;

                        const tokenHint = document.createElement("p");
                        tokenHint.className = "token-hint";
                        tokenHint.textContent = specialItems.titleTr;

                        const tokenGrid = document.createElement("div");
                        tokenGrid.className = "token-grid";

                        specialItems.options.forEach(option => {
                            const optionBtn = document.createElement("button");
                            optionBtn.type = "button";
                            optionBtn.className = "answer-btn large-btn token-btn";
                            const pharmacyKey = `pharmacy-token-${rowIndex}-${answerIndex}-${option.ja}`;
                            if (isPharmacyCategory && pharmacySelections.has(pharmacyKey)) {
                                optionBtn.classList.add("selected-highlight");
                            }
                            optionBtn.innerHTML = `
                                <span class="answer-ja">${escapeHtml(option.ja)}</span>
                                <span class="answer-tr">${escapeHtml(option.tr)}</span>
                            `;
                            optionBtn.addEventListener("click", () => {
                                if (isPharmacyCategory) {
                                    togglePharmacySelection(optionBtn, pharmacyKey);
                                }
                                speakPair(option.ja, option.tr);
                            });
                            tokenGrid.appendChild(optionBtn);
                        });

                        tokenWrap.appendChild(tokenTitle);
                        tokenWrap.appendChild(tokenHint);
                        tokenWrap.appendChild(tokenGrid);
                        answerGrid.appendChild(tokenWrap);
                        return;
                    }

                    const answerBtn = document.createElement("button");
                    answerBtn.type = "button";
                    answerBtn.className = "answer-btn large-btn";
                    const pharmacyKey = `pharmacy-${rowIndex}-${answerIndex}`;
                    if (isPharmacyCategory && pharmacySelections.has(pharmacyKey)) {
                        answerBtn.classList.add("selected-highlight");
                    }
                    answerBtn.innerHTML = `
                        <span class="answer-ja">${escapeHtml(jaParsed.label)}</span>
                        <span class="answer-tr">${escapeHtml(trParsed.label)}</span>
                    `;
                    answerBtn.addEventListener("click", () => {
                        if (isPharmacyCategory) {
                            togglePharmacySelection(answerBtn, pharmacyKey);
                        }
                        const url = trParsed.url || jaParsed.url;
                        if (url) {
                            openLink(url);
                            return;
                        }
                        speakPair(jaText, translatedText);
                    });
                    answerGrid.appendChild(answerBtn);
                });

                panel.appendChild(speakCategoryBtn);
                panel.appendChild(answerGrid);
                details.appendChild(summary);
                details.appendChild(panel);
                container.appendChild(details);
            });
        }

        function renderAll() {
            renderLanguagePicker();
            renderCategoryTabs();
            renderAccordion();
        }

        function speakPair(localText, translatedText) {
            if (!("speechSynthesis" in window)) {
                alert("このブラウザは音声合成に対応していません。");
                return;
            }

            speechSynthesis.cancel();

            const localUttr = new SpeechSynthesisUtterance(localText);
            localUttr.lang = "ja-JP";
            speechSynthesis.speak(localUttr);

            if (translatedText) {
                const lang = languageConfig.find(item => item.code === selectedLanguage);
                const translatedUttr = new SpeechSynthesisUtterance(translatedText);
                translatedUttr.lang = lang ? lang.speech : selectedLanguage;
                speechSynthesis.speak(translatedUttr);
            }
        }

        function setLoading(text) {
            const container = document.getElementById("accordionList");
            container.innerHTML = `<p class="loading-text">${escapeHtml(text)}</p>`;
        }

        function getIllustrationSVG(type, index) {
            const styleA =
                `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="illustration"><rect width="120" height="120" rx="24" fill="#fde4d6"/><circle cx="60" cy="42" r="20" fill="#f7b799"/><ellipse cx="60" cy="84" rx="32" ry="24" fill="#ef8f72"/><circle cx="47" cy="40" r="3" fill="#673b2a"/><circle cx="73" cy="40" r="3" fill="#673b2a"/><path d="M50 50 Q60 58 70 50" stroke="#673b2a" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
            const styleB =
                `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="illustration"><rect width="120" height="120" rx="24" fill="#dbf1ff"/><rect x="28" y="22" width="64" height="76" rx="10" fill="#ffffff" stroke="#4f8dc9" stroke-width="4"/><circle cx="60" cy="48" r="9" fill="#4f8dc9"/><path d="M43 74h34M43 84h24" stroke="#4f8dc9" stroke-width="5" stroke-linecap="round"/></svg>`;
            const styleC =
                `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="illustration"><rect width="120" height="120" rx="24" fill="#e7f9e9"/><circle cx="60" cy="60" r="35" fill="#8ccf95"/><path d="M45 62l10 10 20-22" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            const set = [styleA, styleB, styleC];

            if (/痛み|症状|体調/.test(type)) return styleA;
            if (/検査|診察|受付|予約/.test(type)) return styleB;
            return set[index % set.length];
        }

        function buildSpecialItems(token) {
            const localized = getTokenLocalizedOptions(selectedLanguage);
            if (!localized[token]) return null;
            return localized[token];
        }

        function parseLinkText(value) {
            const text = String(value || "").trim();
            const marker = "||";
            if (!text.includes(marker)) {
                return {
                    label: text,
                    url: ""
                };
            }
            const splitIndex = text.indexOf(marker);
            const label = text.slice(0, splitIndex).trim();
            const url = text.slice(splitIndex + marker.length).trim();
            return {
                label,
                url
            };
        }

        function openLink(url) {
            if (typeof url !== "string") return;
            if (!url.startsWith("http://") && !url.startsWith("https://")) return;

            window.open(url, "_blank", "noopener,noreferrer");
        }

        function togglePharmacySelection(buttonEl, key) {
            if (pharmacySelections.has(key)) {
                pharmacySelections.delete(key);
                buttonEl.classList.remove("selected-highlight");
                return;
            }
            pharmacySelections.add(key);
            buttonEl.classList.add("selected-highlight");
        }

        function getTokenLocalizedOptions(langCode) {
            const base = {
                counter_kara: {
                    titleJa: "いつからですか",
                    optionsJa: ["今日から", "昨日から", "2〜3日前から", "1週間以上前から"]
                },
                counter_kai: {

                    optionsJa: ["1〜2回", "3〜5回", "6〜10回", "11回以上"]
                },
                kusurikaisuu: {
                    titleJa: "1日の使用回数",
                    optionsJa: ["1日1回", "1日2回", "1日3回", "必要時のみ"]
                }
            };

            const trByLang = {
                "en-US": {
                    counter_kara: {
                        titleTr: "Since when?",
                        optionsTr: ["Since today", "Since yesterday", "Since 2-3 days ago", "For more than a week"]
                    },
                    counter_kai: {

                        optionsTr: ["1-2 times", "3-5 times", "6-10 times", "11+ times"]
                    },
                    kusurikaisuu: {
                        titleTr: "How many times per day?",
                        optionsTr: ["Once a day", "Twice a day", "Three times a day", "Only when needed"]
                    }
                },
                "zh": {
                    counter_kara: {
                        titleTr: "从什么时候开始？",
                        optionsTr: ["从今天开始", "从昨天开始", "从2-3天前开始", "超过1周"]
                    },
                    counter_kai: {

                    },

                    }
                },
                "de": {
                    counter_kara: {

                    },

                "ve": {

                    },
                    counter_kai: {
                        titleTr: "Mỗi ngày bao nhiêu lần?",
                        optionsTr: ["1-2 lần", "3-5 lần", "6-10 lần", "Từ 11 lần trở lên"]
                    },
                    kusurikaisuu: {
                        titleTr: "Số lần dùng trong ngày?",
                        optionsTr: ["Ngày 1 lần", "Ngày 2 lần", "Ngày 3 lần", "Chỉ khi cần"]
                    }
                },
                "pr": {
                    counter_kara: {
                        titleTr: "Desde quando?",
                        optionsTr: ["Desde hoje", "Desde ontem", "Desde 2-3 dias atrás", "Há mais de 1 semana"]
                    },
                    counter_kai: {
                        titleTr: "Quantas vezes por dia?",
                        optionsTr: ["1-2 vezes", "3-5 vezes", "6-10 vezes", "11 vezes ou mais"]
                    },
                    kusurikaisuu: {
                        titleTr: "Quantas vezes por dia usar?",
                        optionsTr: ["1 vez ao dia", "2 vezes ao dia", "3 vezes ao dia", "Somente quando necessário"]
                    }
                },
                "ko": {
                    counter_kara: {
                        titleTr: "언제부터인가요?",
                        optionsTr: ["오늘부터", "어제부터", "2-3일 전부터", "1주일 이상 전부터"]
                    },
                    counter_kai: {
                        titleTr: "하루에 몇 번인가요?",
                        optionsTr: ["1-2회", "3-5회", "6-10회", "11회 이상"]
                    },
                    kusurikaisuu: {

                        optionsTr: ["하루 1회", "하루 2회", "하루 3회", "필요할 때만"]
                    }
                }
            };

            const fallback = trByLang["en-US"];
            const tr = trByLang[langCode] || fallback;
            const out = {};

            Object.keys(base).forEach(key => {
                out[key] = {
                    titleJa: base[key].titleJa,
                    titleTr: tr[key].titleTr,
                    options: base[key].optionsJa.map((ja, idx) => ({
                        ja,
                        tr: tr[key].optionsTr[idx]
                    }))
                };
            });

            return out;
        }

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }
    </script>
