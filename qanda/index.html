<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="app-header">
    <h1 id="pageTitle">Q&A</h1>
    <p id="pageLead">妊娠中によくある質問を、日本語と選択した言語で確認できます。</p>
  </header>

  <button type="button" id="languageSettingBtn" class="language-setting-btn">言語設定</button>
  <div id="languageDialog" class="is-hidden">
    <div id="languageDialogPanel">
      <div class="settings-header">
        <h2 id="languageDialogTitle">設定</h2>
        <button type="button" id="closeLanguageBtn">閉じる</button>
      </div>
      <p id="languageSectionTitle" class="settings-label">言語設定</p>
      <div id="languageOptionList" class="language-option-list"></div>
    </div>
  </div>

  <main class="main">
    <section class="search-panel" aria-label="検索">
      <div class="search-field">
        <label for="keywordSearch" id="keywordSearchLabel" class="search-label">フリーワード検索</label>
        <input id="keywordSearch" class="search-input" type="search" placeholder="質問や答えを入力" autocomplete="off">
      </div>
      <div class="tag-search">
        <p id="tagSearchLabel" class="search-label">タグ検索</p>
        <div id="tagFilterList" class="tag-filter-list"></div>
      </div>
      <p id="searchResultMeta" class="search-result-meta"></p>
    </section>
    <section id="qaList" class="qa-list" aria-live="polite"></section>
  </main>

    let selectedLanguage = 'en-US';
    let selectedTag = 'all';
    let keyword = '';

    window.addEventListener('load', init);

    function init() {
      document.getElementById('languageSettingBtn').addEventListener('click', openLanguageDialog);
      document.getElementById('closeLanguageBtn').addEventListener('click', closeLanguageDialog);
      document.getElementById('languageDialog').addEventListener('click', (event) => {
        if (event.target.id === 'languageDialog') closeLanguageDialog();
      });
      document.getElementById('keywordSearch').addEventListener('input', (event) => {
        keyword = String(event.target.value || '').trim().toLowerCase();
        renderQaList();
      });
      selectedLanguage = loadInitialLanguage();
      renderLanguageButtons();
      renderDialogText();
      renderTagFilters();
      renderQaList();
    }

    function openLanguageDialog() {
      document.getElementById('languageDialog').classList.remove('is-hidden');
    }

    function closeLanguageDialog() {
      document.getElementById('languageDialog').classList.add('is-hidden');
    }

    function loadInitialLanguage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && languageOptions.some((lang) => lang.code === saved)) return saved;
      return detectInitialLanguage();
    }

    function detectInitialLanguage() {
      const raw = String(navigator.language || 'en-US').toLowerCase();
      if (raw.startsWith('ja')) return 'ja';
      if (raw.startsWith('zh')) return 'zh';
      if (raw.startsWith('fr')) return 'fr';
      if (raw.startsWith('ko')) return 'ko';
      if (raw.startsWith('pt')) return 'pr';
      if (raw.startsWith('tl') || raw.startsWith('fil')) return 'tl';
      if (raw.startsWith('vi')) return 've';
      if (raw.startsWith('th')) return 'th';
      if (raw.startsWith('de')) return 'de';
      if (raw.startsWith('id')) return 'id';
      if (raw.startsWith('ru')) return 'ru';
      if (raw.startsWith('ne')) return 'ne';
      if (raw.startsWith('lo')) return 'lo';
      if (raw.startsWith('uk')) return 'uk';
      if (raw.startsWith('fa')) return 'fa-AF';
      if (raw.startsWith('si')) return 'si';
      if (raw.startsWith('ms')) return 'ms';
      if (raw.startsWith('my')) return 'my';
      if (raw.startsWith('bn')) return 'bn';
      if (raw.startsWith('ur')) return 'ur';
      return 'en-US';
    }

    function renderLanguageButtons() {
      const list = document.getElementById('languageOptionList');
      list.innerHTML = '';
      languageOptions.forEach((lang) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'language-option-btn' + (selectedLanguage === lang.code ? ' active' : '');
        btn.textContent = lang.label;
        btn.addEventListener('click', () => {
          selectedLanguage = lang.code;
          localStorage.setItem(STORAGE_KEY, selectedLanguage);
          closeLanguageDialog();
          renderLanguageButtons();
          renderDialogText();
          renderQaList();
        });
        list.appendChild(btn);
      });
    }

    function renderDialogText() {
      const text = DIALOG_TEXT[selectedLanguage] || DIALOG_TEXT['en-US'];
      document.getElementById('languageSettingBtn').textContent = text.settings;
      document.getElementById('languageDialogTitle').textContent = text.settings;
      document.getElementById('languageSectionTitle').textContent = text.language;
      document.getElementById('closeLanguageBtn').textContent = text.close;
      document.getElementById('pageLead').textContent = text.lead || DIALOG_TEXT['en-US'].lead;
      document.getElementById('keywordSearchLabel').textContent = text.keyword;
      document.getElementById('keywordSearch').placeholder = text.keywordPlaceholder;
      document.getElementById('tagSearchLabel').textContent = text.tag;
      renderTagFilters();
    }

    function renderTagFilters() {
      const text = DIALOG_TEXT[selectedLanguage] || DIALOG_TEXT['en-US'];
      const container = document.getElementById('tagFilterList');
      const tags = Array.from(new Set(qaItems.flatMap((item) => item.tags || [])));
      const filters = [{
        id: 'all',
        label: text.allTags
      }, ...tags.map((tag) => ({
        id: tag,
        label: tag
      }))];
      container.innerHTML = '';
      filters.forEach((tag) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tag-filter-btn' + (selectedTag === tag.id ? ' active' : '');
        btn.textContent = tag.label;
        btn.addEventListener('click', () => {
          selectedTag = tag.id;
          renderTagFilters();
          renderQaList();
        });
        container.appendChild(btn);
      });
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tag-filter-btn' + (selectedTag === "system" ? ' active' : '');
      btn.textContent = "妊娠期・分娩期・育児期の主要制度一覧";
      btn.addEventListener('click', () => {
        selectedTag = "system";
        window.open('../systeminformation', '_blank');
      });
      container.appendChild(btn);
      const btn1 = document.createElement('button');
      btn1.type = 'button';
      btn1.className = 'tag-filter-btn' + (selectedTag === "sex" ? ' active' : '');
      btn1.textContent = "性交渉について";
      btn1.addEventListener('click', () => {
        selectedTag = "sex";
        window.open('../aboutsex', '_blank');
      });
      container.appendChild(btn1);
      const btn2 = document.createElement('button');
      btn2.type = 'button';
      btn2.className = 'tag-filter-btn' + (selectedTag === "aruaru" ? ' active' : '');
      btn2.textContent = "日本のスタンダード";
      btn2.addEventListener('click', () => {
        selectedTag = "aruaru";
        window.open('../aruaru', '_blank');
      });
      container.appendChild(btn2);
    }

    function renderQaList() {
      const list = document.getElementById('qaList');
      list.innerHTML = '';
      const text = DIALOG_TEXT[selectedLanguage] || DIALOG_TEXT['en-US'];
      const filteredItems = qaItems.filter(matchesFilter);
      document.getElementById('searchResultMeta').textContent = filteredItems.length ?
        `${filteredItems.length}${selectedLanguage === 'zh' ? '' : ' '}${text.result}` :
        text.noResult;

      filteredItems.forEach((item, index) => {
        const details = document.createElement('details');
        details.className = 'qa-card';
        if (index === 0) details.open = true;

        const summary = document.createElement('summary');
        summary.className = 'qa-summary';
        summary.innerHTML = `
          <p class="qa-ja">${escapeHtml(item.jaQ)}</p>
          <p class="qa-tr${selectedLanguage === 'ja' ? ' is-hidden' : ''}">${escapeHtml(getTranslatedQuestion(item))}</p>
        `;

        const panel = document.createElement('div');
        panel.className = 'qa-panel';
        panel.innerHTML = `
          <div class="answer-block">
            <p class="answer-label">A</p>
            <p class="answer-ja${isPending(item.jaA) ? ' answer-pending' : ''}">${escapeHtml(item.jaA)}</p>
            <p class="answer-tr${isPending(item.enA) ? ' answer-pending' : ''}${selectedLanguage === 'ja' ? ' is-hidden' : ''}">${escapeHtml(getTranslatedAnswer(item))}</p>
          </div>
        `;

        details.appendChild(summary);
        details.appendChild(panel);
        list.appendChild(details);
      });
    }

    function matchesFilter(item) {
      const tagMatch = selectedTag === 'all' || (item.tags || []).includes(selectedTag);
      if (!tagMatch) return false;
      if (!keyword) return true;
      const haystack = [
        item.jaQ,
        item.enQ,
        item.jaA,
        item.enA,
        ...(item.tags || [])
      ].join(' ').toLowerCase();
      return haystack.includes(keyword);
    }

    function getTranslatedQuestion(item) {
      if (selectedLanguage === 'ja') return '';
      return item.enQ || '';
    }

    function getTranslatedAnswer(item) {
      if (selectedLanguage === 'ja') return '';
      return item.enA || '';
    }

    function isPending(text) {
      return /準備中|being prepared/i.test(String(text || ''));
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
