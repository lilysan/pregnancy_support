<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受付コミュニケーションボード</title>
    <script src="language.js"></script>
    <style>
        :root {
            --bg: #fffaf5;
            --card: #ffffff;
            --ink: #342e2b;
            --sub: #6e6460;
            --accent: #e46f47;
            --accent-soft: #ffe5db;
            --line: #eadccf;
            --tab: #f4ece5;
            --ok: #fff0b8;
            --ok-line: #ecbf45;
            --shadow: 0 8px 20px rgba(129, 84, 56, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 8% 8%, #fff0e9 0%, transparent 36%),
                radial-gradient(circle at 92% 10%, #ffefe1 0%, transparent 34%),
                var(--bg);
            color: var(--ink);
            font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        }

        .app-header {
            padding: 18px 14px 8px;
        }

        .app-header h1 {
            margin: 0;
            font-size: 1.3rem;
            line-height: 1.35;
        }

        .app-header p {
            margin: 6px 0 0;
            font-size: 0.92rem;
            color: var(--sub);
        }

        .language-picker {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            padding: 10px 12px;
            background: linear-gradient(to bottom, rgba(255, 250, 245, 0.97), rgba(255, 250, 245, 0.9));
        }

        .language-btn {
            border: 2px solid var(--line);
            border-radius: 14px;
            background: #fff;
            color: var(--ink);
            font-size: 0.88rem;
            min-height: 54px;
            padding: 8px;
            text-align: left;
            font-weight: 700;
        }

        .language-btn.active {
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        .main {
            padding: 0 12px 24px;
            margin-bottom: 60px;
        }

        .category-tabs {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            background: rgba(255, 250, 245, 0.94);
            padding: 10px 0;
        }

        .tab-btn {
            flex: 0 0 auto;
            border: none;
            border-radius: 999px;
            background: var(--tab);
            color: var(--ink);
            min-height: 46px;
            padding: 10px 14px;
            font-size: 0.94rem;
            font-weight: 700;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .accordion-list {
            display: grid;
            gap: 12px;
        }

        .talk-card {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--card);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .talk-summary {
            list-style: none;
            padding: 12px;
            cursor: pointer;
        }

        .talk-summary::-webkit-details-marker {
            display: none;
        }

        .talk-title {
            margin: 0;
            font-size: 0.88rem;
            color: var(--sub);
        }

        .talk-ja {
            margin: 4px 0 0;
            font-size: 1.08rem;
            line-height: 1.35;
            font-weight: 700;
        }

        .talk-tr {
            margin: 4px 0 0;
            font-size: 0.96rem;
            line-height: 1.35;
            color: var(--sub);
        }

        .talk-panel {
            border-top: 1px solid var(--line);
            background: #fffdfb;
            padding: 12px;
        }

        .option-grid {
            display: grid;
            gap: 8px;
            margin-top: 10px;
        }

        .large-btn {
            width: 100%;
            min-height: 72px;
            border: 2px solid var(--line);
            border-radius: 14px;
            background: #fff;
            color: var(--ink);
            padding: 10px;
            text-align: left;
            font-size: 1rem;
            font-weight: 700;
        }

        .speak-btn {
            text-align: center;
            background: var(--accent-soft);
            border-color: #ffc2ae;
        }

        .option-btn.selected {
            background: var(--ok);
            border-color: var(--ok-line);
            box-shadow: inset 0 0 0 2px rgba(236, 191, 69, 0.22);
        }

        .option-ja {
            display: block;
            font-size: 1.03rem;
            line-height: 1.35;
        }

        .option-tr {
            display: block;
            margin-top: 4px;
            font-size: 0.92rem;
            line-height: 1.3;
            color: var(--sub);
        }

        .questionnaire-wrap {
            margin-top: 10px;
        }

        .questionnaire-note {
            margin: 0 0 8px;
            color: var(--sub);
            font-size: 0.9rem;
        }

        .free-translate-btn {
            position: fixed;
            left: 12px;
            bottom: 18px;
            z-index: 50;
            min-height: 56px;
            padding: 10px 14px;
            border: none;
            border-radius: 999px;
            background: #3f7f6f;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(30, 66, 57, 0.25);
        }

        .free-translate-panel {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 84px;
            z-index: 55;
            display: none;
            background: #fffdf9;
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 12px;
        }

        .free-translate-panel.open {
            display: block;
        }

        .free-translate-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .free-translate-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .free-translate-close {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            border-radius: 999px;
            min-height: 36px;
            padding: 0 12px;
            font-size: 0.86rem;
            font-weight: 700;
        }

        .free-translate-input {
            width: 100%;
            min-height: 96px;
            border: 2px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            font-size: 1rem;
            resize: vertical;
        }

        .free-translate-run {
            margin-top: 10px;
            width: 100%;
            min-height: 52px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
        }

        .free-translate-status {
            margin: 8px 0 0;
            color: var(--sub);
            font-size: 0.9rem;
        }

        .free-translate-output {
            margin-top: 8px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid var(--line);
            padding: 10px;
            min-height: 56px;
            font-size: 1rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .scroll-top-btn {
            position: fixed;
            right: 12px;
            bottom: 18px;
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(82, 42, 20, 0.28);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 50;
        }

        .scroll-top-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        @media (min-width: 760px) {
            .main {
                max-width: 760px;
                margin: 0 auto;
            }

            .language-picker {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .free-translate-panel {
                max-width: 760px;
                margin: 0 auto;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: calc(100% - 24px);
            }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <h1>受付コミュニケーションボード</h1>
        <p>受付〜会計までの説明を、言語切替と音声で案内します。</p>
    </header>

    <section id="languagePicker" class="language-picker" aria-label="言語選択"></section>

    <main class="main">
        <nav id="categoryTabs" class="category-tabs" aria-label="カテゴリ"></nav>
        <section id="accordionList" class="accordion-list" aria-live="polite"></section>
    </main>

    <button id="freeTranslateBtn" class="free-translate-btn" type="button" aria-label="自由入力翻訳">自由入力/翻訳</button>
    <section id="freeTranslatePanel" class="free-translate-panel" aria-label="自由入力翻訳パネル">
        <div class="free-translate-head">
            <p class="free-translate-title">自由入力翻訳</p>
            <button id="freeTranslateCloseBtn" class="free-translate-close" type="button" aria-label="閉じる">閉じる</button>
        </div>
        <textarea id="freeTranslateInput" class="free-translate-input" placeholder="日本語を入力"></textarea>
        <button id="freeTranslateRunBtn" class="free-translate-run" type="button">翻訳する</button>
        <p id="freeTranslateStatus" class="free-translate-status"></p>
        <div id="freeTranslateOutput" class="free-translate-output"></div>
    </section>

    <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="ページトップへ戻る">▲</button>

    <script>
        const languageOptions = [{
                code: "english",
                label: "英語 / English",
                speech: "en-US",
                translateTarget: "en",
                questionnairePdf: "./questionnaire/english.pdf"
            },
            {
                code: "chinese",
                label: "中国語 / 中文",
                speech: "zh-CN",
                translateTarget: "zh-CN",
                questionnairePdf: "./questionnaire/chinese.pdf"
            },
            {
                code: "korean",
                label: "韓国語 / 한국어",
                speech: "ko-KR",
                translateTarget: "ko",
                questionnairePdf: "./questionnaire/korean.pdf"
            },
            {
                code: "russian",
                label: "ロシア語 / Русский",
                speech: "ru-RU",
                translateTarget: "ru",
                questionnairePdf: null
            },
            {
                code: "portuguese",
                label: "ポルトガル語 / Português",
                speech: "pt-PT",
                translateTarget: "pt",
                questionnairePdf: "./questionnaire/portuguese.pdf"
            },
            {
                code: "filipino",
                label: "フィリピノ語 / Filipino",
                speech: "tl-PH",
                translateTarget: "tl",
                questionnairePdf: "./questionnaire/filipino.pdf"
            },
            {
                code: "indonesian",
                label: "インドネシア語 / Indonesia",
                speech: "id-ID",
                translateTarget: "id",
                questionnairePdf: "./questionnaire/indonesian.pdf"
            },
            {
                code: "japanese",
                label: "やさしい日本語",
                speech: "ja-JP",
                translateTarget: "ja",
                questionnairePdf: null
            }
        ];

        const sections = [{
                id: "reception",
                titleJa: "受付",
                titleFallback: "Reception",
                cards: [{
                        key: "first_time",
                        ja: "初めてですか？",
                        options: [{
                            key: "yes",
                            ja: "はい"
                        }, {
                            key: "no",
                            ja: "いいえ"
                        }],
                        multi: false
                    },
                    {
                        key: "visit_reason",
                        ja: "今日の受診理由を選んでください",
                        options: [{
                                key: "absence_period",
                                ja: "生理がとまった"
                            },
                            {
                                key: "nausea",
                                ja: "吐き気"
                            },
                            {
                                key: "possible_pregnancy",
                                ja: "妊娠かもしれない"
                            },
                            {
                                key: "inconsistent_period",
                                ja: "生理が規則的にこない"
                            },
                            {
                                key: "period_pain",
                                ja: "生理のときお腹が痛い"
                            },
                            {
                                key: "itching",
                                ja: "外陰部がかゆい"
                            },
                            {
                                key: "stomach_pain",
                                ja: "お腹が痛い"
                            },
                            {
                                key: "infertility_question",
                                ja: "不妊について聞きたい"
                            },
                            {
                                key: "other",
                                ja: "その他"
                            }
                        ],
                        multi: true
                    }
                ]
            },
            {
                id: "waiting",
                titleJa: "問診と待機",
                titleFallback: "Waiting Flow",
                cards: [{
                        key: "fill_form_waiting_room",
                        ja: "待合室で問診票をご記入ください。"
                    },
                    {
                        key: "question",
                        ja: "選択している言語の問診票PDFを開く",
                        questionnaire: true
                    },
                    {
                        key: "finished_filling_form",
                        ja: "記入が終わったら持ってきてください。"
                    },
                    {
                        key: "take_weight",
                        ja: "診察まで、体重・血圧・尿検査をお願いします。"
                    },
                    {
                        key: "weit_here",
                        ja: "診察まで、指定の場所でお待ちください。"
                    },
                    {
                        key: "staff_notification",
                        ja: "どこへ行くかは職員が案内します。"
                    },
                    {
                        key: "call_order",
                        ja: "名前（番号）の早い方からお呼びします。"
                    },
                    {
                        key: "call_order2",
                        ja: "状況により順番が前後する場合があります。"
                    },
                    {
                        key: "card",
                        ja: "診察券をお渡しします。次回から提示してください。"
                    }
                ]
            },
            {
                id: "medicine",
                titleJa: "薬と会計",
                titleFallback: "Medicine & Payment",
                cards: [{
                        key: "give_medicines_in_hospital",
                        ja: "薬は診察後に病院内でお渡しします。"
                    },
                    {
                        key: "give_medicines_out_of_hospital",
                        ja: "院外薬局で購入いただく場合があります。"
                    },
                    {
                        key: "prescription_validity",
                        ja: "処方箋には発行日を含めて4日間の有効期限があります。"
                    },
                    {
                        key: "payment_instructions_machine",
                        ja: "会計は自動精算機で行ってください。"
                    },
                    {
                        key: "payment_instructions_cashier",
                        ja: "会計は会計窓口で行ってください。"
                    }
                ]
            }
        ];

        let selectedLanguage = "english";
        let selectedSection = sections[0].id;
        const selectedOptions = new Set();

        window.addEventListener("load", init);

        function init() {
            setupScrollTopButton();
            setupFreeTranslatePanel();
            renderLanguageButtons();
            renderSectionTabs();
            renderCards();
        }

        function t(key, fallback) {
            const data = window.languagedata && window.languagedata[selectedLanguage];
            if (!data) return fallback || "";
            return data[key] || fallback || "";
        }

        function getSelectedLang() {
            return languageOptions.find(item => item.code === selectedLanguage) || languageOptions[0];
        }

        function renderLanguageButtons() {
            const picker = document.getElementById("languagePicker");
            picker.innerHTML = "";
            languageOptions.forEach(lang => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "language-btn" + (selectedLanguage === lang.code ? " active" : "");
                btn.textContent = lang.label;
                btn.addEventListener("click", () => {
                    selectedLanguage = lang.code;
                    renderLanguageButtons();
                    renderSectionTabs();
                    renderCards();
                });
                picker.appendChild(btn);
            });
        }

        function renderSectionTabs() {
            const tabs = document.getElementById("categoryTabs");
            tabs.innerHTML = "";
            sections.forEach(section => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "tab-btn" + (selectedSection === section.id ? " active" : "");
                btn.textContent = section.titleJa;
                btn.addEventListener("click", () => {
                    selectedSection = section.id;
                    renderSectionTabs();
                    renderCards();
                });
                tabs.appendChild(btn);
            });
        }

        function renderCards() {
            const list = document.getElementById("accordionList");
            list.innerHTML = "";
            const section = sections.find(s => s.id === selectedSection);
            if (!section) return;

            section.cards.forEach((card, index) => {
                const details = document.createElement("details");
                details.className = "talk-card";
                const summary = document.createElement("summary");
                summary.className = "talk-summary";
                summary.innerHTML = `
                    <p class="talk-title">項目 ${index + 1}</p>
                    <p class="talk-ja">${escapeHtml(card.ja)}</p>
                    <p class="talk-tr">${escapeHtml(t(card.key, card.titleFallback || ""))}</p>
                `;

                const panel = document.createElement("div");
                panel.className = "talk-panel";

                const speakBtn = document.createElement("button");
                speakBtn.type = "button";
                speakBtn.className = "large-btn speak-btn";
                speakBtn.textContent = "この項目を読み上げ";
                speakBtn.addEventListener("click", () => {
                    speakPair(card.ja, t(card.key, ""));
                });
                panel.appendChild(speakBtn);

                if (card.questionnaire) {
                    const wrap = document.createElement("div");
                    wrap.className = "questionnaire-wrap";
                    const note = document.createElement("p");
                    note.className = "questionnaire-note";
                    note.textContent = `${getSelectedLanguageNameForNote()}の問診票PDFを開く`;
                    const qBtn = document.createElement("button");
                    qBtn.type = "button";
                    qBtn.className = "large-btn";
                    qBtn.textContent = t("question", "medical questionnaire");
                    qBtn.addEventListener("click", () => {
                        const lang = getSelectedLang();
                        if (!lang.questionnairePdf) {
                            alert("この言語の問診票PDFは未設定です。");
                            return;
                        }
                        window.open(lang.questionnairePdf, "_blank", "noopener,noreferrer");
                    });
                    wrap.appendChild(note);
                    wrap.appendChild(qBtn);
                    panel.appendChild(wrap);
                }

                if (Array.isArray(card.options) && card.options.length) {
                    const grid = document.createElement("div");
                    grid.className = "option-grid";
                    card.options.forEach(opt => {
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "large-btn option-btn";
                        const key = `${section.id}-${card.key}-${opt.key}`;
                        if (selectedOptions.has(key)) btn.classList.add("selected");

                        const tr = t(opt.key, "");
                        btn.innerHTML = `
                            <span class="option-ja">${escapeHtml(opt.ja)}</span>
                            <span class="option-tr">${escapeHtml(tr)}</span>
                        `;
                        btn.addEventListener("click", () => {
                            if (!card.multi) {
                                Array.from(selectedOptions).forEach(k => {
                                    if (k.startsWith(`${section.id}-${card.key}-`))
                                        selectedOptions.delete(k);
                                });
                                grid.querySelectorAll(".option-btn").forEach(el => el.classList
                                    .remove("selected"));
                            }
                            if (selectedOptions.has(key)) {
                                selectedOptions.delete(key);
                                btn.classList.remove("selected");
                            } else {
                                selectedOptions.add(key);
                                btn.classList.add("selected");
                            }
                            speakPair(opt.ja, tr);
                        });
                        grid.appendChild(btn);
                    });
                    panel.appendChild(grid);
                }

                details.appendChild(summary);
                details.appendChild(panel);
                list.appendChild(details);
            });
        }

        function getSelectedLanguageNameForNote() {
            const lang = getSelectedLang();
            const parts = String(lang.label || "").split("/");
            return (parts[0] || String(lang.label || "選択中の言語")).trim();
        }

        function speakPair(jaText, trText) {
            if (!("speechSynthesis" in window)) {
                alert("このブラウザは音声合成に対応していません。");
                return;
            }
            speechSynthesis.cancel();

            const ja = new SpeechSynthesisUtterance(String(jaText || ""));
            ja.lang = "ja-JP";
            speechSynthesis.speak(ja);

            if (trText) {
                const tr = new SpeechSynthesisUtterance(String(trText));
                tr.lang = getSelectedLang().speech;
                speechSynthesis.speak(tr);
            }
        }

        function setupFreeTranslatePanel() {
            const trigger = document.getElementById("freeTranslateBtn");
            const panel = document.getElementById("freeTranslatePanel");
            const closeBtn = document.getElementById("freeTranslateCloseBtn");
            const runBtn = document.getElementById("freeTranslateRunBtn");
            const input = document.getElementById("freeTranslateInput");
            const status = document.getElementById("freeTranslateStatus");
            const output = document.getElementById("freeTranslateOutput");
            if (!trigger || !panel || !closeBtn || !runBtn || !input || !status || !output) return;

            trigger.addEventListener("click", () => {
                panel.classList.toggle("open");
                if (panel.classList.contains("open")) input.focus();
            });
            closeBtn.addEventListener("click", () => {
                panel.classList.remove("open");
            });

            runBtn.addEventListener("click", async () => {
                const text = String(input.value || "").trim();
                if (!text) {
                    status.textContent = "日本語を入力してください。";
                    output.textContent = "";
                    return;
                }
                status.textContent = "翻訳中...";
                output.textContent = "";

                try {
                    const target = getSelectedLang().translateTarget || "en";
                    const translated = await translateFreeFromJapanese(text, target);
                    status.textContent = "";
                    output.textContent = translated || "(翻訳結果なし)";
                    if (translated) speakPair(text, translated);
                } catch (err) {
                    status.textContent = "翻訳に失敗しました。通信環境をご確認ください。";
                    output.textContent = "";
                    console.error(err);
                }
            });
        }

        async function translateFreeFromJapanese(text, targetCode) {
            const url =
                `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=${encodeURIComponent(targetCode)}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error("Translate API failed");
            const data = await response.json();
            if (!Array.isArray(data) || !Array.isArray(data[0])) return "";
            return data[0].map(part => Array.isArray(part) ? (part[0] || "") : "").join("");
        }

        function setupScrollTopButton() {
            const btn = document.getElementById("scrollTopBtn");
            if (!btn) return;
            btn.addEventListener("click", () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
            window.addEventListener("scroll", () => {
                if (window.scrollY > 200) btn.classList.add("visible");
                else btn.classList.remove("visible");
            }, {
                passive: true
            });
        }

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }
    </script>
</body>

</html>
