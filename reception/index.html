        const LANGUAGE_STORAGE_KEY = "receptionSelectedLanguage";
        let selectedLanguage = "en-US";
        let selectedSection = sections[0].id;
        const selectedOptions = new Set();

        window.addEventListener("load", init);

        async function init() {
            setupScrollTopButton();
            setupTranslationAppDialog();
            document.getElementById("languageSettingBtn").addEventListener("click", () => {
                document.getElementById("languageDialog").style.display = "block";
            });
            document.getElementById("closeLanguageBtn").addEventListener("click", () => {
                document.getElementById("languageDialog").style.display = "none";
            });
            selectedLanguage = loadInitialLanguage();
            await initI18n(selectedLanguage);
            applyStaticTranslations();
            renderLanguageButtons();
            renderSectionTabs();
            renderCards();
        }

        function loadInitialLanguage() {
            const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
            if (saved && languageOptions.some(item => item.code === saved)) return saved;
            const raw = String(navigator.language || "en-US").toLowerCase();
            if (raw.startsWith("ja")) return "ja";
            if (raw.startsWith("zh")) return "zh";
            if (raw.startsWith("fr")) return "fr";
            if (raw.startsWith("ko")) return "ko";
            if (raw.startsWith("pt")) return "pr";
            if (raw.startsWith("tl") || raw.startsWith("fil")) return "tl";
            if (raw.startsWith("vi")) return "ve";
            if (raw.startsWith("th")) return "th";
            if (raw.startsWith("de")) return "de";
            if (raw.startsWith("id")) return "id";
            if (raw.startsWith("ru")) return "ru";
            if (raw.startsWith("ne")) return "ne";
            if (raw.startsWith("lo")) return "lo";
            if (raw.startsWith("uk")) return "uk";
            if (raw.startsWith("fa")) return "fa-AF";
            if (raw.startsWith("si")) return "si";
            if (raw.startsWith("ms")) return "ms";
            if (raw.startsWith("my")) return "my";
            if (raw.startsWith("bn")) return "bn";
            if (raw.startsWith("ur")) return "ur";
            return "en-US";
        }

        function getI18nLanguage(langCode) {
            if (langCode === "zh") return "zh";
            if (langCode === "ja" || langCode === "ja-JP") return "ja";
            return "en-US";
        }

        async function initI18n(langCode) {
            if (!window.i18next) return;
            const target = getI18nLanguage(langCode);
            if (!i18next.isInitialized) {
                await i18next.use(i18nextHttpBackend).init({
                    lng: target,
                    fallbackLng: "en-US",
                    backend: {
                        loadPath: "./i18n/{{lng}}.json"
                    }
                });
                return;
            }
            await i18next.changeLanguage(target);
        }

        function tr(key, fallback, options) {
            if (!window.i18next || !i18next.isInitialized) return fallback || "";
            const value = i18next.t(key, options || {});
            return value === key ? (fallback || "") : value;
        }

        function applyStaticTranslations() {
            document.getElementById("pageTitle").textContent = buildBilingualLabel("受付コミュニケーションボード", "page_title");
            document.getElementById("pageLead").textContent = tr("page_lead", "受付〜会計までの説明を、言語切替と音声で案内します。");
            document.getElementById("switchExamLabel").textContent = buildBilingualLabel("診察ボードへ", "switch_exam");
            document.getElementById("switchReceptionLabel").textContent = buildBilingualLabel("受付ボード",
                "switch_reception");
            document.getElementById("categoryTabs").setAttribute("aria-label", tr("category_aria", "カテゴリ"));
            document.getElementById("freeTranslateBtn").textContent = tr("free_translate_btn", "自由入力/翻訳");
            document.getElementById("freeTranslateBtn").setAttribute("aria-label", tr("free_translate_btn", "自由入力/翻訳"));
            document.getElementById("freeTranslateBtn").textContent = tr("translation_app_btn", "翻訳アプリ");
            document.getElementById("freeTranslateBtn").setAttribute("aria-label", tr("translation_app_btn", "翻訳アプリ"));
            document.getElementById("translationAppDialog").setAttribute("aria-label", tr("translation_app_dialog_aria",
                "翻訳アプリ選択"));
            document.getElementById("translationAppTitle").textContent = tr("translation_app_title", "翻訳アプリ");
            document.getElementById("translationAppCloseBtn").textContent = tr("close", "閉じる");
            document.getElementById("translationAppCloseBtn").setAttribute("aria-label", tr("close", "閉じる"));
            document.getElementById("translationAppLead").textContent = tr("translation_app_lead", "使うアプリを選んでください。");
            document.getElementById("openGoogleTranslateBtn").textContent = tr("translation_app_google", "Google 翻訳");
            document.getElementById("openDeepLBtn").textContent = tr("translation_app_deepl", "DeepL");
            document.getElementById("scrollTopBtn").setAttribute("aria-label", tr("scroll_top_aria", "ページトップへ戻る"));
        }

        function buildBilingualLabel(jaText, key) {
            const translated = tr(key, jaText);
            if (getI18nLanguage(selectedLanguage) === "ja" || translated === jaText) return jaText;
            return `${jaText} / ${translated}`;
        }

        function t(key, fallback) {
            const dataKey = getDataLangKey(selectedLanguage);
            const data = window.languagedata && window.languagedata[dataKey];
            if (!data) return fallback || "";
            return data[key] || fallback || "";
        }

        function getDataLangKey(code) {
            const map = {
                "en-US": "english",
                "zh": "chinese",
                "fr": "french",
                "ko": "korean",
                "pr": "portuguese",
                "tl": "filipino",
                "ve": "vietnamese",
                "th": "thai",
                "de": "german",
                "id": "indonesian",
                "ru": "russian",
                "ne": "nepali",
                "lo": "laotian",
                "uk": "ukrainian",
                "fa-AF": "dari",
                "si": "sinhala",
                "ms": "malay",
                "my": "myanmar",
                "bn": "bengali",
                "ur": "urdu",
                "ja": "japanese"
            };
            return map[code] || "english";
        }

        function getSelectedLang() {
            return languageOptions.find(item => item.code === selectedLanguage) || languageOptions[0];
        }

        function renderLanguageButtons() {
            const picker = document.getElementById("languageOptionList");
            picker.innerHTML = "";
            languageOptions.forEach(lang => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "language-option-btn" + (selectedLanguage === lang.code ? " active" : "");
                btn.textContent = lang.label;
                btn.addEventListener("click", async () => {
                    selectedLanguage = lang.code;
                    localStorage.setItem(LANGUAGE_STORAGE_KEY, selectedLanguage);
                    document.getElementById("languageDialog").style.display = "none";
                    await initI18n(selectedLanguage);
                    applyStaticTranslations();
                    renderLanguageButtons();
                    renderSectionTabs();
                    renderCards();
                });
                picker.appendChild(btn);
            });
            renderLanguageDialogText();
        }

        function renderLanguageDialogText() {
            document.getElementById("languageSettingBtn").textContent = tr("settings", "設定");
            document.getElementById("languageDialogTitle").textContent = tr("settings", "設定");
            document.getElementById("languageSectionTitle").textContent = tr("language", "言語設定");
            document.getElementById("closeLanguageBtn").textContent = tr("close", "閉じる");
        }

        function renderSectionTabs() {
            const tabs = document.getElementById("categoryTabs");
            tabs.innerHTML = "";
            sections.forEach(section => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "tab-btn" + (selectedSection === section.id ? " active" : "");
                const translatedTitle = getTranslatedSectionLabel(section);
                btn.innerHTML = `
                    <span class="tab-ja">${escapeHtml(section.titleJa)}</span>
                    <span class="tab-tr">${escapeHtml(translatedTitle)}</span>
                `;
                btn.addEventListener("click", () => {
                    selectedSection = section.id;
                    renderSectionTabs();
                    renderCards();
                });
                tabs.appendChild(btn);
            });
        }

        function getTranslatedSectionLabel(section) {
            const keyMap = {
                reception: "tab_reception",
                waiting: "tab_waiting",
                medicine: "tab_medicine",
                system: "tab_system"
            };
            const key = keyMap[section.id];
            if (!key) return section.titleFallback || "";
            return tr(key, section.titleFallback || "");
        }

        function renderCards() {
            const list = document.getElementById("accordionList");
            list.innerHTML = "";
            const section = sections.find(s => s.id === selectedSection);
            if (!section) return;

            section.cards.forEach((card, index) => {
                const itemNumber = section.id === "system" ? index : index + 1;
                const details = document.createElement("details");
                details.className = "talk-card";
                const summary = document.createElement("summary");
                summary.className = "talk-summary";
                summary.innerHTML = `
                    <div class="summary-texts">
                        <p class="talk-title">項目 ${itemNumber}</p>
                        <p class="talk-ja">${escapeHtml(card.ja)}</p>
                        <p class="talk-tr">${escapeHtml(t(card.key, card.titleFallback || ""))}</p>
                    </div>
                    <button type="button" class="summary-play-btn" aria-label="項目を再生">▶</button>
                `;
                const summaryPlayBtn = summary.querySelector(".summary-play-btn");
                const handleSummaryPlay = (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                };
                summaryPlayBtn.addEventListener("pointerdown", handleSummaryPlay);
                summaryPlayBtn.addEventListener("mousedown", handleSummaryPlay);
                summaryPlayBtn.addEventListener("click", (event) => {
                    handleSummaryPlay(event);
                    speakPair(card.ja, t(card.key, ""));
                });

                const panel = document.createElement("div");
                panel.className = "talk-panel";

                if (card.externalLink) {
                    const wrap = document.createElement("div");
                    wrap.className = "questionnaire-wrap";
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "large-btn";
                    btn.innerHTML = `
                        <span class="option-ja">${escapeHtml(card.externalLinkLabelJa || card.ja)}</span>
                        <span class="option-tr">${escapeHtml(t(card.key + "_link", card.externalLinkLabelFallback || ""))}</span>
                    `;
                    btn.addEventListener("click", () => {
                        window.open(card.externalLink, "_blank", "noopener,noreferrer");
                    });
                    wrap.appendChild(btn);
                    panel.appendChild(wrap);
                }

                if (card.questionnaire) {
                    const wrap = document.createElement("div");
                    wrap.className = "questionnaire-wrap";
                    const note = document.createElement("p");
                    note.className = "questionnaire-note";
                    note.textContent = tr("questionnaire_pdf_open", "{{label}}の問診票PDFを開く", {
                        label: getSelectedLanguageNameForNote()
                    });
                    const qBtn = document.createElement("button");
                    qBtn.type = "button";
                    qBtn.className = "large-btn";
                    qBtn.textContent = t("question", "medical questionnaire");
                    qBtn.addEventListener("click", () => {
                        const lang = getSelectedLang();
                        if (!lang.questionnairePdf) {
                            alert(tr("questionnaire_not_ready", "この言語の問診票PDFは未設定です。"));
                            return;
                        }
                        window.open(lang.questionnairePdf, "_blank", "noopener,noreferrer");
                    });
                    wrap.appendChild(note);
                    wrap.appendChild(qBtn);
                    panel.appendChild(wrap);
                }

                if (Array.isArray(card.options) && card.options.length) {
                    const grid = document.createElement("div");
                    grid.className = "option-grid";
                    card.options.forEach(opt => {
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "large-btn option-btn";
                        const key = `${section.id}-${card.key}-${opt.key}`;
                        if (selectedOptions.has(key)) btn.classList.add("selected");

                        const tr = t(opt.key, "");
                        btn.innerHTML = `
                            <span class="option-ja">${escapeHtml(opt.ja)}</span>
                            <span class="option-tr">${escapeHtml(tr)}</span>
                        `;
                        btn.addEventListener("click", () => {
                            if (!card.multi) {
                                Array.from(selectedOptions).forEach(k => {
                                    if (k.startsWith(`${section.id}-${card.key}-`))
                                        selectedOptions.delete(k);
                                });
                                grid.querySelectorAll(".option-btn").forEach(el => el.classList
                                    .remove("selected"));
                            }
                            if (selectedOptions.has(key)) {
                                selectedOptions.delete(key);
                                btn.classList.remove("selected");
                            } else {
                                selectedOptions.add(key);
                                btn.classList.add("selected");
                            }
                            speakPair(opt.ja, tr);
                        });
                        grid.appendChild(btn);
                    });
                    panel.appendChild(grid);
                }

                details.appendChild(summary);
                details.appendChild(panel);
                list.appendChild(details);
            });
        }

        function getSelectedLanguageNameForNote() {
            const lang = getSelectedLang();
            const parts = String(lang.label || "").split("/");
            return (parts[0] || String(lang.label || "選択中の言語")).trim();
        }

        function speakPair(jaText, trText) {
            if (!("speechSynthesis" in window)) {
                alert("このブラウザは音声合成に対応していません。");
                return;
            }
            speechSynthesis.cancel();

            const ja = new SpeechSynthesisUtterance(String(jaText || ""));
            ja.lang = "ja-JP";
            speechSynthesis.speak(ja);

            if (trText) {
                const tr = new SpeechSynthesisUtterance(String(trText));
                tr.lang = getSelectedLang().speech;
                speechSynthesis.speak(tr);
            }
        }

        function setupTranslationAppDialog() {
            const trigger = document.getElementById("freeTranslateBtn");
            const dialog = document.getElementById("translationAppDialog");
            const panel = document.getElementById("translationAppPanel");
            const closeBtn = document.getElementById("translationAppCloseBtn");
            const googleBtn = document.getElementById("openGoogleTranslateBtn");
            const deeplBtn = document.getElementById("openDeepLBtn");
            if (!trigger || !dialog || !panel || !closeBtn || !googleBtn || !deeplBtn) return;

            trigger.addEventListener("click", () => {
                dialog.classList.add("open");
                dialog.setAttribute("aria-hidden", "false");
            });
            closeBtn.addEventListener("click", () => {
                dialog.classList.remove("open");
                dialog.setAttribute("aria-hidden", "true");
            });
            dialog.addEventListener("click", (event) => {
                if (event.target === dialog) {
                    dialog.classList.remove("open");
                    dialog.setAttribute("aria-hidden", "true");
                }
            });
            googleBtn.addEventListener("click", () => launchTranslationApp("google"));
            deeplBtn.addEventListener("click", () => launchTranslationApp("deepl"));
        }

        function getSelectedLanguageDisplayName() {
            const lang = getSelectedLang();
            const label = String((lang && lang.label) || "").trim();
            const match = label.match(/\(([^)]+)\)/);
            if (match && match[1]) return match[1].trim();
            return label || tr("selected_language", "選択言語");
        }

        function getDeepLTargetCode(langCode) {
            const map = {
                "ja": "en",
                "en-US": "en",
                "zh": "zh",
                "fr": "fr",
                "ko": "ko",
                "pr": "pt",
                "de": "de",
                "ru": "ru",
                "uk": "uk"
            };
            return map[langCode] || "en";
        }

        function launchTranslationApp(appName) {
            const dialog = document.getElementById("translationAppDialog");
            if (dialog) {
                dialog.classList.remove("open");
                dialog.setAttribute("aria-hidden", "true");
            }
            const googleTarget = getSelectedLang().translateTarget || "en";
            const deeplTarget = getDeepLTargetCode(selectedLanguage);
            const url = appName === "deepl" ?
                `https://www.deepl.com/translator#ja/${encodeURIComponent(deeplTarget)}/` :
                `https://translate.google.com/?sl=ja&tl=${encodeURIComponent(googleTarget)}&op=translate`;
            window.location.href = url;
        }

        function setupScrollTopButton() {
            const btn = document.getElementById("scrollTopBtn");
            if (!btn) return;
            btn.addEventListener("click", () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
            window.addEventListener("scroll", () => {
                if (window.scrollY > 200) btn.classList.add("visible");
                else btn.classList.remove("visible");
            }, {
                passive: true
            });
        }

        function escapeHtml(str) {
            return String(str || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }
    </script>
</body>
