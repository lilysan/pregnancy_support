<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Translate | Pregnancy Support</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/i18next@23/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://unpkg.com/jquery-i18next@1/jquery-i18next.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="../common/js/config.js"></script>
    <link rel="stylesheet" href="../style.css"/>
    <style>
        .translation-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .translation-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .translation-card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .translation-title {
            margin: 0;
            border-bottom: none;
            color: var(--text);
        }

        .translation-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .translation-badge {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: var(--primary-dark);
            color: var(--background);
        }

        .translation-badge.is-unavailable {
            background: var(--surface);
            color: var(--border);
            box-shadow: inset 0 0 0 1px var(--divider);
        }

        .translation-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .translation-actions .btn {
            text-decoration: none;
        }

        .translation-actions .btn.is-empty {
            visibility: hidden;
            pointer-events: none;
        }

        .translation-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .translation-legend .badge {
            background: var(--surface);
            color: var(--sub-text);
            box-shadow: inset 0 0 0 1px var(--divider);
        }

        @media (max-width: 480px) {
            .translation-card-head {
                display: block;
            }

            .translation-badges {
                justify-content: flex-end;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
<div id="header-container" class="header-wrapper"></div>

<main>
    <article class="main-container">
        <h1 data-i18n="[html]title.translation">Translation Apps</h1>
        <p class="desc" data-i18n="[html]translationApp.desc"></p>

        <div class="card card-info">
            <div class="state-card-inner">
                <iconify-icon icon="material-symbols:info-rounded" width="24" height="24" aria-hidden="true"></iconify-icon>
                <div>
                    <p class="small" data-i18n="[html]translationApp.info"></p>
                </div>
            </div>
            <div class="translation-legend" aria-label="機能アイコンの説明">
                <span class="badge"><iconify-icon icon="material-symbols:match-case-rounded" width="18" height="18" aria-hidden="true"></iconify-icon> <span data-i18n="[html]translationApp.feature.text"></span></span>
                <span class="badge"><iconify-icon icon="material-symbols:mic-rounded" width="18" height="18" aria-hidden="true"></iconify-icon> <span data-i18n="[html]translationApp.feature.voice"></span></span>
                <span class="badge"><iconify-icon icon="material-symbols:photo-camera-rounded" width="18" height="18" aria-hidden="true"></iconify-icon> <span data-i18n="[html]translationApp.feature.camera"></span></span>
                <span class="badge"><iconify-icon icon="material-symbols:forum-rounded" width="18" height="18" aria-hidden="true"></iconify-icon> <span data-i18n="[html]translationApp.feature.conversation"></span></span>
                <span class="badge"><iconify-icon icon="material-symbols:edit-note-rounded" width="18" height="18" aria-hidden="true"></iconify-icon> <span data-i18n="[html]translationApp.feature.handwriting"></span></span>
            </div>
        </div>

        <div class="translation-list">
            <section class="card translation-card" aria-labelledby="deeplTitle">
                <div class="translation-card-head">
                    <h2 id="deeplTitle" class="translation-title">DeepL</h2>
                    <div class="translation-badges" aria-label="DeepL supported features">
                        <span class="translation-badge"><iconify-icon icon="material-symbols:match-case-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:mic-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:photo-camera-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:forum-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:edit-note-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                    </div>
                </div>
                <div class="translation-actions">
                    <a href="https://deepl.com" class="btn primary app-deepl">App</a>
                    <a href="https://deepl.com" class="btn secondary web-deepl">Web</a>
                </div>
            </section>

            <section class="card translation-card" aria-labelledby="googleTitle">
                <div class="translation-card-head">
                    <h2 id="googleTitle" class="translation-title">Google Translate</h2>
                    <div class="translation-badges" aria-label="Google Translate supported features">
                        <span class="translation-badge"><iconify-icon icon="material-symbols:match-case-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:mic-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:photo-camera-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:forum-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:edit-note-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                    </div>
                </div>
                <div class="translation-actions">
                    <a href="https://translate.google.com" class="btn primary app-google">App</a>
                    <a href="https://translate.google.com" class="btn secondary web-google">Web</a>
                </div>
            </section>

            <section class="card translation-card" aria-labelledby="itranslateTitle">
                <div class="translation-card-head">
                    <h2 id="itranslateTitle" class="translation-title">iTranslate Translator</h2>
                    <div class="translation-badges" aria-label="iTranslate Translator supported features">
                        <span class="translation-badge"><iconify-icon icon="material-symbols:match-case-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:mic-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:photo-camera-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:forum-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:edit-note-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                    </div>
                </div>
                <div class="translation-actions">
                    <a href="https://whfs.app.link" class="btn primary app-iTranslate">App</a>
                    <span class="btn secondary is-empty" aria-hidden="true">Web</span>
                </div>
            </section>

            <section class="card translation-card" aria-labelledby="microsoftTitle">
                <div class="translation-card-head">
                    <h2 id="microsoftTitle" class="translation-title">Microsoft Translator</h2>
                    <div class="translation-badges" aria-label="Microsoft Translator supported features">
                        <span class="translation-badge"><iconify-icon icon="material-symbols:match-case-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:mic-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:photo-camera-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:forum-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:edit-note-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                    </div>
                </div>
                <div class="translation-actions">
                    <a href="https://translate.it" class="btn primary app-microsoft">App</a>
                    <a href="https://translate.it" class="btn secondary web-microsoft">Web</a>
                </div>
            </section>

            <section class="card translation-card" aria-labelledby="papagoTitle">
                <div class="translation-card-head">
                    <h2 id="papagoTitle" class="translation-title">Papago</h2>
                    <div class="translation-badges" aria-label="Papago supported features">
                        <span class="translation-badge"><iconify-icon icon="material-symbols:match-case-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:mic-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:photo-camera-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:forum-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:edit-note-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                    </div>
                </div>
                <div class="translation-actions">
                    <a href="https://papago.naver.com/" class="btn primary app-papago">App</a>
                    <a href="https://papago.naver.com/" class="btn secondary web-papago">Web</a>
                </div>
            </section>

            <section class="card translation-card" aria-labelledby="voicetraTitle">
                <div class="translation-card-head">
                    <h2 id="voicetraTitle" class="translation-title">VoiceTra</h2>
                    <div class="translation-badges" aria-label="VoiceTra supported features">
                        <span class="translation-badge"><iconify-icon icon="material-symbols:match-case-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge"><iconify-icon icon="material-symbols:mic-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:photo-camera-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:forum-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                        <span class="translation-badge is-unavailable"><iconify-icon icon="material-symbols:edit-note-rounded" width="20" height="20" aria-hidden="true"></iconify-icon></span>
                    </div>
                </div>
                <div class="translation-actions">
                    <a href="https://voicetra.nict.go.jp/" class="btn primary app-voicetra">App</a>
                    <span class="btn secondary is-empty" aria-hidden="true">Web</span>
                </div>
            </section>
        </div>
    </article>
</main>

<div class="overlay is-open" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script>
    const currentPage = "translation";
    /** @type {import('@line/liff').Liff} */
    const liff = window.liff;

    const APP_URL = {
        deepl: {
            IPHONE_STORE_URL: 'https://apps.apple.com/app/id1552407475',
            IPHONE_URL_SCHEME: 'deepl://',
            IPHONE_UNI_LINK: 'https://deepl.com',
            ANDROID_STORE_URL: 'https://play.google.com/store/apps/details?id=com.deepl.mobiletranslator',
            ANDROID_URL_SCHEME: '',
            CHROME_URL_SCHEME: '',
            ANDROID_STORE_SCHEME: 'market://details?id=com.deepl.mobiletranslator',
            ANDROID_APP_LINK: '',
            WEB_URL: 'https://deepl.com'
        },
        google: {
            IPHONE_STORE_URL: 'https://apps.apple.com/app/id414706506',
            IPHONE_URL_SCHEME: 'googletranslate://',
            IPHONE_UNI_LINK: 'https://translate.google.com/m/translate',
            ANDROID_STORE_URL: 'https://play.google.com/store/apps/details?id=com.google.android.apps.translate',
            ANDROID_URL_SCHEME: 'googletranslate://*/open',
            CHROME_URL_SCHEME: 'intent://*/open/#Intent;scheme=googletranslate;package=com.google.android.apps.translate;end',
            ANDROID_STORE_SCHEME: 'market://details?id=com.google.android.apps.translate',
            ANDROID_APP_LINK: 'https://translate.google.com/m/translate',
            WEB_URL: 'https://translate.google.com'
        },
        iTranslate: {
            IPHONE_STORE_URL: 'https://apps.apple.com/app/id288113403',
            IPHONE_URL_SCHEME: '',
            IPHONE_UNI_LINK: 'https://whfs.app.link',
            ANDROID_STORE_URL: 'https://play.google.com/store/apps/details?id=at.nk.tools.iTranslate',
            ANDROID_URL_SCHEME: '',
            CHROME_URL_SCHEME: '',
            ANDROID_STORE_SCHEME: 'market://details?id=at.nk.tools.iTranslate',
            ANDROID_APP_LINK: 'https://whfs.app.link',
            WEB_URL: ""
        },
        microsoft: {
            IPHONE_STORE_URL: 'https://apps.apple.com/app/id1018949559',
            IPHONE_URL_SCHEME: '',
            IPHONE_UNI_LINK: '',
            ANDROID_STORE_URL: 'https://play.google.com/store/apps/details?id=com.microsoft.translator',
            ANDROID_URL_SCHEME: '',
            CHROME_URL_SCHEME: '',
            ANDROID_STORE_SCHEME: 'market://details?id=com.microsoft.translator',
            ANDROID_APP_LINK: '',
            WEB_URL: 'https://translate.it'
        },
        papago: {
            IPHONE_STORE_URL: 'https://apps.apple.com/app/id1147874819',
            IPHONE_URL_SCHEME: '',
            IPHONE_UNI_LINK: '',
            ANDROID_STORE_URL: 'https://play.google.com/store/apps/details?id=com.naver.labs.translator',
            ANDROID_URL_SCHEME: '',
            CHROME_URL_SCHEME: '',
            ANDROID_STORE_SCHEME: 'market://details?id=com.naver.labs.translator',
            ANDROID_APP_LINK: '',
            WEB_URL: 'https://papago.naver.com/'
        },
        voicetra: {
            IPHONE_STORE_URL: 'https://apps.apple.com/app/id581137577',
            IPHONE_URL_SCHEME: '',
            IPHONE_UNI_LINK: '',
            ANDROID_STORE_URL: 'https://play.google.com/store/apps/details?id=jp.go.nict.voicetra',
            ANDROID_URL_SCHEME: '',
            CHROME_URL_SCHEME: '',
            ANDROID_STORE_SCHEME: 'market://details?id=jp.go.nict.voicetra',
            ANDROID_APP_LINK: '',
            WEB_URL: ''
        },
    };

    $(function () {
        const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        const appList = Object.keys(APP_URL);
        for (let i = 0; i < appList.length; i += 1) {
            $(`.app-${appList[i]}`).on("click", function (e) {
                const ret = lunchApp(appList[i]);
                if (!ret) {
                    e.preventDefault();
                }
            });
        }

        liff.init({
            liffId: LIFF_ID,
            withLoginOnExternalBrowser: !isDev,
        }).then(function () {
            return loadHeader();
        }).catch(function (error) {
            console.error("LIFF init failed:", error);
            return loadHeader();
        }).catch(function (error) {
            console.error(error);
        }).finally(function () {
            $("#loadingOverlay").removeClass("is-open");
        });
    });

    function loadHeader() {
        return new Promise((resolve, reject) => {
            $("#header-container").load("../common/header.html", function (responseText, status) {
                if (status === "error") {
                    reject(new Error("Failed to load header.html"));
                    return;
                }

                document.addEventListener("i18n-initialized", function () {
                    resolve();
                }, {once: true});

                $.getScript("../common/js/header.js")
                    .fail(function () {
                        reject(new Error("Failed to load header.js"));
                    });
            });
        });
    }

    function lunchApp(app) {
        function execute(appUrl, storeUrl, os) {
            const iframe = document.createElement('iframe');
            if (os === "ios") {
                document.location = appUrl;
            } else if (os === "android") {
                iframe.style.visibility = "hidden";
                iframe.src = appUrl;
                document.body.appendChild(iframe);
            }

            const time = (new Date()).getTime();
            const timer = setTimeout(function () {
                const now = (new Date()).getTime();
                if (iframe.parentNode) {
                    document.body.removeChild(iframe);
                }
                if ((now - time) > 400) {
                    return;
                }
                document.location = storeUrl;
            }, 300);

            window.onblur = function () {
                clearTimeout(timer);
            };
        }

        const agent = navigator.userAgent;

        if (agent.search(/iPhone|iPod|iPad/) !== -1 || (agent.search(/iPad|Macintosh/) !== -1 && "ontouchend" in document)) {
            if (APP_URL[app].IPHONE_URL_SCHEME !== "") {
                execute(APP_URL[app].IPHONE_URL_SCHEME, APP_URL[app].IPHONE_STORE_URL, "ios");
                return false;
            } else if (APP_URL[app].IPHONE_UNI_LINK !== "") {
                $(`.app-${app}`).attr('href', APP_URL[app].IPHONE_UNI_LINK);
                return true;
            } else {
                $(`.app-${app}`).attr('href', APP_URL[app].IPHONE_STORE_URL);
                return true;
            }
        } else if (agent.search(/Android/) !== -1 && agent.search(/Chrome/) !== -1) {
            if (APP_URL[app].CHROME_URL_SCHEME !== "") {
                $(`.app-${app}`).attr('href', APP_URL[app].CHROME_URL_SCHEME);
                return true;
            } else if (APP_URL[app].ANDROID_APP_LINK !== "") {
                $(`.app-${app}`).attr('href', APP_URL[app].ANDROID_APP_LINK);
                return true;
            } else {
                $(`.app-${app}`).attr('href', APP_URL[app].ANDROID_STORE_SCHEME);
                return true;
            }
        } else if (agent.search(/Android/) !== -1) {
            if (APP_URL[app].ANDROID_URL_SCHEME !== "") {
                execute(APP_URL[app].ANDROID_URL_SCHEME, APP_URL[app].ANDROID_STORE_SCHEME, "android");
                return false;
            } else if (APP_URL[app].ANDROID_APP_LINK !== "") {
                $(`.app-${app}`).attr('href', APP_URL[app].ANDROID_APP_LINK);
                return true;
            } else {
                $(`.app-${app}`).attr('href', APP_URL[app].ANDROID_STORE_SCHEME);
                return true;
            }
        }

        return true;
    }
</script>
</body>
</html>
