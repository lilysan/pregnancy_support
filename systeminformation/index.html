            });

            await initI18n(selectedLanguage);
            renderLanguageOptions();
            applyI18n();
            renderTagFilters();
            renderSystems();

                    return;
                }
                $.getScript('../common/js/header2.js').fail(function () {
                    console.error('Failed to load header2.js');
                });
            });
        }

        function loadInitialLanguage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved && languageOptions.some((lang) => lang.code === saved)) return saved;
            return detectInitialLanguage();
        }

        function detectInitialLanguage() {
            const raw = String(navigator.language || 'en-US').toLowerCase();
            if (raw.startsWith('ja')) return 'ja';
            if (raw.startsWith('zh')) return 'zh';
            if (raw.startsWith('fr')) return 'fr';
            if (raw.startsWith('ko')) return 'ko';
            if (raw.startsWith('pt')) return 'pr';
            if (raw.startsWith('tl') || raw.startsWith('fil')) return 'tl';
            if (raw.startsWith('vi')) return 've';
            if (raw.startsWith('th')) return 'th';
            if (raw.startsWith('de')) return 'de';
            if (raw.startsWith('id')) return 'id';
            if (raw.startsWith('ru')) return 'ru';
            if (raw.startsWith('ne')) return 'ne';
            if (raw.startsWith('lo')) return 'lo';
            if (raw.startsWith('uk')) return 'uk';
            if (raw.startsWith('fa')) return 'fa-AF';
            if (raw.startsWith('si')) return 'si';
            if (raw.startsWith('ms')) return 'ms';
            if (raw.startsWith('my')) return 'my';
            if (raw.startsWith('bn')) return 'bn';
            if (raw.startsWith('ur')) return 'ur';
            return 'en-US';
        }

        function getI18nLanguage(langCode) {
            const supported = new Set(languageOptions.map((lang) => lang.code));
            if (supported.has(langCode)) return langCode;
            return 'en-US';
        }

        async function initI18n(langCode) {
            if (!window.i18next) return;
            const target = getI18nLanguage(langCode);
            if (!i18next.isInitialized) {
                await i18next.use(i18nextHttpBackend).init({
                    lng: target,
                    fallbackLng: 'en-US',
                    backend: {
                        loadPath: './i18n/{{lng}}.json'
                    }
                });
                return;
            }
            await i18next.changeLanguage(target);
        }

        function tr(key, fallback, options) {
            if (!window.i18next || !i18next.isInitialized) return fallback || '';
            const value = i18next.t(key, options || {});
            return value === key ? (fallback || '') : value;
        }

        function renderLanguageOptions() {
            const list = document.getElementById('languageOptionList');
            list.innerHTML = '';
            languageOptions.forEach((lang) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'language-option-btn' + (selectedLanguage === lang.code ? ' active' : '');
                btn.textContent = lang.label;
                btn.addEventListener('click', async () => {
                    selectedLanguage = lang.code;
                    localStorage.setItem(STORAGE_KEY, selectedLanguage);
                    await initI18n(selectedLanguage);
                    renderLanguageOptions();
                    applyI18n();
                    renderTagFilters();
                    renderSystems();
                    document.getElementById('languageDialog').style.display = 'none';
                });
                list.appendChild(btn);
            });
        }

        function applyI18n() {
            document.getElementById('pageTitle').textContent = tr('page_title', '制度・システム');
            document.getElementById('pageLead').textContent = tr('page_lead', '妊娠期から育児期までに関わる制度を、時期ごとに確認できます。');
            document.getElementById('languageSettingBtn').textContent = tr('settings', '設定');
            document.getElementById('languageDialogTitle').textContent = tr('settings', '設定');
            document.getElementById('languageSectionTitle').textContent = tr('language', '言語設定');
            document.getElementById('closeLanguageBtn').textContent = tr('close', '閉じる');
            document.getElementById('introTitle').textContent = tr('intro_title', '妊娠期・分娩期・育児期の主要制度一覧');
            document.getElementById('introCopy').textContent = tr('intro_copy', '妊娠期から育児期までに利用しやすい主な制度を、期間と申請先で探せます。');
            document.getElementById('sourceNote').textContent = tr('source_note', '参考資料: 妊娠期・分娩期・育児期の主要制度一覧（2026年4月14日）');
            document.getElementById('periodFilterLabel').textContent = tr('period_filter', '期間');
            document.getElementById('officeFilterLabel').textContent = tr('office_filter', '届出・申請先');
        }

        function createInfoRow(labelKey, fallbackLabel, jaValue, translatedValue) {
            const primaryValue = selectedLanguage === 'ja' ? (translatedValue || jaValue) : jaValue;
            return `
                <div class="system-row">
                    <dt class="system-term">${tr(labelKey, fallbackLabel)}</dt>
                    <dd class="system-description">
                        <span class="system-description-ja">${escapeHtml(primaryValue)}</span>
                        ${renderTranslatedLine(translatedValue)}
                    </dd>
                </div>
            `;
        }

        function renderTranslatedLine(text) {
            if (selectedLanguage === 'ja' || !text) return '';
            return `<span class="system-description-tr">${escapeHtml(text)}</span>`;
        }

        function getTranslatedQuestion(item) {
            if (selectedLanguage === 'ja') return tr(`systems.${item.id}.title`, item.jaQ || '');
            const fallback = selectedLanguage === 'zh' ? (item.zhQ || item.enQ || '') : (item.enQ || '');
            return tr(`systems.${item.id}.title`, fallback);
        }

        function getTranslatedAnswer(item, field) {
            if (selectedLanguage === 'ja') {
                return tr(`systems.${item.id}.${field}`, (item.jaA && item.jaA[field]) || '');
            }
            const fallback = selectedLanguage === 'zh'
                ? ((item.zhA && item.zhA[field]) || (item.enA && item.enA[field]) || '')
                : ((item.enA && item.enA[field]) || '');
            return tr(`systems.${item.id}.${field}`, fallback);
        }

        function translateTag(tag) {
            const key = periodTranslationKeys[tag] || officeTranslationKeys[tag];
            return key ? tr(key, tag) : tag;
        }

        function renderBilingualChip(jaText, trText) {
            if (selectedLanguage === 'ja') return escapeHtml(trText || jaText);
            if (!trText || trText === jaText) return escapeHtml(jaText);
            return `<span class="chip-ja">${escapeHtml(jaText)}</span><span class="chip-tr">${escapeHtml(trText)}</span>`;
        }

        function renderFilterButtons(containerId, options, selectedValue, onSelect) {
            const container = document.getElementById(containerId);
            const filters = [{
                id: 'all',
                label: tr('all_tags', 'すべて')
            }, ...options.map((tag) => ({
                id: tag,
                label: tag
            }))];

            container.innerHTML = '';
            filters.forEach((tag) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tag-filter-btn' + (selectedValue === tag.id ? ' active' : '');
                btn.innerHTML = tag.id === 'all' ? escapeHtml(tag.label) : renderBilingualChip(tag.label,
                    translateTag(tag.label));
                btn.addEventListener('click', () => {
                    onSelect(tag.id);
                });
                container.appendChild(btn);
            });
        }

        function renderTagFilters() {
            const periods = periodOrder.filter((period) => qaItems.some((item) => item.period === period));
            const offices = Array.from(new Set(qaItems.map((item) => item.office).filter(Boolean)));

            renderFilterButtons('periodFilterList', periods, selectedPeriodTag, (value) => {
                selectedPeriodTag = value;
                renderTagFilters();
                renderSystems();
            });

            renderFilterButtons('officeFilterList', offices, selectedOfficeTag, (value) => {
                selectedOfficeTag = value;
                renderTagFilters();
                renderSystems();
            });
        }

        function matchesFilter(item) {
            const periodMatch = selectedPeriodTag === 'all' || item.period === selectedPeriodTag;
            const officeMatch = selectedOfficeTag === 'all' || item.office === selectedOfficeTag;
            return periodMatch && officeMatch;
        }

        function renderSystems() {
            const container = document.getElementById('systemList');
            container.innerHTML = '';
            const filteredItems = qaItems.filter(matchesFilter);

            document.getElementById('searchResultMeta').textContent = filteredItems.length ?
                tr('result_count', '{{count}} items', {
                    count: filteredItems.length
                }) :
                tr('no_result', '該当する制度はありません。');

            periodOrder.forEach((period) => {
                const items = filteredItems.filter((item) => item.period === period);
                if (!items.length) return;

                const section = document.createElement('section');
                section.className = 'period-section';
                const periodTitle = selectedLanguage === 'ja' ? translateTag(period) : period;
                section.innerHTML = `
                    <div class="period-header">
                        <p class="period-kicker">${tr('period_kicker', 'Period')}</p>
                        <h2 class="period-title">${escapeHtml(periodTitle)}${selectedLanguage === 'ja' ? '' : `<span class="period-title-sub">${escapeHtml(translateTag(period))}</span>`}</h2>
                    </div>
                    <div class="period-cards"></div>
                `;

                const cards = section.querySelector('.period-cards');
                items.forEach((item) => {
                    const details = document.createElement('details');
                    details.className = 'system-card';
                    details.open = false;
                    const primaryTitle = selectedLanguage === 'ja' ? getTranslatedQuestion(item) : item.jaQ;
                    details.innerHTML = `
                        <summary class="system-summary">
                            <div class="system-head">
                                <p class="system-name">${escapeHtml(primaryTitle)}</p>
                                ${selectedLanguage === 'ja' ? '' : `<p class="system-name-tr">${escapeHtml(getTranslatedQuestion(item))}</p>`}
                                <div class="system-tags">
                                    ${(item.tags || []).map((tag) => `<span class="system-tag">${renderBilingualChip(tag, translateTag(tag))}</span>`).join('')}
                                </div>
                            </div>
                        </summary>
                        <div class="system-panel">
                            <dl class="system-meta">
                                ${createInfoRow('apply_to', '届出・申請先', item.office, translateTag(item.office))}
                                ${createInfoRow('target', '対象者', item.jaA.target, getTranslatedAnswer(item, 'target'))}
                                ${createInfoRow('overview', '概要', item.jaA.overview, getTranslatedAnswer(item, 'overview'))}
                                ${createInfoRow('basis', '根拠・引用', item.jaA.basis, getTranslatedAnswer(item, 'basis'))}
                            </dl>
                        </div>
                    `;
                    cards.appendChild(details);
                });

                container.appendChild(section);
            });
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>

</html>
