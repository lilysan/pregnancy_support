  <body>
    <div id="header-container" class="header-wrapper"></div>
    <div class="loader is-hidden" id="loadingOverlay" aria-hidden="true">
      <div class="spinner"></div>
    </div>

    <main>
      <article class="main-container movement-counter-app">
        <h1 class="page-title" id="pageTitle">胎動カウンター</h1>
        <p class="page-lead" id="pageLead">
          「開始」を押して、赤ちゃんが動いたら「ポコッ」を押してください。10回動くまでの時間を記録します。
        </p>

        <section class="timer-panel" aria-live="polite">
          <div class="timer-label" id="timerStateLabel">待機中</div>
          <div class="timer-value" id="activeTimer">00:00</div>
          <div class="movement-count" id="movementCountText">0 / 10</div>
          <div class="timer-sub" id="timerSubText">10回動くまで測ります</div>
          <div class="movement-dots" id="movementDots" aria-hidden="true"></div>
          <div class="counter-actions">
            <button
              type="button"
              id="startMeasurementBtn"
              class="main-action start"
            >
              開始
            </button>
            <button
              type="button"
              id="movementBtn"
              class="main-action movement"
              disabled
            >
              ポコッ
            </button>
            <button
              type="button"
              id="endMeasurementBtn"
              class="main-action stop"
              disabled
            >
              終了
            </button>
          </div>
        </section>

        <section class="records-section">
          <div class="records-header">
            <h2 id="recordsTitle">記録</h2>
            <div class="record-actions">
              <button
                type="button"
                id="deleteSelectedBtn"
                class="icon-action-btn"
                aria-label="選択した記録を削除"
              >
                <iconify-icon
                  icon="material-symbols:delete-outline-rounded"
                  width="20"
                  height="20"
                ></iconify-icon>
              </button>
            </div>
          </div>
          <p id="emptyText" class="empty-text">まだ記録はありません。</p>
          <div id="timelineList" class="timeline-list"></div>
        </section>
      </article>
    </main>

          "“စတင်” ကိုနှိပ်ပြီး ကလေးလှုပ်တိုင်း “လှုပ်သည်” ကိုနှိပ်ပါ။ 10 ကြိမ်ပြည့်ရန် ကြာချိန်ကို မှတ်တမ်းတင်သည်။",
          "စောင့်နေသည်",
          "ရေတွက်နေသည်",
          "10 ကြိမ်ပြည့်ပြီ",
          "စတင်",
          "လှုပ်သည်",
          "ပြီးဆုံး",
          "{remaining} ကြိမ် ကျန်",
          "10 ကြိမ်အတွက် {duration}",
          "မှတ်တမ်း",
          "မှတ်တမ်းမရှိသေးပါ။",
          "လှုပ်ရှားမှု",
          "10 ကြိမ်အထိ ကြာချိန်",
          "{year}/{month}/{day}",
        ],
        bn: [
          "শিশুর নড়াচড়া কাউন্টার",
          "“শুরু” চাপুন, শিশুটি নড়লে প্রতিবার “নড়েছে” চাপুন। 10 বার নড়তে কত সময় লাগে তা রেকর্ড হবে।",
          "অপেক্ষা",
          "গোনা হচ্ছে",
          "10 বার হয়েছে",
          "শুরু",
          "নড়েছে",
          "শেষ",
          "আর {remaining} বার",
          "10 বার পর্যন্ত {duration}",
          "রেকর্ড",
          "এখনও রেকর্ড নেই।",
          "নড়াচড়ার সংখ্যা",
          "10 বার পর্যন্ত সময়",
          "{day}/{month}/{year}",
        ],
        ur: [
          "بچے کی حرکت کاؤنٹر",
          "“شروع” دبائیں، پھر بچہ جب بھی حرکت کرے “حرکت” دبائیں۔ 10 حرکتوں تک کا وقت ریکارڈ ہوگا۔",
          "انتظار",
          "گنتی جاری",
          "10 حرکتیں مکمل",
          "شروع",
          "حرکت",
          "ختم",
          "{remaining} باقی",
          "10 حرکتیں {duration} میں",
          "ریکارڈ",
          "ابھی کوئی ریکارڈ نہیں۔",
          "حرکتوں کی تعداد",
          "10 تک وقت",
          "{day}/{month}/{year}",
        ],
      };

      Object.entries(sharedMovementNames).forEach(([code, values]) => {
        MOVEMENT_TEXT[code] = {
          ...MOVEMENT_TEXT["en-US"],
          pageTitle: values[0],
          pageLead: values[1],
          waiting: values[2],
          measuring: values[3],
          complete: values[4],
          start: values[5],
          movement: values[6],
          end: values[7],
          goalText:
            values[3] === "Counting"
              ? MOVEMENT_TEXT["en-US"].goalText
              : values[1].split("。")[0],
          activeText: values[8],
          completedText: values[9],
          records: values[10],
          empty: values[11],
          activeBadge: values[3],
          activeEnd: values[3],
          sessionLine: `${values[12]} {count} / {duration}`,
          movementCount: values[12],
          timeToTen: values[13],
          startedAt: values[5],
          endedAt: values[7],
          movementTime: "{index}",
          dateLabel: values[14],
        };
      });

      function templateText(text, vars) {
        return String(text || "").replace(/\{(\w+)\}/g, function (_, key) {
          return vars && vars[key] != null ? String(vars[key]) : "";
        });
      }

      function t(key, vars) {
        const table = MOVEMENT_TEXT[state.lang] || MOVEMENT_TEXT["en-US"];
        return templateText(
          table[key] ||
            MOVEMENT_TEXT["en-US"][key] ||
            MOVEMENT_TEXT.ja[key] ||
            key,
          vars,
        );
      }

      function normalizeMovementLang(lang) {
        const raw = String(lang || "ja").toLowerCase();
        if (
          raw === "soft" ||
          raw.startsWith("easy") ||
          raw.startsWith("simple")
        )
          return "soft";
        if (raw.startsWith("en")) return "en-US";
        if (raw.startsWith("pt")) return "pr";
        if (raw.startsWith("vi")) return "ve";
        if (raw.startsWith("fa") || raw.startsWith("prs")) return "fa-AF";
        if (raw.startsWith("zh")) return "zh";
        if (raw.startsWith("fr")) return "fr";
        if (raw.startsWith("ko")) return "ko";
        if (raw.startsWith("tl")) return "tl";
        if (raw.startsWith("th")) return "th";
        if (raw.startsWith("de")) return "de";
        if (raw.startsWith("id")) return "id";
        if (raw.startsWith("ru")) return "ru";
        if (raw.startsWith("ne")) return "ne";
        if (raw.startsWith("lo")) return "lo";
        if (raw.startsWith("uk")) return "uk";
        if (raw.startsWith("si")) return "si";
        if (raw.startsWith("ms")) return "ms";
        if (raw.startsWith("my")) return "my";
        if (raw.startsWith("bn")) return "bn";
        if (raw.startsWith("ur")) return "ur";
        return "ja";
      }

      function applyMovementLanguage(lang) {
        state.lang = normalizeMovementLang(lang);
        document.documentElement.lang =
          state.lang === "en-US" ? "en" : state.lang;
        document.title = t("pageTitle");
        document.getElementById("pageTitle").textContent = t("pageTitle");
        document.getElementById("pageLead").textContent = t("pageLead");
        document.getElementById("startMeasurementBtn").textContent = t("start");
        document.getElementById("movementBtn").textContent = t("movement");
        document.getElementById("endMeasurementBtn").textContent = t("end");
        document.getElementById("recordsTitle").textContent = t("records");
        document.getElementById("emptyText").textContent = t("empty");
        document
          .getElementById("deleteSelectedBtn")
          .setAttribute("aria-label", t("deleteSelected"));
        setActiveUi();
        render();
      }

      function showAppBusy() {
        const loader = document.getElementById("loadingOverlay");
        loader.classList.remove("is-hidden");
        loader.style.display = "grid";
        loader.setAttribute("aria-hidden", "false");
      }

      function hideAppBusy() {
        const loader = document.getElementById("loadingOverlay");
        loader.classList.add("is-hidden");
        loader.style.display = "none";
        loader.setAttribute("aria-hidden", "true");
      }

      function loadHeader() {
        return new Promise((resolve, reject) => {
          let finished = false;
          const finish = () => {
            if (finished) return;
            finished = true;
            resolve();
          };
          const fail = (error) => {
            if (finished) return;
            finished = true;
            reject(error);
          };
          const timer = setTimeout(finish, 3000);
          $("#header-container").load(
            "../common/header.html",
            function (_responseText, status) {
              if (status === "error") {
                clearTimeout(timer);
                fail(new Error("Failed to load header.html"));
                return;
              }
              document.addEventListener(
                "i18n-initialized",
                function () {
                  clearTimeout(timer);
                  finish();
                },
                { once: true },
              );
              $.getScript("../common/js/header.js").fail(function () {
                clearTimeout(timer);
                fail(new Error("Failed to load header.js"));
              });
            },
          );
        });
      }

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function formatClock(dateString) {
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return "-";
        return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function formatSeconds(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "-";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${pad(min)}:${pad(sec)}`;
      }

      function formatDuration(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "-";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        if (min <= 0) return t("sec", { value: sec });
        return t("minSec", { min: min, sec: pad(sec) });
      }

      function formatRecordDate(dateString) {
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return "";
        return t("dateLabel", {
          year: date.getFullYear(),
          month: date.getMonth() + 1,
          day: date.getDate(),
        });
      }

      function createLocalId(prefix) {
        return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function normalizeRecord(item) {
        const startedAt = item && item.startedAt ? item.startedAt : "";
        const sourceMovements = item && (item.movements || item.movementsJson);
        const movements = Array.isArray(sourceMovements) ? sourceMovements : [];
        const endedAt =
          item && item.endedAt
            ? item.endedAt
            : movements[movements.length - 1] || startedAt;
        return {
          localId: (item && item.localId) || createLocalId("movement"),
          itemId: (item && (item.itemId || item.LitemId || item.id)) || "",
          startedAt: startedAt,
          endedAt: endedAt,
          durationSeconds: Number.isFinite(Number(item && item.durationSeconds))
            ? Math.max(0, Number(item.durationSeconds))
            : Math.max(
                0,
                Math.round(
                  (new Date(endedAt).getTime() -
                    new Date(startedAt).getTime()) /
                    1000,
                ),
              ),
          movements: movements.slice(0, TARGET_MOVEMENTS),
          saved: Boolean((item && item.saved) || (item && (item.itemId || item.LitemId || item.id))),
        };
      }

      function loadLocalRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          state.records = (Array.isArray(parsed) ? parsed : []).map(
            normalizeRecord,
          );
        } catch (error) {
          state.records = [];
        }
      }

      function saveLocalRecords() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
      }

      function requestMovementApi(method, postData, options) {
        const silent = options && options.silent;
        if (!silent) showAppBusy();
        return $.ajax({
          url: API_URL,
          type: "POST",
          dataType: "json",
          timeout: silent ? 5000 : 12000,
          data: JSON.stringify({
            path: "movement",
            method: method,
            idToken: state.idToken,
            postData: postData || {},
          }),
        }).then(
          function (response) {
            if (response.statusCode === 401) {
              liff.logout();
              window.location.reload();
              return null;
            }
            if (response.statusCode !== 200) {
              console.warn("movement API rejected the request:", response.message || response);
              return null;
            }
            return response.data || {};
          },
          function () {
            console.warn("movement API is not ready or network failed.");
            return null;
          },
        ).always(function () {
          if (!silent) hideAppBusy();
        });
      }

      function buildMovementPayload(record) {
        const movements = Array.isArray(record.movements) ? record.movements : [];
        return {
          itemId: record.itemId || "",
          startedAt: record.startedAt,
          endedAt: record.endedAt,
          durationSeconds: record.durationSeconds,
          movementCount: movements.length,
          isCompleted10: movements.length >= TARGET_MOVEMENTS,
          movementsJson: movements,
        };
      }

      function saveMovementRecordToApi(record) {
        return requestMovementApi("post", buildMovementPayload(record), { silent: true }).then(function (data) {
          if (!data || !data.itemId) return null;
          record.itemId = data.itemId;
          record.saved = true;
          saveLocalRecords();
          render();
          return data;
        });
      }

      function loadMovementRecordsFromApi() {
        return requestMovementApi("get", { unit: "month", limit: 1, page: 1 }, { silent: true }).then(function (data) {
          const apiItems = data && Array.isArray(data.items) ? data.items.map(normalizeRecord) : null;
          if (!apiItems) return;
          const unsavedLocal = state.records.filter((record) => !record.saved && !record.itemId);
          state.records = apiItems.concat(unsavedLocal);
          saveLocalRecords();
          render();
        });
      }

      function getActiveElapsedSeconds() {
        if (!state.activeRecord) return 0;
        return Math.max(
          0,
          Math.round(
            (Date.now() - new Date(state.activeRecord.startedAt).getTime()) /
              1000,
          ),
        );
      }

      function updateDots(count) {
        const dots = document.getElementById("movementDots");
        dots.innerHTML = "";
        for (let index = 1; index <= TARGET_MOVEMENTS; index += 1) {
          const dot = document.createElement("span");
          dot.className = "movement-dot" + (index <= count ? " is-filled" : "");
          dot.textContent = index;
          dots.appendChild(dot);
        }
      }

      function setActiveUi() {
        const isActive = Boolean(state.activeRecord);
        const count = isActive ? state.activeRecord.movements.length : 0;
        const remaining = Math.max(0, TARGET_MOVEMENTS - count);
        document
          .querySelector(".counter-actions")
          .classList.toggle("is-measuring", isActive);
        document.getElementById("timerStateLabel").textContent = isActive
          ? t("measuring")
          : t("waiting");
        document.getElementById("movementCountText").textContent = t(
          "countText",
          { count: count },
        );
        document.getElementById("timerSubText").textContent = isActive
          ? t("activeText", { remaining: remaining })
          : t("goalText");
        document.getElementById("startMeasurementBtn").disabled = isActive;
        document.getElementById("movementBtn").disabled =
          !isActive || count >= TARGET_MOVEMENTS;
        document.getElementById("endMeasurementBtn").disabled = !isActive;
        updateDots(count);
      }

      function render() {
        const list = document.getElementById("timelineList");
        const empty = document.getElementById("emptyText");
        list.innerHTML = "";

        const visibleRecords = state.activeRecord
          ? state.records.concat([
              Object.assign({}, state.activeRecord, {
                endedAt: "",
                durationSeconds: getActiveElapsedSeconds(),
                isActive: true,
              }),
            ])
          : state.records;

        let currentDateLabel = "";
        visibleRecords
          .slice()
          .reverse()
          .forEach((record) => {
            const dateLabel = formatRecordDate(record.startedAt);
            if (dateLabel && dateLabel !== currentDateLabel) {
              currentDateLabel = dateLabel;
              const heading = document.createElement("h3");
              heading.className = "timeline-date";
              heading.textContent = dateLabel;
              list.appendChild(heading);
            }

            const count = Array.isArray(record.movements)
              ? record.movements.length
              : 0;
            const item = document.createElement("div");
            item.className =
              "session-item" + (record.isActive ? " is-active" : "");
            item.innerHTML = `
            <div class="session-header">
              <label class="timeline-check">
                ${record.isActive ? `<span class="active-session-mark">${t("activeBadge")}</span>` : `<input type="checkbox" class="record-check" value="${record.localId}" aria-label="${t("selectRecord", { time: formatClock(record.startedAt) })}">`}
              </label>
              <div class="session-main">
                <div class="timeline-time">${formatClock(record.startedAt)} - ${record.isActive ? t("activeEnd") : formatClock(record.endedAt)}</div>
                <div class="timeline-duration">${t("sessionLine", { count: count, duration: formatDuration(record.durationSeconds) })}</div>
              </div>
            </div>
            <dl class="session-summary">
              <div>
                <dt>${t("movementCount")}</dt>
                <dd>${t("countText", { count: count })}</dd>
              </div>
              <div>
                <dt>${t("timeToTen")}</dt>
                <dd>${count >= TARGET_MOVEMENTS ? formatDuration(record.durationSeconds) : "-"}</dd>
              </div>
              <div>
                <dt>${t("startedAt")}</dt>
                <dd>${formatClock(record.startedAt)}</dd>
              </div>
              <div>
                <dt>${t("endedAt")}</dt>
                <dd>${record.isActive ? "-" : formatClock(record.endedAt)}</dd>
              </div>
            </dl>
            <div class="movement-list">
              ${(record.movements || [])
                .map(
                  (movementAt, index) => `
                <div class="movement-row">
                  <span class="movement-index">${index + 1}</span>
                  <span class="movement-time">${formatClock(movementAt)}</span>
                  <span class="movement-label">${t("movementTime", { index: index + 1 })}</span>
                </div>
              `,
                )
                .join("")}
            </div>
          `;
            list.appendChild(item);
          });

        empty.style.display = visibleRecords.length ? "none" : "block";
        list.style.display = visibleRecords.length ? "block" : "none";
      }

      function updateActiveTimer() {
        document.getElementById("activeTimer").textContent = state.activeRecord
          ? formatSeconds(getActiveElapsedSeconds())
          : "00:00";
        if (state.activeRecord) render();
      }

      function startMeasurement() {
        const now = new Date();
        state.activeRecord = {
          localId: createLocalId("movement"),
          startedAt: now.toISOString(),
          endedAt: "",
          durationSeconds: 0,
          movements: [],
          saved: false,
        };
        clearInterval(state.timerId);
        state.timerId = setInterval(updateActiveTimer, 1000);
        setActiveUi();
        updateActiveTimer();
        render();
      }

      function finishMeasurement() {
        if (!state.activeRecord) return;
        const endedAt = new Date();
        state.activeRecord.endedAt = endedAt.toISOString();
        state.activeRecord.durationSeconds = Math.max(
          0,
          Math.round(
            (endedAt.getTime() -
              new Date(state.activeRecord.startedAt).getTime()) /
              1000,
            ),
        );
        const completedRecord = state.activeRecord;
        state.records.push(completedRecord);
        state.activeRecord = null;
        clearInterval(state.timerId);
        state.timerId = null;
        saveLocalRecords();
        setActiveUi();
        updateActiveTimer();
        render();
        saveMovementRecordToApi(completedRecord);
      }

      function addMovement() {
        if (
          !state.activeRecord ||
          state.activeRecord.movements.length >= TARGET_MOVEMENTS
        )
          return;
        state.activeRecord.movements.push(new Date().toISOString());
        if (state.activeRecord.movements.length >= TARGET_MOVEMENTS) {
          document.getElementById("timerStateLabel").textContent =
            t("complete");
          finishMeasurement();
          return;
        }
        setActiveUi();
        render();
      }

      function endMeasurement() {
        if (!state.activeRecord) return;
        if (
          state.activeRecord.movements.length < TARGET_MOVEMENTS &&
          !confirm(t("endEarlyConfirm"))
        )
          return;
        finishMeasurement();
      }

      async function deleteSelectedRecords() {
        const ids = Array.from(
          document.querySelectorAll(".record-check:checked"),
        ).map((checkbox) => checkbox.value);
        if (!ids.length) {
          alert(t("selectDelete"));
          return;
        }
        const selected = state.records.filter((record) => ids.includes(record.localId));
        const deleteResults = await Promise.all(selected.map((record) => {
          if (!record.itemId) return Promise.resolve({ record, ok: true });
          return requestMovementApi("delete", { itemId: record.itemId }, { silent: true }).then((data) => ({
            record,
            ok: Boolean(data),
          }));
        }));
        const deletableIds = deleteResults.filter((result) => result.ok).map((result) => result.record.localId);
        state.records = state.records.filter(
          (record) => !deletableIds.includes(record.localId),
        );
        saveLocalRecords();
        render();
      }

      function bindEvents() {
        document
          .getElementById("startMeasurementBtn")
          .addEventListener("click", startMeasurement);
        document
          .getElementById("movementBtn")
          .addEventListener("click", addMovement);
        document
          .getElementById("endMeasurementBtn")
          .addEventListener("click", endMeasurement);
        document
          .getElementById("deleteSelectedBtn")
          .addEventListener("click", deleteSelectedRecords);
        document.addEventListener("language-changed", function (event) {
          applyMovementLanguage(
            event && event.detail ? event.detail.langId : "ja",
          );
        });
      }

      function bootMovementCounter() {
        showAppBusy();
        const isDev =
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1";
        liff
          .init({
            liffId: LIFF_ID,
            withLoginOnExternalBrowser: !isDev,
          })
          .then(() => {
            state.idToken = liff.getIDToken();
            loadLocalRecords();
            bindEvents();
            applyMovementLanguage(
              window.normalizedLanguageCode ||
                (typeof liff.getAppLanguage === "function"
                  ? liff.getAppLanguage()
                  : navigator.language),
            );
            loadMovementRecordsFromApi();
            return loadHeader();
          })
          .then(() => {
            applyMovementLanguage(window.normalizedLanguageCode || state.lang);
          })
          .then(hideAppBusy)
          .catch((error) => {
            console.error("LIFF init failed:", error);
            hideAppBusy();
            alert(t("liffInitFailed"));
          });
      }

      window.addEventListener("load", bootMovementCounter);
    </script>
  </body>
</html>
