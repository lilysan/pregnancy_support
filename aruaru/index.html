          jaQ: "1歳の赤ちゃんのお祝い事",
          enQ: "",
          jaA: "日本では、赤ちゃんが1歳になると「1歳のお祝い」をすることがあります。\n一升餅（いっしょうもち）という、約2kgのおもちを背負います。\n「一生（いっしょう）食べ物に困らないように」という願いが込められています。日本の伝統的な習慣ですが、必ず行うものではありません。家庭によって方法は異なります。",
          enA: "",
          image: {
            src: "./images/illustration-04.jpg",
            alt: "1歳の赤ちゃんのお祝い事のイラスト",
            credit: "Created by AI",
          },
        },
      ];

      qaItems.forEach((item, index) => {
        item.translationIndex = index + 1;
      });

      const periodOrder = [
        "妊娠期",
        "分娩期",
        "産後（入院中）",
        "産後（退院後）",
      ];
      const tagTranslationKeys = {
        妊娠期: "period_pregnancy",
        分娩期: "period_childbirth",
        "産後（入院中）": "period_postpartum_hospital",
        "産後（退院後）": "period_postpartum_home",
      };

      let selectedLanguage = "en-US";
      let selectedTag = "all";
      let keyword = "";
      let languageChangeToken = 0;
      let i18nWarmStarted = false;

      window.addEventListener("DOMContentLoaded", init);

      async function init() {
        loadCommonHeader();
        document
          .getElementById("languageSettingBtn")
          .addEventListener("click", openLanguageDialog);
        document
          .getElementById("closeLanguageBtn")
          .addEventListener("click", closeLanguageDialog);
        document
          .getElementById("languageDialog")
          .addEventListener("click", (event) => {
            if (event.target.id === "languageDialog") closeLanguageDialog();
          });
        document
          .getElementById("keywordSearch")
          .addEventListener("input", (event) => {
            keyword = String(event.target.value || "")
              .trim()
              .toLowerCase();
            renderQaList();
          });
        selectedLanguage = loadInitialLanguage();
        renderLanguageButtons();
        applyI18n();
        renderTagFilters();
        renderQaList();
        window.requestAnimationFrame(async () => {
          try {
            await initI18n(selectedLanguage);
            renderLanguageButtons();
            applyI18n();
            renderTagFilters();
            renderQaList();
            warmI18nLanguages();
          } catch (error) {
            console.error("Failed to initialize aruaru i18n", error);
          }
        });
      }

      function loadCommonHeader() {
        if (!window.jQuery) return;
        $("#header-container").load(
          "../common/header.html",
          function (_responseText, status) {
            if (status === "error") {
              console.error("Failed to load header.html");
              return;
            }
            $.getScript("../common/js/header2.js").fail(function () {
              console.error("Failed to load header2.js");
            });
          },
        );
      }

      function openLanguageDialog() {
        const dialog = document.getElementById("languageDialog");
        dialog.classList.remove("is-hidden");
        dialog.style.display = "block";
      }

      function closeLanguageDialog() {
        const dialog = document.getElementById("languageDialog");
        dialog.classList.add("is-hidden");
        dialog.style.display = "none";
      }

      function loadInitialLanguage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && languageOptions.some((lang) => lang.code === saved))
          return saved;
        return detectInitialLanguage();
      }

      function detectInitialLanguage() {
        const raw = String(navigator.language || "en-US").toLowerCase();
        if (raw.startsWith("ja")) return "ja";
        if (raw.startsWith("zh")) return "zh";
        if (raw.startsWith("fr")) return "fr";
        if (raw.startsWith("ko")) return "ko";
        if (raw.startsWith("pt")) return "pr";
        if (raw.startsWith("tl") || raw.startsWith("fil")) return "tl";
        if (raw.startsWith("vi")) return "ve";
        if (raw.startsWith("th")) return "th";
        if (raw.startsWith("de")) return "de";
        if (raw.startsWith("id")) return "id";
        if (raw.startsWith("ru")) return "ru";
        if (raw.startsWith("ne")) return "ne";
        if (raw.startsWith("lo")) return "lo";
        if (raw.startsWith("uk")) return "uk";
        if (raw.startsWith("fa")) return "fa-AF";
        if (raw.startsWith("si")) return "si";
        if (raw.startsWith("ms")) return "ms";
        if (raw.startsWith("my")) return "my";
        if (raw.startsWith("bn")) return "bn";
        if (raw.startsWith("ur")) return "ur";
        return "en-US";
      }

      function getI18nLanguage(langCode) {
        const supported = new Set(languageOptions.map((lang) => lang.code));
        return supported.has(langCode) ? langCode : "en-US";
      }

      async function initI18n(langCode) {
        if (!window.i18next) return;
        const target = getI18nLanguage(langCode);
        if (!i18next.isInitialized) {
          await i18next.use(i18nextHttpBackend).init({
            lng: target,
            fallbackLng: "en-US",
            backend: {
              loadPath: "./i18n/{{lng}}.json",
            },
          });
          return;
        }
        await i18next.changeLanguage(target);
      }

      function warmI18nLanguages() {
        if (
          i18nWarmStarted ||
          !window.i18next ||
          !i18next.isInitialized ||
          typeof i18next.loadLanguages !== "function"
        ) {
          return;
        }
        i18nWarmStarted = true;
        const languages = languageOptions.map((lang) => lang.code);
        const preload = () => {
          i18next.loadLanguages(languages).catch((error) => {
            console.error("Failed to preload aruaru i18n files", error);
          });
        };
        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(preload, { timeout: 1500 });
          return;
        }
        window.setTimeout(preload, 300);
      }

      function tr(key, fallback, options) {
        if (!window.i18next || !i18next.isInitialized) return fallback || "";
        const value = i18next.t(key, options || {});
        return value === key ? fallback || "" : value;
      }

      function renderLanguageButtons() {
        const list = document.getElementById("languageOptionList");
        list.innerHTML = "";
        languageOptions.forEach((lang) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className =
            "language-option-btn" +
            (selectedLanguage === lang.code ? " active" : "");
          btn.textContent = lang.label;
          btn.addEventListener("click", () => {
            const nextLanguage = lang.code;
            if (nextLanguage === selectedLanguage) {
              closeLanguageDialog();
              return;
            }
            const token = ++languageChangeToken;
            selectedLanguage = nextLanguage;
            localStorage.setItem(STORAGE_KEY, selectedLanguage);
            renderLanguageButtons();
            closeLanguageDialog();
            window.requestAnimationFrame(async () => {
              try {
                await initI18n(nextLanguage);
                if (token !== languageChangeToken) return;
                selectedLanguage = nextLanguage;
                localStorage.setItem(STORAGE_KEY, selectedLanguage);
                renderLanguageButtons();
                applyI18n();
                renderTagFilters();
                renderQaList();
                warmI18nLanguages();
              } catch (error) {
                console.error("Failed to change aruaru language", error);
              }
            });
          });
          list.appendChild(btn);
        });
      }

      function applyI18n() {
        document.getElementById("pageTitle").textContent = tr(
          "page_title",
          "日本の出産スタンダード",
        );
        document.getElementById("pageLead").textContent = tr(
          "page_lead",
          "日本で出産するときによくある流れや、病院での一般的な考え方を、見出しと詳細でまとめています。",
        );
        document.getElementById("languageSettingBtn").textContent = tr(
          "settings",
          "言語設定",
        );
        document.getElementById("languageDialogTitle").textContent = tr(
          "settings",
          "設定",
        );
        document.getElementById("languageSectionTitle").textContent = tr(
          "language",
          "言語設定",
        );
        document.getElementById("closeLanguageBtn").textContent = tr(
          "close",
          "閉じる",
        );
        document.getElementById("keywordSearchLabel").textContent = tr(
          "keyword_search",
          "フリーワード検索",
        );
        document.getElementById("keywordSearch").placeholder = tr(
          "keyword_placeholder",
          "質問や答えを入力",
        );
        document.getElementById("tagSearchLabel").textContent = tr(
          "tag_search",
          "タグ検索",
        );
      }

      function renderTagFilters() {
        const container = document.getElementById("tagFilterList");
        const periods = periodOrder.filter((period) =>
          qaItems.some((item) => item.period === period),
        );
        const filters = [
          { id: "all", label: tr("all_tags", "すべて") },
          ...periods.map((period) => ({ id: period, label: period })),
        ];
        container.innerHTML = "";
        filters.forEach((tag) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className =
            "tag-filter-btn" + (selectedTag === tag.id ? " active" : "");
          btn.innerHTML = escapeHtml(
            tag.id === "all" ? tag.label : translateTag(tag.label),
          );
          btn.addEventListener("click", () => {
            selectedTag = tag.id;
            renderTagFilters();
            renderQaList();
          });
          container.appendChild(btn);
        });
      }

      function renderQaList() {
        const list = document.getElementById("qaList");
        list.innerHTML = "";
        const filteredItems = qaItems.filter(matchesFilter);
        document.getElementById("searchResultMeta").textContent =
          filteredItems.length
            ? tr("result_count", `${filteredItems.length}件表示`, {
                count: filteredItems.length,
              })
            : tr("no_result", "該当する項目はありません。");

        periodOrder.forEach((period) => {
          const periodItems = filteredItems.filter(
            (item) => item.period === period,
          );
          if (!periodItems.length) return;

          const section = document.createElement("section");
          section.className = "period-section";
          const periodTitle = translateTag(period);
          section.innerHTML = `
          <div class="period-header">
            <p class="period-kicker">${tr("period_kicker", "時期")}</p>
            <h2 class="period-title">${escapeHtml(periodTitle)}</h2>
          </div>
          <div class="period-cards"></div>
        `;
          const cards = section.querySelector(".period-cards");

          periodItems.forEach((item, index) => {
            const details = document.createElement("details");
            details.className = "qa-card";
            const primaryQuestion = getPrimaryQuestion(item);
            const primaryAnswer = getPrimaryAnswer(item);
            const illustration = renderIllustration(item);

            const summary = document.createElement("summary");
            summary.className = "qa-summary";
            summary.innerHTML = `
            <p class="qa-ja">${escapeHtml(primaryQuestion)}</p>
          `;

            const panel = document.createElement("div");
            panel.className = "qa-panel";
            panel.innerHTML = `
            <div class="answer-block">
              <p class="answer-ja answer-preline">${escapeHtml(primaryAnswer)}</p>
              ${illustration}
            </div>
          `;

            details.appendChild(summary);
            details.appendChild(panel);
            cards.appendChild(details);
          });
          list.appendChild(section);
        });
      }

      function matchesFilter(item) {
        const tagMatch = selectedTag === "all" || item.period === selectedTag;
        if (!tagMatch) return false;
        if (!keyword) return true;
        const haystack = [
          item.period,
          item.jaQ,
          item.jaA,
          getPrimaryQuestion(item),
          getPrimaryAnswer(item),
          getTranslatedQuestion(item),
          getTranslatedAnswer(item),
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(keyword);
      }

      function getPrimaryQuestion(item) {
        return tr(`items.${item.id}.title`, item.jaQ);
      }

      function getPrimaryAnswer(item) {
        return tr(`items.${item.id}.detail`, item.jaA);
      }

      function getTranslatedQuestion(item) {
        if (selectedLanguage === "ja") return "";
        return tr(`items.${item.id}.title`, item.enQ || "");
      }

      function getTranslatedAnswer(item) {
        if (selectedLanguage === "ja") return "";
        return tr(`items.${item.id}.detail`, item.enA || "");
      }

      function translateTag(tag) {
        const key = tagTranslationKeys[tag];
        return key ? tr(key, tag) : tag;
      }

      function renderIllustration(item) {
        if (!item.image || !item.image.src) return "";
        const altText = getPrimaryQuestion(item);
        return `
        <figure class="qa-illustration">
          <img src="${escapeHtml(item.image.src)}" alt="${escapeHtml(altText)}" loading="lazy">
          <figcaption>${escapeHtml(item.image.credit || "Created by AI")}</figcaption>
        </figure>
      `;
      }

      function renderBilingualText(jaText, translatedText) {
        if (
          selectedLanguage === "ja" ||
          !translatedText ||
          translatedText === jaText
        ) {
          return escapeHtml(jaText);
        }
        return `<span class="chip-ja">${escapeHtml(jaText)}</span><span class="chip-tr">${escapeHtml(translatedText)}</span>`;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    </script>
  </body>
</html>
