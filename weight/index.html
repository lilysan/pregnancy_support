<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Gain Period Tracker</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/i18next@23/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://unpkg.com/jquery-i18next@1/jquery-i18next.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="../common/js/config.js"></script>
    <script src="../common/js/toast.js"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.13.18/jquery.timepicker.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="./period.css">

</head>

<body>
    <div id="header-container" class="header-wrapper"></div>
    <div class="loader is-hidden">
        <div class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <main>
        <article class="main-container weight-app">
            <h1 class="page-title" id="pageTitle">一定期間の増加体重管理</h1>
            <p class="page-lead" id="pageLead">期間の目標を設定し、体重の増え方を確認できます。</p>
            <div class="period-nav">
                <button type="button" id="loadNewerPeriodBtn" class="period-nav-btn">新しい期間へ</button>
                <div id="currentPeriodLabel" class="period-nav-label">最新の設定期間</div>
                <button type="button" id="loadOlderPeriodBtn" class="period-nav-btn">1つ前の期間を見る</button>
            </div>

            <section id="overviewTab" class="tab-panel">
                <section class="card">
                    <h2 id="summaryTitle">期間サマリー</h2>
                    <div class="summary-grid">
                        <div class="summary-box">
                            <div class="summary-label" id="summaryLabelPeriod">対象期間</div>
                            <div class="summary-value small" id="summaryPeriod">-</div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-label" id="summaryLabelStartWeight">開始時の体重</div>
                            <div class="summary-value" id="summaryStartWeight">-</div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-label" id="summaryLabelLatestWeight">最新の体重</div>
                            <div class="summary-value" id="summaryLatestWeight">-</div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-label" id="summaryLabelCurrentGain">現在の増加量</div>
                            <div class="summary-value" id="summaryCurrentGain">-</div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-label" id="summaryLabelTargetWeight">目標体重</div>
                            <div class="summary-value" id="summaryTargetWeight">-</div>
                        </div>
                        <div class="summary-box">
                            <div class="summary-label" id="summaryLabelRemaining">目標まで残り</div>
                            <div class="summary-value" id="summaryRemaining">-</div>
                        </div>
                    </div>
                    <div class="progress-wrap">
                        <div class="summary-label" id="progressLabel">目標増加体重に対する進み具合</div>
                        <div class="progress-bar">
                            <div id="gainProgressFill" class="progress-fill"></div>
                        </div>
                        <div class="summary-value small summary-value-with-gap" id="gainProgressText">-</div>
                    </div>
                    <div id="statusNote" class="status-note neutral">期間設定を入れると、期間中の増加量をここで確認できます。</div>
                </section>

                <section class="card chart-card">
                    <h2 id="chartTitle">期間中の推移</h2>
                    <canvas id="weightPeriodChart"></canvas>
                </section>
            </section>

        <section id="inputTab" class="tab-panel active">
            <details class="card accordion-card" id="planAccordion">
                <summary>
                    <div class="accordion-summary-row">
                        <div class="accordion-title-wrap">
                            <h2 id="planTitle">期間設定</h2>
                        </div>
                        <span class="accordion-icon">+</span>
                    </div>
                </summary>
                <div class="accordion-body">
                    <div class="field-grid field-grid-spaced">
                        <div class="field">
                            <label for="periodStartDate" id="labelPeriodStartDate">期間開始日</label>
                            <input type="text" id="periodStartDate" placeholder="yyyy-mm-dd">
                        </div>
                        <div class="field">
                            <label for="startWeightKg" id="labelStartWeightKg">開始時の体重(kg)</label>
                            <input type="number" id="startWeightKg" step="0.1" placeholder="例: 55.0">
                        </div>
                        <div class="field">
                            <label for="targetEndDate" id="labelTargetEndDate">目標終了日</label>
                            <input type="text" id="targetEndDate" placeholder="yyyy-mm-dd">
                        </div>
                        <div class="field">
                            <label for="targetGainKg" id="labelTargetGainKg">目標増加体重(kg)</label>
                            <input type="number" id="targetGainKg" step="0.1" placeholder="例: 1.5">
                        </div>
                    </div>
                    <div class="btn-row">
                        <button type="button" class="btn-primary" id="savePlanBtn">期間設定を保存</button>
                    </div>
                </div>
            </details>

            <section class="card">
                <h2 id="recordTitle">体重を記録</h2>
                <div class="field-grid field-grid-spaced">
                    <div class="field">
                        <label for="weightDate" id="labelWeightDate">日にち</label>
                        <input type="text" id="weightDate" placeholder="yyyy-mm-dd">
                    </div>
                    <div class="field">
                        <label for="weightPeriod" id="labelWeightPeriod">測定タイミング</label>
                        <select id="weightPeriod">
                            <option value="1" id="periodMorning">朝</option>
                            <option value="2" id="periodNoon">昼</option>
                            <option value="3" id="periodEvening">晩</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="weightValue" id="labelWeightValue">体重(kg)</label>
                        <input type="number" id="weightValue" step="0.1" placeholder="例: 55.4">
                    </div>
                </div>
                <div class="btn-row">
                    <button type="button" class="btn-primary" id="addWeightBtn">体重を登録</button>
                </div>
            </section>
        </section>

        <section id="listTab" class="tab-panel">
            <section class="card">
                <h2 id="tableTitle">期間中の記録一覧</h2>
                <div id="tableEmpty" class="empty-note">この期間の記録はまだありません。</div>
                <div class="table-wrap">
                    <table id="recordTable">
                        <thead>
                            <tr>
                                <th id="thDate">日にち</th>
                                <th id="thPeriod">時間帯</th>
                                <th id="thWeight">体重(kg)</th>
                                <th id="thGain">開始からの増加</th>
                                <th id="thEdit">編集</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </section>
        </article>
    </main>

    <div class="tab-bar">
        <button type="button" class="tab-button active" id="tabInput" onclick="switchTab('inputTab', event)">入力</button>
        <button type="button" class="tab-button" id="tabOverview" onclick="switchTab('overviewTab', event)">概要</button>
        <button type="button" class="tab-button" id="tabList" onclick="switchTab('listTab', event)">一覧</button>
    </div>

    <div id="editDialog" class="dialog-backdrop">
        <div class="dialog-panel">
            <h2 id="editDialogTitle" class="dialog-title">記録を編集</h2>
            <div class="field-grid">
                <div class="field">
                    <label for="editWeightDate" id="editLabelWeightDate">日にち</label>
                    <input type="text" id="editWeightDate">
                </div>
                <div class="field">
                    <label for="editWeightPeriod" id="editLabelWeightPeriod">測定タイミング</label>
                    <select id="editWeightPeriod">
                        <option value="1" id="editPeriodMorning">朝</option>
                        <option value="2" id="editPeriodNoon">昼</option>
                        <option value="3" id="editPeriodEvening">晩</option>
                    </select>
                </div>
                <div class="field">
                    <label for="editWeightValue" id="editLabelWeightValue">体重(kg)</label>
                    <input type="number" id="editWeightValue" step="0.1">
                </div>
            </div>
            <div class="dialog-actions">
                <button type="button" class="dialog-btn save" id="saveEditBtn">保存</button>
                <button type="button" class="dialog-btn cancel" id="cancelEditBtn">キャンセル</button>
                <button type="button" class="dialog-btn delete" id="deleteEditBtn">削除</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-timepicker/1.13.18/jquery.timepicker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
    <script>
        const currentPage = "weight";
    </script>
    <script src="../commonkokima_weight.js"></script>

    <script>
        const weightI18n = i18next.createInstance();
        const LANG_STORAGE_KEY = "weight2_ui_lang";
        const PERIOD_TIME = {
            1: "06:00",
            2: "12:00",
            3: "18:00"
        };
        const PERIOD_LABEL = {
            1: "朝",
            2: "昼",
            3: "晩"
        };

        const LANGUAGE_OPTIONS = [{
                code: "en-US",
                label: "英語編(English)"
            },
            {
                code: "zh",
                label: "中国語編(中文版)"
            },
            {
                code: "fr",
                label: "フランス語編(French)"
            },
            {
                code: "ko",
                label: "韓国語編(Korean)"
            },
            {
                code: "pr",
                label: "ポルトガル語編(Portugues)"
            },
            {
                code: "tl",
                label: "タガログ語編(TAGALOG)"
            },
            {
                code: "ve",
                label: "ベトナム語編(Vietnam)"
            },
            {
                code: "th",
                label: "タイ語編(Thai)"
            },
            {
                code: "de",
                label: "ドイツ語編(German)"
            },
            {
                code: "id",
                label: "インドネシア語(Indonesia)"
            },
            {
                code: "ru",
                label: "ロシア語(Russian)"
            },
            {
                code: "ne",
                label: "ネパール語(Nepali)"
            },
            {
                code: "lo",
                label: "ラオス語(Laotian)"
            },
            {
                code: "uk",
                label: "ウクライナ語(Ukrainian)"
            },
            {
                code: "fa-AF",
                label: "ダリ語(Dari)"
            },
            {
                code: "si",
                label: "シンハラ語(Sinhala)"
            },
            {
                code: "ms",
                label: "マレー語(Malay)"
            },
            {
                code: "my",
                label: "ミャンマー語(Myanmar)"
            },
            {
                code: "bn",
                label: "ベンガル語(Bengali)"
            },
            {
                code: "ur",
                label: "ウルドゥー語(Urdu)"
            }
        ];

        let token = "";
        let userId = "";
        let allData = [];
        let currentPeriod = null;
        let weightPeriodPage = 1;
        let hasOlderWeightPeriod = true;
        let loadingWeightPeriod = false;
        let editingItemId = "";
        let editingDatetime = "";
        let selectedUiLang = "ja";

        const chart = new Chart(document.getElementById("weightPeriodChart").getContext("2d"), {
            type: "line",
            data: {
                labels: [],
                datasets: [{
                        label: "体重(kg)",
                        data: [],
                        borderColor: "#4f8f96",
                        backgroundColor: "rgba(79, 143, 150, 0.16)",
                        borderWidth: 3,
                        pointRadius: 4,
                        pointHoverRadius: 5,
                        fill: false,
                        tension: 0.22
                    },
                    {
                        label: "目標ライン",
                        data: [],
                        borderColor: "#e9778d",
                        borderWidth: 2,
                        pointRadius: 0,
                        borderDash: [6, 6],
                        fill: false,
                        tension: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            boxWidth: 14,
                            color: "#2c3e50",
                            font: {
                                size: 12,
                                weight: "700"
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: "time",
                        time: {
                            unit: "day",
                            displayFormats: {
                                day: "M/d"
                            }
                        },
                        ticks: {
                            color: "#647381"
                        },
                        grid: {
                            color: "rgba(79, 143, 150, 0.10)"
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: "体重(kg)"
                        },
                        ticks: {
                            color: "#647381"
                        },
                        grid: {
                            color: "rgba(79, 143, 150, 0.10)"
                        }
                    }
                }
            }
        });

        function getMeta() {
            return currentPeriod || {};
        }

        function saveMeta(meta) {
            currentPeriod = meta || null;
        }

        function tx(key, langCode) {
            const rawCode = langCode || selectedUiLang;
            const code = rawCode === "ja" ? "ja" : resolveI18nLang(rawCode);
            try {
                return weightI18n.getFixedT(code, "translation")(key);
            } catch (e) {
                return key;
            }
        }

        function template(str, vars) {
            return String(str).replace(/\{(\w+)\}/g, function (_, key) {
                return vars && vars[key] != null ? String(vars[key]) : "";
            });
        }

        function bt(key) {
            const ja = tx(key, "ja");
            if (selectedUiLang === "ja") return ja;
            return ja + " / " + tx(key, selectedUiLang);
        }

        function btTemplate(key, vars) {
            const ja = template(tx(key, "ja"), vars);
            if (selectedUiLang === "ja") return ja;
            return ja + " / " + template(tx(key, selectedUiLang), vars);
        }

        function resolveI18nLang(langCode) {
            if (langCode === "ja") return "ja";
            if (langCode === "zh") return "zh";
            return "en-US";
        }

        async function initI18n(langCode) {
            const resolved = resolveI18nLang(langCode);
            await weightI18n
                .use(i18nextHttpBackend)
                .init({
                    lng: resolved,
                    fallbackLng: "ja",
                    ns: ["translation"],
                    defaultNS: "translation",
                    load: "currentOnly",
                    backend: {
                        loadPath: "./i18n/{{lng}}.json"
                    },
                    interpolation: {
                        escapeValue: false
                    }
                });
        }

        function isSupportedLang(code) {
            return code === "ja" || LANGUAGE_OPTIONS.some(function (item) {
                return item.code === code;
            });
        }

        function normalizeLangToUi(lang) {
            const l = String(lang || "ja").toLowerCase();
            if (l.startsWith("zh")) return "zh";
            if (l.startsWith("fr")) return "fr";
            if (l.startsWith("ko")) return "ko";
            if (l.startsWith("pt")) return "pr";
            if (l.startsWith("tl")) return "tl";
            if (l.startsWith("vi")) return "ve";
            if (l.startsWith("th")) return "th";
            if (l.startsWith("de")) return "de";
            if (l.startsWith("id")) return "id";
            if (l.startsWith("ru")) return "ru";
            if (l.startsWith("ne")) return "ne";
            if (l.startsWith("lo")) return "lo";
            if (l.startsWith("uk")) return "uk";
            if (l.startsWith("fa")) return "fa-AF";
            if (l.startsWith("si")) return "si";
            if (l.startsWith("ms")) return "ms";
            if (l.startsWith("my")) return "my";
            if (l.startsWith("bn")) return "bn";
            if (l.startsWith("ur")) return "ur";
            if (l.startsWith("en")) return "en-US";
            return "ja";
        }

        function renderLanguageOptions() {
            const list = document.getElementById("languageOptionList");
            if (!list) return;
            list.innerHTML = "";

            const jaBtn = document.createElement("button");
            jaBtn.type = "button";
            jaBtn.className = "language-option-btn" + (selectedUiLang === "ja" ? " active" : "");
            jaBtn.textContent = "やさしい日本語 / Japanese";
            jaBtn.onclick = function () {
                setLanguage("ja");
            };
            list.appendChild(jaBtn);

            LANGUAGE_OPTIONS.forEach(function (lang) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "language-option-btn" + (selectedUiLang === lang.code ? " active" : "");
                btn.textContent = lang.label;
                btn.onclick = function () {
                    setLanguage(lang.code);
                };
                list.appendChild(btn);
            });
        }

        async function setLanguage(langCode) {
            selectedUiLang = isSupportedLang(langCode) ? langCode : "ja";
            localStorage.setItem(LANG_STORAGE_KEY, selectedUiLang);
            await weightI18n.changeLanguage(resolveI18nLang(selectedUiLang));
            applyI18n();
            renderLanguageOptions();
        }

        function applyI18n() {
            const setText = (id, value) => {
                const el = document.getElementById(id);
                if (el) el.textContent = value;
            };
            setText("pageTitle", bt("pageTitle"));
            setText("pageLead", bt("pageLead"));
            setText("planTitle", bt("planTitle"));
            setText("labelPeriodStartDate", bt("periodStartDate"));
            setText("labelStartWeightKg", bt("startWeightKg"));
            setText("labelTargetEndDate", bt("targetEndDate"));
            setText("labelTargetGainKg", bt("targetGainKg"));
            setText("savePlanBtn", bt("savePlan"));
            setText("summaryTitle", bt("summaryTitle"));
            setText("summaryLabelPeriod", bt("summaryPeriod"));
            setText("summaryLabelStartWeight", bt("summaryStartWeight"));
            setText("summaryLabelLatestWeight", bt("summaryLatestWeight"));
            setText("summaryLabelCurrentGain", bt("summaryCurrentGain"));
            setText("summaryLabelTargetWeight", bt("summaryTargetWeight"));
            setText("summaryLabelRemaining", bt("summaryRemaining"));
            setText("progressLabel", bt("progressLabel"));
            setText("recordTitle", bt("recordTitle"));
            setText("labelWeightDate", bt("date"));
            setText("labelWeightPeriod", bt("weightPeriod"));
            setText("labelWeightValue", bt("weightValue"));
            setText("addWeightBtn", bt("addWeight"));
            setText("periodMorning", bt("morning"));
            setText("periodNoon", bt("noon"));
            setText("periodEvening", bt("evening"));
            setText("chartTitle", bt("chartTitle"));
            setText("tabOverview", bt("tabOverview"));
            setText("tabInput", bt("tabInput"));
            setText("tabList", bt("tabList"));
            setText("tableTitle", bt("tableTitle"));
            setText("tableEmpty", bt("tableEmpty"));
            setText("thDate", bt("thDate"));
            setText("thPeriod", bt("thPeriod"));
            setText("thWeight", bt("thWeight"));
            setText("thGain", bt("thGain"));
            setText("thEdit", bt("thEdit"));
            setText("editDialogTitle", bt("editDialogTitle"));
            setText("editLabelWeightDate", bt("date"));
            setText("editLabelWeightPeriod", bt("weightPeriod"));
            setText("editLabelWeightValue", bt("weightValue"));
            setText("editPeriodMorning", bt("morning"));
            setText("editPeriodNoon", bt("noon"));
            setText("editPeriodEvening", bt("evening"));
            setText("saveEditBtn", bt("save"));
            setText("cancelEditBtn", bt("cancel"));
            setText("deleteEditBtn", bt("delete"));
            chart.data.datasets[0].label = bt("chartWeightLabel");
            chart.data.datasets[1].label = bt("chartGoalLabel");
            chart.options.scales.y.title.text = bt("chartWeightLabel");
            chart.update();
        }

        function switchTab(tabId, event) {
            document.querySelectorAll(".tab-panel").forEach(function (panel) {
                panel.classList.remove("active");
            });
            document.querySelectorAll(".tab-button").forEach(function (button) {
                button.classList.remove("active");
            });
            const nextPanel = document.getElementById(tabId);
            if (nextPanel) nextPanel.classList.add("active");
            if (event && event.currentTarget) event.currentTarget.classList.add("active");
            if (tabId === "overviewTab") {
                chart.resize();
                chart.update();
            }
        }

        function formatDateTime(date, period) {
            return date + " " + (PERIOD_TIME[String(period)] || "06:00");
        }

        function parseDateOnly(value) {
            return new Date(String(value) + "T00:00:00");
        }

        function formatDateJP(value) {
            if (!value) return "-";
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return String(value);
            return (d.getMonth() + 1) + "/" + d.getDate();
        }

        function formatWeight(value) {
            return Number.isFinite(value) ? value.toFixed(1) + " kg" : "-";
        }

        function sortWeightData(items) {
            return (items || []).slice().sort(function (a, b) {
                return new Date(String(a.datetime || "")).getTime() - new Date(String(b.datetime || ""))
                    .getTime();
            });
        }

        function showLoader() {
            if (typeof showAppLoader === "function") {
                showAppLoader();
                return;
            }
            $(".loader").show();
        }

        function hideLoader() {
            if (typeof hideAppLoader === "function") {
                hideAppLoader();
                return;
            }
            $(".loader").hide();
        }

        function requestWeightApi(method, postData) {
            showLoader();
            const access = getAccessObj({
                path: "weight",
                method: method,
                idToken: token,
                userId: userId,
                postData: postData || {}
            });
            access.timeout = 12000;
            return $.ajax(access).then(function (response) {
                if (response.statusCode === 401) {
                    liff.logout();
                    window.location.reload();
                    return null;
                }
                if (response.statusCode !== 200) {
                    console.error(response.message);
                    alert(response.message || "API error");
                    return null;
                }
                return response.data || {};
            }, function () {
                alert("Network error!weight");
                return null;
            }).always(function () {
                hideLoader();
            });
        }

        function resolveItemId(item) {
            if (!item) return "";
            return item.itemId || item.LitemId || item.Litemid || item.litemId || item.id || "";
        }

        function normalizePeriod(period) {
            if (!period) return null;
            return {
                periodId: period.periodId || period.LperiodId || period.id || "",
                startDate: period.startDate || period.LstartDate || "",
                startWeightKg: Number(period.startWeightKg != null ? period.startWeightKg : period.LstartWeightKg),
                endDate: period.endDate || period.targetEndDate || period.LendDate || "",
                targetGainKg: Number(period.targetGainKg != null ? period.targetGainKg : period.LtargetGainKg)
            };
        }

        function normalizeWeightItem(item) {
            return {
                itemId: resolveItemId(item),
                periodId: item.periodId || item.LperiodId || "",
                datetime: item.datetime || item.Ldatetime || "",
                weight: Number(item.weight != null ? item.weight : item.Lweight)
            };
        }

        function syncPeriodNav() {
            const olderBtn = document.getElementById("loadOlderPeriodBtn");
            const newerBtn = document.getElementById("loadNewerPeriodBtn");
            const label = document.getElementById("currentPeriodLabel");
            if (olderBtn) {
                olderBtn.textContent = loadingWeightPeriod ? "読み込み中" : (hasOlderWeightPeriod ? "1つ前の期間を見る" : "これ以上ありません");
                olderBtn.disabled = loadingWeightPeriod || !hasOlderWeightPeriod;
            }
            if (newerBtn) {
                newerBtn.disabled = loadingWeightPeriod || weightPeriodPage <= 1;
            }
            if (label) {
                if (!currentPeriod) {
                    label.textContent = "設定期間がありません";
                } else if (weightPeriodPage === 1) {
                    label.textContent = "最新の設定期間";
                } else {
                    label.textContent = `${weightPeriodPage - 1}つ前の設定期間`;
                }
            }
        }

        function applyWeightPeriodPayload(payload, page) {
            const data = payload || {};
            currentPeriod = normalizePeriod(data.period);
            allData = sortWeightData(Array.isArray(data.items) ? data.items.map(normalizeWeightItem).filter(function (item) {
                return item.datetime && Number.isFinite(item.weight);
            }) : []);
            weightPeriodPage = page;
            hasOlderWeightPeriod = currentPeriod ? data.hasOlder !== false : false;
            loadMetaToForm();
            renderTable();
            renderSummary();
            updateChart();
            syncPeriodNav();
        }

        function fetchWeightPeriodPage(page) {
            loadingWeightPeriod = true;
            syncPeriodNav();
            return requestWeightApi("get", {
                unit: "period",
                limit: 1,
                page: page
            }).then(function (payload) {
                if (!payload) {
                    if (!currentPeriod) hasOlderWeightPeriod = false;
                    return;
                }
                applyWeightPeriodPayload(payload, page);
            }).catch(function (error) {
                console.error("weight period load error:", error);
                if (!currentPeriod) hasOlderWeightPeriod = false;
                alert("読み込みに失敗しました。もう一度お試しください。");
            }).then(function () {
                loadingWeightPeriod = false;
                syncPeriodNav();
            }, function () {
                loadingWeightPeriod = false;
                syncPeriodNav();
            });
        }

        function loadOlderWeightPeriod() {
            if (loadingWeightPeriod || !hasOlderWeightPeriod) return;
            fetchWeightPeriodPage(weightPeriodPage + 1);
        }

        function loadNewerWeightPeriod() {
            if (loadingWeightPeriod || weightPeriodPage <= 1) return;
            fetchWeightPeriodPage(weightPeriodPage - 1);
        }

        function getFilteredRecords() {
            const meta = getMeta();
            const start = meta.startDate ? parseDateOnly(meta.startDate).getTime() : null;
            const end = meta.endDate ? parseDateOnly(meta.endDate).getTime() : null;

            return sortWeightData(allData).filter(function (item) {
                if (!Number.isFinite(start) || !Number.isFinite(end)) return true;
                const datePart = String(item.datetime || "").split(" ")[0];
                const time = parseDateOnly(datePart).getTime();
                return start <= time && time <= end;
            });
        }

        function createTablePage() {
            renderTable();
        }

        function populateTable() {
            renderTable();
        }

        async function setallData() {
            await reloadWeightData();
        }

        function updateChart() {
            const meta = getMeta();
            const records = getFilteredRecords();
            const goalPoints = [];

            if (meta.startDate && meta.endDate && Number.isFinite(meta.startWeightKg) && Number.isFinite(meta
                    .targetGainKg)) {
                goalPoints.push({
                    x: new Date(meta.startDate + "T00:00:00"),
                    y: meta.startWeightKg
                });
                goalPoints.push({
                    x: new Date(meta.endDate + "T00:00:00"),
                    y: meta.startWeightKg + meta.targetGainKg
                });
            }

            chart.data.datasets[0].data = records.map(function (item) {
                return {
                    x: new Date(item.datetime),
                    y: Number(item.weight)
                };
            });
            chart.data.datasets[1].data = goalPoints;
            chart.update();
            renderSummary();
        }

        function renderSummary() {
            const meta = getMeta();
            const records = getFilteredRecords();
            const latest = records.length ? records[records.length - 1] : null;
            const startWeight = Number(meta.startWeightKg);
            const targetGain = Number(meta.targetGainKg);
            const targetWeight = Number.isFinite(startWeight) && Number.isFinite(targetGain) ? startWeight +
                targetGain : null;
            const currentWeight = latest ? Number(latest.weight) : null;
            const currentGain = Number.isFinite(currentWeight) && Number.isFinite(startWeight) ? currentWeight -
                startWeight : null;
            const remaining = Number.isFinite(targetWeight) && Number.isFinite(currentWeight) ? targetWeight -
                currentWeight : null;

            document.getElementById("summaryPeriod").textContent = meta.startDate && meta.endDate ? meta.startDate +
                " - " + meta.endDate : "-";
            document.getElementById("summaryStartWeight").textContent = formatWeight(startWeight);
            document.getElementById("summaryLatestWeight").textContent = formatWeight(currentWeight);
            document.getElementById("summaryCurrentGain").textContent = Number.isFinite(currentGain) ? currentGain
                .toFixed(1) + " kg" : "-";
            document.getElementById("summaryTargetWeight").textContent = formatWeight(targetWeight);
            document.getElementById("summaryRemaining").textContent = Number.isFinite(remaining) ? remaining.toFixed(
                1) + " kg" : "-";

            const progressFill = document.getElementById("gainProgressFill");
            const progressText = document.getElementById("gainProgressText");
            const statusNote = document.getElementById("statusNote");

            if (!meta.startDate || !meta.endDate || !Number.isFinite(startWeight) || !Number.isFinite(targetGain)) {
                progressFill.style.width = "0%";
                progressText.textContent = bt("progressNoPlan");
                statusNote.className = "status-note neutral";
                statusNote.textContent = bt("statusNeedPlan");
                return;
            }

            if (!records.length) {
                progressFill.style.width = "0%";
                progressText.textContent = bt("progressNoRecords");
                statusNote.className = "status-note neutral";
                statusNote.textContent = bt("statusNoRecords");
                return;
            }

            const pct = targetGain <= 0 ? 0 : Math.max(0, Math.min(100, (currentGain / targetGain) * 100));
            progressFill.style.width = pct + "%";
            progressText.textContent = btTemplate("progressCurrentAndGoal", {
                current: currentGain.toFixed(1),
                target: targetGain.toFixed(1)
            });

            if (currentGain < 0) {
                statusNote.className = "status-note warn";
                statusNote.textContent = bt("statusLosing");
            } else if (currentGain <= targetGain * 0.8) {
                statusNote.className = "status-note ok";
                statusNote.textContent = bt("statusOk");
            } else if (currentGain <= targetGain) {
                statusNote.className = "status-note warn";
                statusNote.textContent = bt("statusNearGoal");
            } else {
                statusNote.className = "status-note alert";
                statusNote.textContent = bt("statusOverGoal");
            }
        }

        function renderTable() {
            const meta = getMeta();
            const startWeight = Number(meta.startWeightKg);
            const records = getFilteredRecords();
            const body = document.querySelector("#recordTable tbody");
            const empty = document.getElementById("tableEmpty");
            body.innerHTML = "";

            if (!records.length) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";
            records.forEach(function (item) {
                const datePart = String(item.datetime).split(" ")[0];
                const timePart = String(item.datetime).split(" ")[1] || "06:00";
                const period = timePart === "12:00" ? "2" : (timePart === "18:00" ? "3" : "1");
                const gain = Number.isFinite(startWeight) ? Number(item.weight) - startWeight : null;
                const row = document.createElement("tr");
                const itemId = resolveItemId(item);
                row.innerHTML = `
                    <td>${datePart}</td>
                    <td>${period === "1" ? bt("morning") : period === "2" ? bt("noon") : bt("evening")}</td>
                    <td class="strong-num">${Number(item.weight).toFixed(1)}</td>
                    <td class="strong-num">${Number.isFinite(gain) ? (gain >= 0 ? "+" : "") + gain.toFixed(1) + " kg" : "-"}</td>
                    <td><button type="button" class="edit-btn" data-item-id="${itemId}" data-datetime="${item.datetime}">${bt("editBtn")}</button></td>
                `;
                body.appendChild(row);
            });

            body.querySelectorAll(".edit-btn").forEach(function (button) {
                button.addEventListener("click", function () {
                    openEditDialog(this.dataset.itemId, this.dataset.datetime);
                });
            });
        }

        function openEditDialog(itemId, datetime) {
            const item = allData.find(function (entry) {
                const entryItemId = resolveItemId(entry);
                return (itemId && String(entryItemId) === String(itemId)) || String(entry.datetime) === String(datetime);
            });
            if (!item) return;

            editingItemId = resolveItemId(item);
            editingDatetime = datetime;
            const datePart = String(item.datetime).split(" ")[0];
            const timePart = String(item.datetime).split(" ")[1] || "06:00";
            const period = timePart === "12:00" ? "2" : (timePart === "18:00" ? "3" : "1");
            document.getElementById("editWeightDate").value = datePart;
            document.getElementById("editWeightPeriod").value = period;
            document.getElementById("editWeightValue").value = Number(item.weight).toFixed(1);
            document.getElementById("editDialog").style.display = "flex";
        }

        function closeEditDialog() {
            document.getElementById("editDialog").style.display = "none";
            editingItemId = "";
            editingDatetime = "";
        }

        async function reloadWeightData() {
            await fetchWeightPeriodPage(weightPeriodPage || 1);
        }

        function loadMetaToForm() {
            const meta = getMeta();
            document.getElementById("periodStartDate").value = meta.startDate || "";
            document.getElementById("startWeightKg").value = Number.isFinite(meta.startWeightKg) ? meta.startWeightKg :
                "";
            document.getElementById("targetEndDate").value = meta.endDate || "";
            document.getElementById("targetGainKg").value = Number.isFinite(meta.targetGainKg) ? meta.targetGainKg : "";
        }

        async function savePlan() {
            const startDate = document.getElementById("periodStartDate").value;
            const startWeightKg = parseFloat(document.getElementById("startWeightKg").value);
            const endDate = document.getElementById("targetEndDate").value;
            const targetGainKg = parseFloat(document.getElementById("targetGainKg").value);

            if (!startDate || !endDate || !Number.isFinite(startWeightKg) || !Number.isFinite(targetGainKg)) {
                alert(bt("promptFillPlan"));
                return;
            }
            if (parseDateOnly(endDate).getTime() < parseDateOnly(startDate).getTime()) {
                alert(bt("promptInvalidDate"));
                return;
            }

            const isExistingPeriod = currentPeriod && currentPeriod.periodId !== "";
            const nextPage = isExistingPeriod ? weightPeriodPage : 1;
            const payload = {
                type: "period",
                startDate: startDate,
                startWeightKg: Number(startWeightKg.toFixed(1)),
                endDate: endDate,
                targetGainKg: Number(targetGainKg.toFixed(1))
            };
            if (isExistingPeriod) {
                payload.periodId = currentPeriod.periodId;
            }
            const result = await requestWeightApi("put", payload);
            if (!result) return;
            await fetchWeightPeriodPage(nextPage);
            alert(bt("promptPlanSaved"));
            switchTab("overviewTab", {
                currentTarget: document.getElementById("tabOverview")
            });
        }

        async function addWeightRecord() {
            const date = document.getElementById("weightDate").value;
            const period = document.getElementById("weightPeriod").value;
            const weight = parseFloat(document.getElementById("weightValue").value);

            if (!date || !period || !Number.isFinite(weight)) {
                alert(bt("promptFillWeight"));
                return;
            }
            if (!currentPeriod || currentPeriod.periodId === "") {
                alert("先に期間設定を保存してください。");
                return;
            }

            const result = await requestWeightApi("post", {
                type: "record",
                periodId: currentPeriod.periodId,
                datetime: formatDateTime(date, period),
                weight: Number(weight.toFixed(1))
            });
            if (!result) return;

            document.getElementById("weightValue").value = "";
            await reloadWeightData();
            switchTab("overviewTab", {
                currentTarget: document.getElementById("tabOverview")
            });
        }

        async function saveEditedRecord() {
            const date = document.getElementById("editWeightDate").value;
            const period = document.getElementById("editWeightPeriod").value;
            const weight = parseFloat(document.getElementById("editWeightValue").value);

            if (!editingItemId || !date || !period || !Number.isFinite(weight)) {
                alert(bt("promptFillEdit"));
                return;
            }

            const result = await requestWeightApi("put", {
                type: "record",
                itemId: editingItemId,
                periodId: currentPeriod ? currentPeriod.periodId : "",
                datetime: formatDateTime(date, period),
                weight: Number(weight.toFixed(1))
            });
            if (!result) return;

            closeEditDialog();
            await reloadWeightData();
        }

        async function deleteEditedRecord() {
            if (!editingItemId) return;
            const result = await requestWeightApi("delete", {
                type: "record",
                itemId: editingItemId
            });
            if (!result) return;
            closeEditDialog();
            await reloadWeightData();
        }

        function initPickers() {
            $("#periodStartDate").datepicker({
                dateFormat: "yy-mm-dd"
            });
            $("#targetEndDate").datepicker({
                dateFormat: "yy-mm-dd"
            });
            $("#weightDate").datepicker({
                dateFormat: "yy-mm-dd"
            });
            $("#editWeightDate").datepicker({
                dateFormat: "yy-mm-dd"
            });
        }

        function setTodayDefaults() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, "0");
            const dd = String(today.getDate()).padStart(2, "0");
            const todayText = yyyy + "-" + mm + "-" + dd;
            if (!document.getElementById("periodStartDate").value) document.getElementById("periodStartDate").value =
                todayText;
            if (!document.getElementById("weightDate").value) document.getElementById("weightDate").value = todayText;
        }

        function bindEvents() {
            document.getElementById("savePlanBtn").addEventListener("click", savePlan);
            document.getElementById("addWeightBtn").addEventListener("click", addWeightRecord);
            document.getElementById("saveEditBtn").addEventListener("click", saveEditedRecord);
            document.getElementById("cancelEditBtn").addEventListener("click", closeEditDialog);
            document.getElementById("deleteEditBtn").addEventListener("click", deleteEditedRecord);
            document.getElementById("loadOlderPeriodBtn").addEventListener("click", loadOlderWeightPeriod);
            document.getElementById("loadNewerPeriodBtn").addEventListener("click", loadNewerWeightPeriod);
            document.getElementById("editDialog").addEventListener("click", function (event) {
                if (event.target.id === "editDialog") closeEditDialog();
            });
        }

        function startWeightApp(idToken) {
            token = idToken;
            return reloadWeightData().catch(function (error) {
                console.error("initial weight load error:", error);
            });
        }

        function loadHeader() {
            return new Promise((resolve, reject) => {
                let settled = false;
                const finish = () => {
                    if (settled) return;
                    settled = true;
                    resolve();
                };
                const fail = (error) => {
                    if (settled) return;
                    settled = true;
                    reject(error);
                };
                const timer = setTimeout(finish, 3000);
                $("#header-container").load("../common/header.html", function (_responseText, status) {
                    if (status === "error") {
                        clearTimeout(timer);
                        fail(new Error("Failed to load header.html"));
                        return;
                    }
                    document.addEventListener("i18n-initialized", function () {
                        clearTimeout(timer);
                        finish();
                    }, {
                        once: true
                    });
                    $.getScript("../common/js/header.js").fail(function () {
                        clearTimeout(timer);
                        fail(new Error("Failed to load header.js"));
                    });
                });
            });
        }

        function bootWeightApp() {
            if (typeof showAppLoader === "function") {
                showAppLoader();
            }
            const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
            liff.init({
                liffId: LIFF_ID,
                withLoginOnExternalBrowser: !isDev
            }).then(() => {
                const idToken = liff.getIDToken();
                const lang = typeof liff.getAppLanguage === "function" ? liff.getAppLanguage() : "en";
                if (!isSupportedLang(localStorage.getItem(LANG_STORAGE_KEY))) {
                    selectedUiLang = normalizeLangToUi(lang);
                    localStorage.setItem(LANG_STORAGE_KEY, selectedUiLang);
                }
                return Promise.resolve(typeof liff.getProfile === "function" ? liff.getProfile() : null)
                    .catch(() => null)
                    .then((profile) => {
                        const decoded = typeof liff.getDecodedIDToken === "function" ? liff.getDecodedIDToken() : null;
                        userId = profile && profile.userId ? profile.userId : ((decoded && (decoded.sub || decoded.userId)) || "");
                        return Promise.all([
                            startWeightApp(idToken),
                            loadHeader()
                        ]);
                    });
            }).then(() => {
                if (typeof hideAppLoader === "function") {
                    hideAppLoader();
                }
            }).catch((err) => {
                console.error("LIFF init failed:", err);
                if (typeof hideAppLoader === "function") {
                    hideAppLoader();
                }
                alert("LIFF init failed.");
            });
        }
    </script>
    <script>
        window.addEventListener("load", async function () {
            const initialSavedLang = localStorage.getItem(LANG_STORAGE_KEY);
            const browserLang = normalizeLangToUi(navigator.language || "en-US");
            selectedUiLang = isSupportedLang(initialSavedLang) ? initialSavedLang : browserLang;
            localStorage.setItem(LANG_STORAGE_KEY, selectedUiLang);
            await initI18n(selectedUiLang);
            renderLanguageOptions();
            applyI18n();
            loadMetaToForm();
            initPickers();
            setTodayDefaults();
            bindEvents();
            bootWeightApp();
        });
    </script>
</body>

</html>
