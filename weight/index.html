    <button type="button" id="settingsBtn" class="settings-btn" onclick="openSettingsDialog()">設定</button>

    <div id="settingsDialog">

            <div class="settings-header">
                <h2 id="settingsDialogTitle">設定</h2>
                <button type="button" id="closeSettingsBtnTop" class="settings-close-top-btn"
                    onclick="closeSettingsDialog()">閉じる</button>
            </div>
            <div class="settings-block">
                <p id="languageSectionTitle" class="settings-label">言語設定</p>
                <div id="languageOptionList" class="language-option-list"></div>
            </div>
            <button type="button" id="closeSettingsBtn" onclick="closeSettingsDialog()">閉じる</button>
        </div>
    </div>

    <header class="page-header">
        <h1 class="page-title" id="pageTitle">一定期間の増加体重管理</h1>
        <p class="page-lead" id="pageLead">看護師さんが期間の目標を設定し、その期間の中で朝・昼・晩の体重を記録して、どのくらい増えているかを確認するための画面です。</p>
    </header>

    <div class="tab-bar">
        <button type="button" class="tab-button active" id="tabInput" onclick="switchTab('inputTab', event)">入力</button>
        <button type="button" class="tab-button" id="tabOverview" onclick="switchTab('overviewTab', event)">概要</button>
        <button type="button" class="tab-button" id="tabList" onclick="switchTab('listTab', event)">一覧</button>
    </div>

    <main class="layout">
        <section id="overviewTab" class="tab-panel">
            <section class="card">
                <h2 id="summaryTitle">期間サマリー</h2>
                <div class="summary-grid">
                    <div class="summary-box">
                        <div class="summary-label" id="summaryLabelPeriod">対象期間</div>
                        <div class="summary-value small" id="summaryPeriod">-</div>
                    </div>
                    <div class="summary-box">
                        <div class="summary-label" id="summaryLabelStartWeight">開始時の体重</div>
                        <div class="summary-value" id="summaryStartWeight">-</div>
                    </div>
                    <div class="summary-box">
                        <div class="summary-label" id="summaryLabelLatestWeight">最新の体重</div>
                        <div class="summary-value" id="summaryLatestWeight">-</div>
                    </div>
                    <div class="summary-box">
                        <div class="summary-label" id="summaryLabelCurrentGain">現在の増加量</div>
                        <div class="summary-value" id="summaryCurrentGain">-</div>
                    </div>
                    <div class="summary-box">
                        <div class="summary-label" id="summaryLabelTargetWeight">目標体重</div>
                        <div class="summary-value" id="summaryTargetWeight">-</div>
                    </div>
                    <div class="summary-box">
                        <div class="summary-label" id="summaryLabelRemaining">目標まで残り</div>
                        <div class="summary-value" id="summaryRemaining">-</div>
                    </div>
                </div>
                <div class="progress-wrap">
                    <div class="summary-label" id="progressLabel">目標増加体重に対する進み具合</div>
                    <div class="progress-bar">
                        <div id="gainProgressFill" class="progress-fill"></div>
                    </div>
                    <div class="summary-value small summary-value-with-gap" id="gainProgressText">-</div>
                </div>
                <div id="statusNote" class="status-note neutral">期間設定を入れると、期間中の増加量をここで確認できます。</div>
            </section>

            <section class="card chart-card">
                <h2 id="chartTitle">期間中の推移</h2>
                <canvas id="weightPeriodChart"></canvas>
            </section>
        </section>

        <section id="inputTab" class="tab-panel active">
            <details class="card accordion-card" id="planAccordion">
                <summary>
                    <div class="accordion-summary-row">
                        <div class="accordion-title-wrap">
                            <h2 id="planTitle">期間設定</h2>
                        </div>
                        <span class="accordion-icon">+</span>
                    </div>
                </summary>
                <div class="accordion-body">
                    <div class="field-grid field-grid-spaced">
                        <div class="field">
                            <label for="periodStartDate" id="labelPeriodStartDate">期間開始日</label>
                            <input type="text" id="periodStartDate" placeholder="yyyy-mm-dd">
                        </div>
                        <div class="field">
                            <label for="startWeightKg" id="labelStartWeightKg">開始時の体重(kg)</label>
                            <input type="number" id="startWeightKg" step="0.1" placeholder="例: 55.0">
                        </div>
                        <div class="field">
                            <label for="targetEndDate" id="labelTargetEndDate">目標終了日</label>
                            <input type="text" id="targetEndDate" placeholder="yyyy-mm-dd">
                        </div>
                        <div class="field">
                            <label for="targetGainKg" id="labelTargetGainKg">目標増加体重(kg)</label>
                            <input type="number" id="targetGainKg" step="0.1" placeholder="例: 1.5">
                        </div>
                    </div>
                    <div class="btn-row">
                        <button type="button" class="btn-primary" id="savePlanBtn">期間設定を保存</button>
                    </div>
                </div>
            </details>

            <section class="card">
                <h2 id="recordTitle">体重を記録</h2>
                <div class="field-grid field-grid-spaced">
                    <div class="field">
                        <label for="weightDate" id="labelWeightDate">日にち</label>
                        <input type="text" id="weightDate" placeholder="yyyy-mm-dd">
                    </div>
                    <div class="field">
                        <label for="weightPeriod" id="labelWeightPeriod">測定タイミング</label>
                        <select id="weightPeriod">
                            <option value="1" id="periodMorning">朝</option>
                            <option value="2" id="periodNoon">昼</option>
                            <option value="3" id="periodEvening">晩</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="weightValue" id="labelWeightValue">体重(kg)</label>
                        <input type="number" id="weightValue" step="0.1" placeholder="例: 55.4">
                    </div>
                </div>
                <div class="btn-row">
                    <button type="button" class="btn-primary" id="addWeightBtn">体重を登録</button>
                </div>
            </section>
        </section>

        <section id="listTab" class="tab-panel">
            <section class="card">
                <h2 id="tableTitle">期間中の記録一覧</h2>
                <div id="tableEmpty" class="empty-note">この期間の記録はまだありません。</div>
                <div class="table-wrap">
                    <table id="recordTable">
                        <thead>
                            <tr>
                                <th id="thDate">日にち</th>
                                <th id="thPeriod">時間帯</th>
                                <th id="thWeight">体重(kg)</th>
                                <th id="thGain">開始からの増加</th>
                                <th id="thEdit">編集</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <div id="editDialog" class="dialog-backdrop">
        <div class="dialog-panel">
            <h2 id="editDialogTitle" class="dialog-title">記録を編集</h2>
            <div class="field-grid">
                <div class="field">
                    <label for="editWeightDate" id="editLabelWeightDate">日にち</label>
                    <input type="text" id="editWeightDate">
                </div>
                <div class="field">
                    <label for="editWeightPeriod" id="editLabelWeightPeriod">測定タイミング</label>

                        <option value="3" id="editPeriodEvening">晩</option>

                <div class="field">
                    <label for="editWeightValue" id="editLabelWeightValue">体重(kg)</label>

                </div>
            </div>
            <div class="dialog-actions">
                <button type="button" class="dialog-btn save" id="saveEditBtn">保存</button>
                <button type="button" class="dialog-btn cancel" id="cancelEditBtn">キャンセル</button>

        function getMeta() {
            try {
                const raw = localStorage.getItem(PERIOD_META_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                return {};
            }
        }

        function saveMeta(meta) {
            localStorage.setItem(PERIOD_META_KEY, JSON.stringify(meta));
        }

        function tx(key, langCode) {
            const rawCode = langCode || selectedUiLang;
            const code = rawCode === "ja" ? "ja" : resolveI18nLang(rawCode);
            try {
                return i18next.getFixedT(code, "translation")(key);
            } catch (e) {
                return key;
            }
        }

        function template(str, vars) {
            return String(str).replace(/\{(\w+)\}/g, function (_, key) {
                return vars && vars[key] != null ? String(vars[key]) : "";
            });
        }

        function bt(key) {
            const ja = tx(key, "ja");
            if (selectedUiLang === "ja") return ja;
            return ja + " / " + tx(key, selectedUiLang);
        }

        function btTemplate(key, vars) {
            const ja = template(tx(key, "ja"), vars);
            if (selectedUiLang === "ja") return ja;
            return ja + " / " + template(tx(key, selectedUiLang), vars);
        }

        function resolveI18nLang(langCode) {
            if (langCode === "ja") return "ja";
            if (langCode === "zh") return "zh";
            return "en-US";
        }

        async function initI18n(langCode) {
            const resolved = resolveI18nLang(langCode);
            await i18next
                .use(i18nextHttpBackend)
                .init({
                    lng: resolved,
                    fallbackLng: "ja",
                    ns: ["translation"],
                    defaultNS: "translation",
                    load: "currentOnly",
                    backend: {
                        loadPath: "./i18n/{{lng}}.json"
                    },
                    interpolation: {
                        escapeValue: false
                    }
                });
        }

        function isSupportedLang(code) {
            return code === "ja" || LANGUAGE_OPTIONS.some(function (item) {
                return item.code === code;
            });
        }

        function normalizeLangToUi(lang) {
            const l = String(lang || "ja").toLowerCase();
            if (l.startsWith("zh")) return "zh";
            if (l.startsWith("fr")) return "fr";
            if (l.startsWith("ko")) return "ko";
            if (l.startsWith("pt")) return "pr";
            if (l.startsWith("tl")) return "tl";
            if (l.startsWith("vi")) return "ve";
            if (l.startsWith("th")) return "th";
            if (l.startsWith("de")) return "de";
            if (l.startsWith("id")) return "id";
            if (l.startsWith("ru")) return "ru";
            if (l.startsWith("ne")) return "ne";
            if (l.startsWith("lo")) return "lo";
            if (l.startsWith("uk")) return "uk";
            if (l.startsWith("fa")) return "fa-AF";
            if (l.startsWith("si")) return "si";
            if (l.startsWith("ms")) return "ms";
            if (l.startsWith("my")) return "my";
            if (l.startsWith("bn")) return "bn";
            if (l.startsWith("ur")) return "ur";
            if (l.startsWith("en")) return "en-US";
            return "ja";
        }

        function renderLanguageOptions() {
            const list = document.getElementById("languageOptionList");
            list.innerHTML = "";

            const jaBtn = document.createElement("button");
            jaBtn.type = "button";
            jaBtn.className = "language-option-btn" + (selectedUiLang === "ja" ? " active" : "");
            jaBtn.textContent = "やさしい日本語 / Japanese";
            jaBtn.onclick = function () {
                setLanguage("ja");
            };
            list.appendChild(jaBtn);

            LANGUAGE_OPTIONS.forEach(function (lang) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "language-option-btn" + (selectedUiLang === lang.code ? " active" : "");
                btn.textContent = lang.label;
                btn.onclick = function () {
                    setLanguage(lang.code);
                };
                list.appendChild(btn);
            });
        }

        async function setLanguage(langCode) {
            selectedUiLang = isSupportedLang(langCode) ? langCode : "ja";
            localStorage.setItem(LANG_STORAGE_KEY, selectedUiLang);
            await i18next.changeLanguage(resolveI18nLang(selectedUiLang));
            applyI18n();
            renderLanguageOptions();
            closeSettingsDialog();
        }

        function switchTab(tabId, event) {
            document.querySelectorAll(".tab-panel").forEach(function (panel) {
                panel.classList.remove("active");
            });
            document.querySelectorAll(".tab-button").forEach(function (button) {
                button.classList.remove("active");
            });
            const nextPanel = document.getElementById(tabId);
            if (nextPanel) nextPanel.classList.add("active");
            if (event && event.currentTarget) event.currentTarget.classList.add("active");
            if (tabId === "overviewTab") {
                chart.resize();
                chart.update();
            }

        function formatDateTime(date, period) {
            return date + " " + (PERIOD_TIME[String(period)] || "06:00");
        }

        function parseDateOnly(value) {
            return new Date(String(value) + "T00:00:00");
        }

        function formatDateJP(value) {
            if (!value) return "-";
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return String(value);
            return (d.getMonth() + 1) + "/" + d.getDate();
        }

        function formatWeight(value) {
            return Number.isFinite(value) ? value.toFixed(1) + " kg" : "-";
        }

        function sortWeightData(items) {
            return (items || []).slice().sort(function (a, b) {
                return new Date(String(a.datetime || "")).getTime() - new Date(String(b.datetime || ""))
                    .getTime();
            });
        }

        function getFilteredRecords() {
            const meta = getMeta();
            const start = meta.startDate ? parseDateOnly(meta.startDate).getTime() : null;
            const end = meta.endDate ? parseDateOnly(meta.endDate).getTime() : null;

            return sortWeightData(allData).filter(function (item) {
                const datePart = String(item.datetime || "").split(" ")[0];
                const time = parseDateOnly(datePart).getTime();
                if (!Number.isFinite(start) || !Number.isFinite(end)) return false;
                return start <= time && time <= end;
            });
        }

        function createTablePage() {
            renderTable();
        }

        function populateTable() {
            renderTable();
        }

        async function setallData() {
            await reloadWeightData();
        }

        function updateChart(data) {
            var meta = data
            if (window.IS_TEST_MODE) {
                meta = getMeta();
            }
            console.log(meta)
            const records = getFilteredRecords();
            const goalPoints = [];

            if (meta.startDate && meta.endDate && Number.isFinite(meta.startWeightKg) && Number.isFinite(meta
                    .targetGainKg)) {
                goalPoints.push({
                    x: new Date(meta.startDate + "T00:00:00"),
                    y: meta.startWeightKg
                });
                goalPoints.push({
                    x: new Date(meta.endDate + "T00:00:00"),
                    y: meta.startWeightKg + meta.targetGainKg
                });
            }

            chart.data.datasets[0].data = records.map(function (item) {
                return {
                    x: new Date(item.datetime),
                    y: Number(item.weight)
                };
            });
            chart.data.datasets[1].data = goalPoints;
            chart.update();
            renderSummary();
        }

        function renderSummary() {
            const meta = getMeta();
            const records = getFilteredRecords();
            const latest = records.length ? records[records.length - 1] : null;
            const startWeight = Number(meta.startWeightKg);
            const targetGain = Number(meta.targetGainKg);
            const targetWeight = Number.isFinite(startWeight) && Number.isFinite(targetGain) ? startWeight +
                targetGain : null;
            const currentWeight = latest ? Number(latest.weight) : null;
            const currentGain = Number.isFinite(currentWeight) && Number.isFinite(startWeight) ? currentWeight -
                startWeight : null;
            const remaining = Number.isFinite(targetWeight) && Number.isFinite(currentWeight) ? targetWeight -
                currentWeight : null;

            document.getElementById("summaryPeriod").textContent = meta.startDate && meta.endDate ? meta.startDate +
                " - " + meta.endDate : "-";
            document.getElementById("summaryStartWeight").textContent = formatWeight(startWeight);
            document.getElementById("summaryLatestWeight").textContent = formatWeight(currentWeight);
            document.getElementById("summaryCurrentGain").textContent = Number.isFinite(currentGain) ? currentGain
                .toFixed(1) + " kg" : "-";
            document.getElementById("summaryTargetWeight").textContent = formatWeight(targetWeight);
            document.getElementById("summaryRemaining").textContent = Number.isFinite(remaining) ? remaining.toFixed(
                1) + " kg" : "-";

            const progressFill = document.getElementById("gainProgressFill");
            const progressText = document.getElementById("gainProgressText");
            const statusNote = document.getElementById("statusNote");

            if (!meta.startDate || !meta.endDate || !Number.isFinite(startWeight) || !Number.isFinite(targetGain)) {
                progressFill.style.width = "0%";
                progressText.textContent = bt("progressNoPlan");
                statusNote.className = "status-note neutral";
                statusNote.textContent = bt("statusNeedPlan");
                return;
            }

            if (!records.length) {
                progressFill.style.width = "0%";
                progressText.textContent = bt("progressNoRecords");
                statusNote.className = "status-note neutral";
                statusNote.textContent = bt("statusNoRecords");
                return;
            }

            const pct = targetGain <= 0 ? 0 : Math.max(0, Math.min(100, (currentGain / targetGain) * 100));
            progressFill.style.width = pct + "%";
            progressText.textContent = btTemplate("progressCurrentAndGoal", {
                current: currentGain.toFixed(1),
                target: targetGain.toFixed(1)
            });

            if (currentGain < 0) {
                statusNote.className = "status-note warn";
                statusNote.textContent = bt("statusLosing");
            } else if (currentGain <= targetGain * 0.8) {
                statusNote.className = "status-note ok";
                statusNote.textContent = bt("statusOk");
            } else if (currentGain <= targetGain) {
                statusNote.className = "status-note warn";
                statusNote.textContent = bt("statusNearGoal");
            } else {
                statusNote.className = "status-note alert";
                statusNote.textContent = bt("statusOverGoal");
            }
        }

        function renderTable() {
            const meta = getMeta();
            const startWeight = Number(meta.startWeightKg);
            const records = getFilteredRecords();
            const body = document.querySelector("#recordTable tbody");
            const empty = document.getElementById("tableEmpty");
            body.innerHTML = "";

            if (!records.length) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";
            records.forEach(function (item) {
                const datePart = String(item.datetime).split(" ")[0];
                const timePart = String(item.datetime).split(" ")[1] || "06:00";
                const period = timePart === "12:00" ? "2" : (timePart === "18:00" ? "3" : "1");
                const gain = Number.isFinite(startWeight) ? Number(item.weight) - startWeight : null;
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${datePart}</td>
                    <td>${period === "1" ? bt("morning") : period === "2" ? bt("noon") : bt("evening")}</td>
                    <td class="strong-num">${Number(item.weight).toFixed(1)}</td>
                    <td class="strong-num">${Number.isFinite(gain) ? (gain >= 0 ? "+" : "") + gain.toFixed(1) + " kg" : "-"}</td>
                    <td><button type="button" class="edit-btn" data-datetime="${item.datetime}">${bt("editBtn")}</button></td>
                `;
                body.appendChild(row);
            });

            body.querySelectorAll(".edit-btn").forEach(function (button) {
                button.addEventListener("click", function () {
                    openEditDialog(this.dataset.datetime);
                });
            });
        }

        function openEditDialog(datetime) {
            const item = allData.find(function (entry) {
                return String(entry.datetime) === String(datetime);
            });
            if (!item) return;

            editingDatetime = datetime;
            const datePart = String(item.datetime).split(" ")[0];
            const timePart = String(item.datetime).split(" ")[1] || "06:00";
            const period = timePart === "12:00" ? "2" : (timePart === "18:00" ? "3" : "1");
            document.getElementById("editWeightDate").value = datePart;
            document.getElementById("editWeightPeriod").value = period;
            document.getElementById("editWeightValue").value = Number(item.weight).toFixed(1);
            document.getElementById("editDialog").style.display = "flex";
        }

        function closeEditDialog() {
            document.getElementById("editDialog").style.display = "none";
            editingDatetime = "";
        }

        async function reloadWeightData() {
            await loadData(token, "weight", {});
            allData = sortWeightData(Array.isArray(allData) ? allData : []);
            renderTable();
            renderSummary();
            updateChart();
        }

        function loadMetaToForm() {
            const meta = getMeta();
            document.getElementById("periodStartDate").value = meta.startDate || "";
            document.getElementById("startWeightKg").value = Number.isFinite(meta.startWeightKg) ? meta.startWeightKg :
                "";
            document.getElementById("targetEndDate").value = meta.endDate || "";
            document.getElementById("targetGainKg").value = Number.isFinite(meta.targetGainKg) ? meta.targetGainKg : "";
        }

        async function savePlan() {
            const startDate = document.getElementById("periodStartDate").value;
            const startWeightKg = parseFloat(document.getElementById("startWeightKg").value);
            const endDate = document.getElementById("targetEndDate").value;
            const targetGainKg = parseFloat(document.getElementById("targetGainKg").value);

            if (!startDate || !endDate || !Number.isFinite(startWeightKg) || !Number.isFinite(targetGainKg)) {
                alert(bt("promptFillPlan"));
                return;
            }
            if (parseDateOnly(endDate).getTime() < parseDateOnly(startDate).getTime()) {
                alert(bt("promptInvalidDate"));
                return;
            }

            saveMeta({
                startDate: startDate,
                startWeightKg: Number(startWeightKg.toFixed(1)),
                endDate: endDate,
                targetGainKg: Number(targetGainKg.toFixed(1))
            });
            renderSummary();
            renderTable();
            updateChart();
            alert(bt("promptPlanSaved"));
            switchTab("overviewTab", {
                currentTarget: document.getElementById("tabOverview")
            });
        }

        async function addWeightRecord() {
            const date = document.getElementById("weightDate").value;
            const period = document.getElementById("weightPeriod").value;
            const weight = parseFloat(document.getElementById("weightValue").value);

            if (!date || !period || !Number.isFinite(weight)) {
                alert(bt("promptFillWeight"));
                return;
            }

            const saveWeight = (typeof setWeight === "function") ? setWeight : ((payload) => addData(payload, "weight"));
            await saveWeight({
                datetime: formatDateTime(date, period),
                weight: Number(weight.toFixed(1))
            });

            document.getElementById("weightValue").value = "";
            await reloadWeightData();
            switchTab("overviewTab", {
                currentTarget: document.getElementById("tabOverview")
            });
        }

        async function saveEditedRecord() {
            const date = document.getElementById("editWeightDate").value;
            const period = document.getElementById("editWeightPeriod").value;
            const weight = parseFloat(document.getElementById("editWeightValue").value);

            if (!editingDatetime || !date || !period || !Number.isFinite(weight)) {
                alert(bt("promptFillEdit"));
                return;
            }

            const olddata = {
                datetime: editingDatetime
            };
            const newdata = {
                datetime: formatDateTime(date, period),
                weight: Number(weight.toFixed(1))
            };

            if (olddata.datetime === newdata.datetime) {
                const updateWeight = (typeof putData === "function") ? putData : ((payload, type) => addData(payload, type));
                await updateWeight(newdata, "weight");
            } else {
                await addData(newdata, "weight");
                await deleteData(olddata, "weight");
            }

            closeEditDialog();
            await reloadWeightData();
        }

        async function deleteEditedRecord() {
            if (!editingDatetime) return;
            await deleteData({
                datetime: editingDatetime
            }, "weight");
            closeEditDialog();
            await reloadWeightData();
        }

        function initPickers() {
            $("#periodStartDate").datepicker({
                dateFormat: "yy-mm-dd"
            });
            $("#targetEndDate").datepicker({
                dateFormat: "yy-mm-dd"
            });
            $("#weightDate").datepicker({
                dateFormat: "yy-mm-dd"
            });
            $("#editWeightDate").datepicker({
                dateFormat: "yy-mm-dd"
            });
        }

        function setTodayDefaults() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, "0");
            const dd = String(today.getDate()).padStart(2, "0");
            const todayText = yyyy + "-" + mm + "-" + dd;
            if (!document.getElementById("periodStartDate").value) document.getElementById("periodStartDate").value =
                todayText;
            if (!document.getElementById("weightDate").value) document.getElementById("weightDate").value = todayText;
        }

        function bindEvents() {
            document.getElementById("savePlanBtn").addEventListener("click", savePlan);
            document.getElementById("addWeightBtn").addEventListener("click", addWeightRecord);
            document.getElementById("saveEditBtn").addEventListener("click", saveEditedRecord);
            document.getElementById("cancelEditBtn").addEventListener("click", closeEditDialog);
            document.getElementById("deleteEditBtn").addEventListener("click", deleteEditedRecord);
            document.getElementById("editDialog").addEventListener("click", function (event) {
                if (event.target.id === "editDialog") closeEditDialog();
            });
            document.getElementById("settingsDialog").addEventListener("click", function (event) {
                if (event.target.id === "settingsDialog") closeSettingsDialog();
            });
        }

        function startWeightApp(idToken) {
            token = idToken;
            if (typeof changeLanguage === "function") {
                changeLanguage("ja");
            }
            reloadWeightData().catch(function (error) {
                console.error("initial weight load error:", error);
            });
        }

        function bootWeightApp() {
            if (window.IS_TEST_MODE) {
                startWeightApp("TEST_ID_TOKEN");
                return;
            }

            liff.init({
                liffId: LIFF_ID,
                withLoginOnExternalBrowser: true
            }).then(() => {
                const idToken = liff.getIDToken();
                const lang = typeof liff.getAppLanguage === "function" ? liff.getAppLanguage() : "en";
                if (!isSupportedLang(localStorage.getItem(LANG_STORAGE_KEY))) {
                    selectedUiLang = normalizeLangToUi(lang);
                    localStorage.setItem(LANG_STORAGE_KEY, selectedUiLang);
                    renderLanguageOptions();
                    applyI18n();
                }
                startWeightApp(idToken);
            }).catch(() => {
                alert("LIFF init failed.");
            });
        }

        async function boot() {
            const initialSavedLang = localStorage.getItem(LANG_STORAGE_KEY);
            selectedUiLang = isSupportedLang(initialSavedLang) ? initialSavedLang : normalizeLangToUi(navigator
                .language);
            localStorage.setItem(LANG_STORAGE_KEY, selectedUiLang);
            await initI18n(selectedUiLang);
            renderLanguageOptions();
            applyI18n();
            loadMetaToForm();
            initPickers();
            setTodayDefaults();
            bindEvents();
            bootWeightApp();
        }

        boot().catch(function (error) {
            console.error(error);
            alert("error");
        });
    </script>
</body>

</html>
