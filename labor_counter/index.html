<body>
    <div id="header-container" class="header-wrapper"></div>
    <div class="loader is-hidden" id="loadingOverlay" aria-hidden="true">
        <div class="spinner"></div>
    </div>

    <main>
        <article class="main-container labor-counter-app">
            <h1 class="page-title" id="pageTitle">陣痛カウンター</h1>
            <p class="page-lead" id="pageLead">「測定開始」を押してから、痛みが始まったら「陣痛」、おさまったら「おさまった」を押してください。最後に「測定終了」で1つの記録になります。</p>

            <section class="timer-panel" aria-live="polite">
                <div class="timer-label" id="timerStateLabel">待機中</div>
                <div class="timer-value" id="activeTimer">00:00</div>
                <div class="timer-sub" id="lastIntervalText">前回からの間隔: -</div>
                <div class="counter-actions">
                    <button type="button" id="startMeasurementBtn" class="main-action start">測定開始</button>
                    <button type="button" id="contractionBtn" class="main-action pain" disabled>陣痛</button>
                    <button type="button" id="settledBtn" class="main-action settled" disabled>おさまった</button>
                    <button type="button" id="endMeasurementBtn" class="main-action stop" disabled>測定終了</button>
                </div>
            </section>

            <section class="records-section">
                <div class="records-header">
                    <h2 id="recordsTitle">記録</h2>
                    <div class="record-actions">
                        <button type="button" id="deleteSelectedBtn" class="icon-action-btn" aria-label="選択した記録を削除">
                            <iconify-icon icon="material-symbols:delete-outline-rounded" width="20" height="20"></iconify-icon>
                        </button>
                    </div>
                </div>
                <p id="emptyText" class="empty-text">まだ記録はありません。</p>
                <div id="timelineList" class="timeline-list"></div>
            </section>
        </article>
    </main>

        function templateText(text, vars) {
            return String(text || "").replace(/\{(\w+)\}/g, function (_, key) {
                return vars && vars[key] != null ? String(vars[key]) : "";
            });
        }

        function t(key, vars) {
            const table = LABOR_TEXT[state.lang] || LABOR_TEXT["en-US"];
            return templateText(table[key] || LABOR_TEXT["en-US"][key] || LABOR_TEXT.ja[key] || key, vars);
        }

        function normalizeLaborLang(lang) {
            const raw = String(lang || "ja").toLowerCase();
            if (raw === "soft" || raw.startsWith("easy") || raw.startsWith("simple")) return "soft";
            if (raw.startsWith("en")) return "en-US";
            if (raw.startsWith("pt")) return "pr";
            if (raw.startsWith("vi")) return "ve";
            if (raw.startsWith("fa") || raw.startsWith("prs")) return "fa-AF";
            if (raw.startsWith("zh")) return "zh";
            if (raw.startsWith("fr")) return "fr";
            if (raw.startsWith("ko")) return "ko";
            if (raw.startsWith("tl")) return "tl";
            if (raw.startsWith("th")) return "th";
            if (raw.startsWith("de")) return "de";
            if (raw.startsWith("id")) return "id";
            if (raw.startsWith("ru")) return "ru";
            if (raw.startsWith("ne")) return "ne";
            if (raw.startsWith("lo")) return "lo";
            if (raw.startsWith("uk")) return "uk";
            if (raw.startsWith("si")) return "si";
            if (raw.startsWith("ms")) return "ms";
            if (raw.startsWith("my")) return "my";
            if (raw.startsWith("bn")) return "bn";
            if (raw.startsWith("ur")) return "ur";
            return "ja";
        }

        function applyLaborLanguage(lang) {
            state.lang = normalizeLaborLang(lang);
            document.documentElement.lang = state.lang === "en-US" ? "en" : state.lang;
            document.title = t("pageTitle");
            document.getElementById("pageTitle").textContent = t("pageTitle");
            document.getElementById("pageLead").textContent = t("pageLead");
            document.getElementById("startMeasurementBtn").textContent = t("startMeasurement");
            document.getElementById("contractionBtn").textContent = t("contraction");
            document.getElementById("settledBtn").textContent = t("settled");
            document.getElementById("endMeasurementBtn").textContent = t("endMeasurement");
            document.getElementById("recordsTitle").textContent = t("records");
            document.getElementById("deleteSelectedBtn").setAttribute("aria-label", t("deleteSelected"));
            document.getElementById("emptyText").textContent = t("empty");
            if (!state.activeSession && !state.records.length) {
                document.getElementById("lastIntervalText").textContent = t("previousRest");
            }
            setActiveUi();
            render();
        }

        function showAppBusy() {
            const loader = document.getElementById("loadingOverlay");
            loader.classList.remove("is-hidden");
            loader.style.display = "grid";
            loader.setAttribute("aria-hidden", "false");
        }

        function hideAppBusy() {
            const loader = document.getElementById("loadingOverlay");
            loader.classList.add("is-hidden");
            loader.style.display = "none";
            loader.setAttribute("aria-hidden", "true");
        }

        function loadHeader() {
            return new Promise((resolve, reject) => {
                let settled = false;
                const finish = () => {
                    if (settled) return;
                    settled = true;
                    resolve();
                };
                const fail = (error) => {
                    if (settled) return;
                    settled = true;
                    reject(error);
                };
                const timer = setTimeout(finish, 3000);
                $("#header-container").load("../common/header.html", function (_responseText, status) {
                    if (status === "error") {
                        clearTimeout(timer);
                        fail(new Error("Failed to load header.html"));
                        return;
                    }
                    document.addEventListener("i18n-initialized", function () {
                        clearTimeout(timer);
                        finish();
                    }, {
                        once: true
                    });
                    $.getScript("../common/js/header.js").fail(function () {
                        clearTimeout(timer);
                        fail(new Error("Failed to load header.js"));
                    });
                });
            });
        }

        function loadLocalRecords() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                state.records = normalizeStoredRecords(parsed);
            } catch (error) {
                state.records = [];
            }
        }

        function saveLocalRecords() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
        }

        function pad(value) {
            return String(value).padStart(2, "0");
        }

        function formatClock(dateString) {
            const date = new Date(dateString);
            if (Number.isNaN(date.getTime())) return "-";
            return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function formatSeconds(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return "-";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${pad(min)}:${pad(sec)}`;
        }

        function formatDurationJa(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return "-";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            if (min <= 0) return t("sec", { value: sec });
            return t("minSec", { min: min, sec: pad(sec) });
        }

        function normalizeOptionalSeconds(value) {
            const number = Number(value);
            return Number.isFinite(number) && number >= 0 ? number : null;
        }

        function formatOptionalDurationJa(value) {
            const seconds = normalizeOptionalSeconds(value);
            return seconds === null ? "-" : formatDurationJa(seconds);
        }

        function apiOptionalSeconds(value) {
            const seconds = normalizeOptionalSeconds(value);
            return seconds === null ? "" : seconds;
        }

        function apiRequiredSeconds(value) {
            const seconds = normalizeOptionalSeconds(value);
            return seconds === null ? 0 : seconds;
        }

        function formatRecordDate(dateString) {
            const date = new Date(dateString);
            if (Number.isNaN(date.getTime())) return "";
            return t("dateLabel", {
                year: date.getFullYear(),
                month: date.getMonth() + 1,
                day: date.getDate()
            });
        }

        function createLocalId(prefix) {
            return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function decodeIdTokenUserId(idToken) {
            try {
                const payload = String(idToken || "").split(".")[1];
                if (!payload) return "";
                const normalized = payload.replace(/-/g, "+").replace(/_/g, "/");
                const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
                const decoded = JSON.parse(decodeURIComponent(escape(atob(padded))));
                return decoded.sub || decoded.userId || "";
            } catch (error) {
                console.warn("Failed to decode LIFF ID token:", error);
                return "";
            }
        }

        function resolveLiffUserId() {
            const decoded = typeof liff.getDecodedIDToken === "function" ? liff.getDecodedIDToken() : null;
            return Promise.resolve(typeof liff.getProfile === "function" ? liff.getProfile() : null)
                .catch(() => null)
                .then((profile) => {
                    state.userId = profile && profile.userId
                        ? profile.userId
                        : (decoded && (decoded.sub || decoded.userId)) || decodeIdTokenUserId(state.idToken) || "";
                    window.userId = state.userId;
                    return state.userId;
                });
        }

        function normalizeStoredRecords(items) {
            return (Array.isArray(items) ? items : []).map((item) => {
                if (Array.isArray(item.contractionsJson)) {
                    item = Object.assign({}, item, {
                        contractions: item.contractionsJson,
                        saved: true
                    });
                }
                if (Array.isArray(item.contractions)) {
                    const normalized = Object.assign({
                        localId: createLocalId("session"),
                        contractions: [],
                        saved: false
                    }, item);
                    normalized.contractions = normalized.contractions.map((record) => Object.assign({}, record, {
                        localId: record.localId || createLocalId("contraction"),
                        durationSeconds: normalizeOptionalSeconds(record.durationSeconds),
                        intervalSeconds: normalizeOptionalSeconds(record.intervalSeconds),
                        restSeconds: normalizeOptionalSeconds(record.restSeconds)
                    }));
                    normalized.contractionCount = normalized.contractions.length;
                    return normalized;
                }
                const startedAt = item.startedAt || "";
                const endedAt = item.endedAt || startedAt;
                return {
                    localId: item.localId || createLocalId("session"),
                    itemId: item.itemId || "",
                    startedAt: startedAt,
                    endedAt: endedAt,
                    sessionDurationSeconds: Math.max(0, Math.round((new Date(endedAt).getTime() - new Date(startedAt).getTime()) / 1000)),
                    contractions: [{
                        localId: createLocalId("contraction"),
                        startedAt: startedAt,
                        endedAt: endedAt,
                        durationSeconds: normalizeOptionalSeconds(item.durationSeconds),
                        intervalSeconds: normalizeOptionalSeconds(item.intervalSeconds),
                        restSeconds: normalizeOptionalSeconds(item.restSeconds)
                    }],
                    saved: Boolean(item.saved)
                };
            });
        }

        function buildContraction(start, end, session) {
            const previous = session.contractions[session.contractions.length - 1];
            const durationSeconds = Math.max(0, Math.round((end.getTime() - start.getTime()) / 1000));
            const intervalSeconds = previous ? Math.max(0, Math.round((start.getTime() - new Date(previous.startedAt).getTime()) / 1000)) : null;
            const restSeconds = previous ? Math.max(0, Math.round((start.getTime() - new Date(previous.endedAt).getTime()) / 1000)) : null;
            return {
                localId: createLocalId("contraction"),
                startedAt: start.toISOString(),
                endedAt: end.toISOString(),
                durationSeconds: durationSeconds,
                intervalSeconds: intervalSeconds,
                restSeconds: restSeconds
            };
        }

        function average(values) {
            const filtered = values.map(normalizeOptionalSeconds).filter((value) => Number.isFinite(value));
            if (!filtered.length) return null;
            return filtered.reduce((sum, value) => sum + value, 0) / filtered.length;
        }

        function render() {
            const list = document.getElementById("timelineList");
            const empty = document.getElementById("emptyText");
            list.innerHTML = "";

            let currentDateLabel = "";
            const visibleSessions = state.activeSession ? state.records.concat([Object.assign({}, state.activeSession, {
                endedAt: "",
                isActive: true,
                sessionDurationSeconds: Math.max(0, Math.round((Date.now() - new Date(state.activeSession.startedAt).getTime()) / 1000))
            })]) : state.records;
            visibleSessions.slice().reverse().forEach((session, index) => {
                const contractions = Array.isArray(session.contractions) ? session.contractions : [];
                const displayContractions = contractions.slice();
                if (session.isActive && !state.painStart && displayContractions.length) {
                    const lastIndex = displayContractions.length - 1;
                    const lastRecord = displayContractions[lastIndex];
                    displayContractions[lastIndex] = Object.assign({}, lastRecord, {
                        currentRestSeconds: Math.max(0, Math.round((Date.now() - new Date(lastRecord.endedAt).getTime()) / 1000))
                    });
                }
                if (session.isActive && state.painStart) {
                    const previous = contractions[contractions.length - 1];
                    displayContractions.push({
                        localId: "active-pain",
                        startedAt: state.painStart.toISOString(),
                        endedAt: "",
                        durationSeconds: Math.max(0, Math.round((Date.now() - state.painStart.getTime()) / 1000)),
                        intervalSeconds: contractions.length ? Math.max(0, Math.round((state.painStart.getTime() - new Date(contractions[contractions.length - 1].startedAt).getTime()) / 1000)) : null,
                        restSeconds: previous ? Math.max(0, Math.round((state.painStart.getTime() - new Date(previous.endedAt).getTime()) / 1000)) : null,
                        isActive: true
                    });
                }
                const dateLabel = formatRecordDate(session.startedAt);
                if (dateLabel && dateLabel !== currentDateLabel) {
                    currentDateLabel = dateLabel;
                    const heading = document.createElement("h3");
                    heading.className = "timeline-date";
                    heading.textContent = dateLabel;
                    list.appendChild(heading);
                }
                const item = document.createElement("div");
                item.className = "session-item" + (session.isActive ? " is-active" : "");
                item.innerHTML = `
                    <div class="session-header">
                        <label class="timeline-check">
                            ${session.isActive ? `<span class="active-session-mark">${t("activeBadge")}</span>` : `<input type="checkbox" class="record-check" value="${session.localId}" aria-label="${t("selectRecord", { time: formatClock(session.startedAt) })}">`}
                        </label>
                        <div class="session-main">
                            <div class="timeline-time">${formatClock(session.startedAt)} - ${session.isActive ? t("activeEnd") : formatClock(session.endedAt)}</div>
                            <div class="timeline-duration">${t("sessionLine", { duration: formatDurationJa(session.sessionDurationSeconds), count: displayContractions.length })}</div>
                        </div>
                    </div>
                    <dl class="session-summary">
                        <div>
                            <dt>${t("summaryMeasurementCount")}</dt>
                            <dd>${t("oneTime")}</dd>
                        </div>
                        <div>
                            <dt>${t("summaryContractionCount")}</dt>
                            <dd>${t("countTimes", { count: displayContractions.length })}</dd>
                        </div>
                        <div>
                            <dt>${t("summaryAverageRest")}</dt>
                            <dd>${formatSeconds(average(displayContractions.map((record) => record.currentRestSeconds ?? record.restSeconds)))}</dd>
                        </div>
                        <div>
                            <dt>${t("summaryAverageDuration")}</dt>
                            <dd>${formatSeconds(average(displayContractions.map((record) => record.durationSeconds)))}</dd>
                        </div>
                    </dl>
                    <div class="contraction-list">
                        ${displayContractions.map((record, contractionIndex) => `
                            <div class="contraction-row${record.isActive ? " is-active" : ""}">
                                <span class="contraction-index">${contractionIndex + 1}</span>
                                <span class="contraction-time">${formatClock(record.startedAt)}</span>
                                <span class="contraction-duration">${record.isActive ? t("activePainPrefix") : t("durationPrefix")} ${formatOptionalDurationJa(record.durationSeconds)}</span>
                                <span class="contraction-interval ${index < 3 ? "is-recent" : ""}">${t("restPrefix")} ${formatOptionalDurationJa(record.currentRestSeconds ?? record.restSeconds)}</span>
                            </div>
                        `).join("")}
                    </div>
                `;
                list.appendChild(item);
            });

            empty.style.display = visibleSessions.length ? "none" : "block";
            list.style.display = visibleSessions.length ? "block" : "none";
            const activeLast = state.activeSession && state.activeSession.contractions.length ? state.activeSession.contractions[state.activeSession.contractions.length - 1] : null;
            const lastSession = state.records[state.records.length - 1];
            const lastContractions = lastSession ? lastSession.contractions || [] : [];
            const last = activeLast || lastContractions[lastContractions.length - 1];
            const currentRest = state.activeSession && !state.painStart && activeLast ? Math.max(0, Math.round((Date.now() - new Date(activeLast.endedAt).getTime()) / 1000)) : null;
            document.getElementById("lastIntervalText").textContent = t("currentRest", {
                value: Number.isFinite(currentRest) ? formatSeconds(currentRest) : (last ? formatSeconds(last.restSeconds) : "-")
            });
        }

        function updateActiveTimer() {
            if (!state.activeSession) {
                document.getElementById("activeTimer").textContent = "00:00";
                return;
            }
            const contractions = state.activeSession.contractions || [];
            const lastContraction = contractions[contractions.length - 1];
            const start = state.painStart || (lastContraction ? new Date(lastContraction.endedAt) : new Date(state.activeSession.startedAt));
            const elapsed = Math.max(0, Math.round((Date.now() - start.getTime()) / 1000));
            document.getElementById("activeTimer").textContent = formatSeconds(elapsed);
            if (state.activeSession) {
                render();
            }
        }

        function setActiveUi() {
            const hasSession = Boolean(state.activeSession);
            const hasPain = Boolean(state.painStart);
            const hasContractions = hasSession && state.activeSession.contractions.length > 0;
            document.getElementById("timerStateLabel").textContent = !hasSession ? t("waiting") : (hasPain ? t("activePain") : (hasContractions ? t("intervalMeasuring") : t("measuring")));
            document.querySelector(".counter-actions").classList.toggle("is-measuring", hasSession);
            document.getElementById("startMeasurementBtn").disabled = hasSession;
            document.getElementById("contractionBtn").disabled = !hasSession || hasPain;
            document.getElementById("settledBtn").disabled = !hasPain;
            document.getElementById("endMeasurementBtn").disabled = !hasSession;
        }

        function startMeasurement() {
            const now = new Date();
            state.activeSession = {
                localId: createLocalId("session"),
                startedAt: now.toISOString(),
                endedAt: "",
                sessionDurationSeconds: 0,
                contractions: [],
                saved: false
            };
            state.painStart = null;
            setActiveUi();
            updateActiveTimer();
            state.timerId = setInterval(updateActiveTimer, 1000);
        }

        function startContraction() {
            if (!state.activeSession || state.painStart) return;
            state.painStart = new Date();
            const previous = state.activeSession.contractions[state.activeSession.contractions.length - 1];
            if (previous) {
                previous.restSeconds = Math.max(0, Math.round((state.painStart.getTime() - new Date(previous.endedAt).getTime()) / 1000));
            }
            setActiveUi();
            updateActiveTimer();
            render();
        }

        function stopContraction() {
            if (!state.activeSession || !state.painStart) return;
            const record = buildContraction(state.painStart, new Date(), state.activeSession);
            state.painStart = null;
            state.activeSession.contractions.push(record);
            setActiveUi();
            updateActiveTimer();
            render();
        }

        function endMeasurement() {
            if (!state.activeSession) return;
            if (state.painStart) {
                stopContraction();
            }
            if (!state.activeSession.contractions.length && !confirm(t("noContractionConfirm"))) return;
            const endedAt = new Date();
            state.activeSession.endedAt = endedAt.toISOString();
            state.activeSession.sessionDurationSeconds = Math.max(0, Math.round((endedAt.getTime() - new Date(state.activeSession.startedAt).getTime()) / 1000));
            const lastContraction = state.activeSession.contractions[state.activeSession.contractions.length - 1];
            if (lastContraction) {
                lastContraction.restSeconds = Math.max(0, Math.round((endedAt.getTime() - new Date(lastContraction.endedAt).getTime()) / 1000));
            }
            const completedSession = state.activeSession;
            state.records.push(completedSession);
            state.activeSession = null;
            state.painStart = null;
            clearInterval(state.timerId);
            state.timerId = null;
            saveLocalRecords();
            setActiveUi();
            updateActiveTimer();
            render();
            saveLaborSessionToApi(completedSession);
        }

        function requestLaborApi(method, postData, options) {
            const silent = options && options.silent;
            if (!state.userId) {
                console.warn("labor_counter API skipped: missing userId");
                return Promise.resolve(null);
            }
            const requestPostData = Object.assign({}, postData || {});
            if (!silent) showAppBusy();
            return $.ajax({
                url: API_URL,
                type: "POST",
                dataType: "json",
                timeout: 30000,
                data: JSON.stringify({
                    path: "myLabor",
                    method: method,
                    idToken: state.idToken,
                    userId: state.userId || "",
                    lang: window.normalizedLanguageCode || state.lang || "",
                    postData: requestPostData
                })
            }).then(function (response) {
                if (response.statusCode === 401) {
                    liff.logout();
                    window.location.reload();
                    return null;
                }
                if (response.statusCode !== 200) {
                    const message = response.message || "";
                    if (!(silent && method === "get" && message === "Hospital account is not linked")) {
                        console.warn("labor_counter API rejected the request:", message || response);
                    }
                    if (!silent) alert(response.message || t("saveFailed"));
                    return null;
                }
                return response.data || {};
            }, function (_xhr, textStatus, errorThrown) {
                console.warn("labor_counter API is not ready or network failed.", textStatus, errorThrown);
                return null;
            }).always(function () {
                if (!silent) hideAppBusy();
            });
        }

        function buildLaborPayload(session) {
            const contractions = (session.contractions || []).map((record) => ({
                startedAt: record.startedAt,
                endedAt: record.endedAt,
                durationSeconds: apiOptionalSeconds(record.durationSeconds),
                intervalSeconds: apiOptionalSeconds(record.intervalSeconds),
                restSeconds: apiOptionalSeconds(record.restSeconds)
            }));
            return {
                startedAt: session.startedAt,
                endedAt: session.endedAt,
                sessionDurationSeconds: apiRequiredSeconds(session.sessionDurationSeconds),
                contractionCount: contractions.length,
                averageRestSeconds: apiRequiredSeconds(average(contractions.map((record) => record.restSeconds))),
                averageDurationSeconds: apiRequiredSeconds(average(contractions.map((record) => record.durationSeconds))),
                contractionsJson: contractions
            };
        }

        function saveLaborSessionToApi(session) {
            return requestLaborApi("post", buildLaborPayload(session), { silent: true }).then(function (data) {
                if (!data || !data.itemId) return null;
                session.itemId = data.itemId;
                session.saved = true;
                saveLocalRecords();
                render();
                return data;
            });
        }

        function loadLaborRecordsFromApi() {
            return requestLaborApi("get", { unit: "month", limit: 1, page: 1 }, { silent: true }).then(function (data) {
                const apiItems = data && Array.isArray(data.items) ? normalizeStoredRecords(data.items) : null;
                if (!apiItems) return;
                const unsavedLocal = state.records.filter((record) => !record.saved && !record.itemId);
                state.records = apiItems.concat(unsavedLocal);
                saveLocalRecords();
                render();
            });
        }

        function clearRecords() {
            if (state.activeSession) {
                alert(t("cannotResetMeasuring"));
                return;
            }
            if (!state.records.length) return;
            if (!confirm(t("resetConfirm"))) return;
            state.records = [];
            saveLocalRecords();
            render();
        }

        async function deleteSelectedRecords() {
            const ids = Array.from(document.querySelectorAll(".record-check:checked")).map((checkbox) => checkbox.value);
            if (!ids.length) {
                alert(t("selectDelete"));
                return;
            }
            const selected = state.records.filter((session) => ids.includes(session.localId));
            const deleteResults = await Promise.all(selected.map((session) => {
                if (!session.itemId) return Promise.resolve({ session, ok: true });
                return requestLaborApi("delete", { itemId: session.itemId }, { silent: true }).then((data) => ({
                    session,
                    ok: Boolean(data)
                }));
            }));
            const deletableIds = deleteResults.filter((result) => result.ok).map((result) => result.session.localId);
            state.records = state.records.filter((session) => !deletableIds.includes(session.localId));
            saveLocalRecords();
            render();
        }

        function bindEvents() {
            document.getElementById("startMeasurementBtn").addEventListener("click", startMeasurement);
            document.getElementById("contractionBtn").addEventListener("click", startContraction);
            document.getElementById("settledBtn").addEventListener("click", stopContraction);
            document.getElementById("endMeasurementBtn").addEventListener("click", endMeasurement);
            document.getElementById("deleteSelectedBtn").addEventListener("click", deleteSelectedRecords);
            document.addEventListener("language-changed", function (event) {
                applyLaborLanguage(event && event.detail ? event.detail.langId : "ja");
            });
        }

        function bootLaborCounter() {
            showAppBusy();
            const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
            liff.init({
                liffId: LIFF_ID,
                withLoginOnExternalBrowser: !isDev
            }).then(() => {
                state.idToken = liff.getIDToken();
                return resolveLiffUserId();
            }).then(() => {
                loadLocalRecords();
                bindEvents();
                applyLaborLanguage(window.normalizedLanguageCode || (typeof liff.getAppLanguage === "function" ? liff.getAppLanguage() : navigator.language));
                loadLaborRecordsFromApi();
                return loadHeader();
            }).then(() => {
                applyLaborLanguage(window.normalizedLanguageCode || state.lang);
            }).then(() => {
                hideAppBusy();
            }).catch((error) => {
                console.error("LIFF init failed:", error);
                hideAppBusy();
                alert(t("liffInitFailed"));
            });
        }

        window.addEventListener("load", bootLaborCounter);
    </script>
</body>

</html>
