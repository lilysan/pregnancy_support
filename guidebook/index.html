            display: flex;

            gap: 12px;
            margin-top: 12px;
        }

        .guidebook-link {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            gap: 12px;
            align-items: center;
            color: var(--text);
            text-decoration: none;
        }

            display: inline-flex;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;

            outline-offset: 3px;
        }

        .guidebook-link-meta {
            margin: 0;
            line-height: 1.45;
        }

        .guidebook-link-title {
            font-weight: 700;
        }

        .guidebook-link-meta {
            color: var(--sub-text);
            font-size: 13px;
        }

        .guidebook-link-icon {
            color: var(--primary-dark);
        }

            .guidebook-link {
                grid-template-columns: 40px 1fr auto;
            }

            .guidebook-link-visual {
                width: 40px;
                height: 40px;
                border-radius: 14px;

</head>

</main>

    $(function () {
        document.addEventListener("language-changed", function (event) {
            renderGuidebook(event.detail && event.detail.langId);
            setLocalizedDocumentTitle();
        });

        const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        const bootPromise = window.liff && typeof liff.init === "function"
            ? liff.init({
                liffId: LIFF_ID,
                withLoginOnExternalBrowser: !isDev,
            }).then(loadHeader)
            : loadHeader();

        bootPromise.then(() => {
            if ($.fn.localize && window.i18next && i18next.isInitialized) {
                $("body").localize();
                setLocalizedDocumentTitle();
            }
            renderGuidebook();
        }).catch((error) => {
            console.error("guidebook init failed:", error);
            renderGuidebook();
        }).finally(() => {
            $("#loadingOverlay").removeClass("is-open");
        });
    });

    function loadHeader() {
        return new Promise((resolve, reject) => {
            $("#header-container").load("../common/header.html", function (responseText, status) {
                if (status === "error") {
                    reject(new Error("Failed to load header.html"));
                    return;
                }

                document.addEventListener("i18n-initialized", function () {
                    resolve();
                }, {once: true});

                $.getScript("../common/js/header.js")
                    .fail(function () {
                        reject(new Error("Failed to load header.js"));
                    });
            });
        });
    }

    function renderGuidebook(languageCode) {
        const currentLanguage = getGuidebookLanguageCode(languageCode);
        const guidebook = GUIDEBOOK_DATA[currentLanguage] || GUIDEBOOK_DATA.en;
        $("#guidebookBulkLink").empty().append(renderPdfLink(guidebook.bulk, getGuidebookPdfTitle("bulk", "PDF"), "material-symbols:menu-book-rounded"));

        const splitList = $("#guidebookSplitList");
        splitList.empty();
        guidebook.split.forEach((url, index) => {
            splitList.append(renderPdfLink(url, getGuidebookPdfTitle(`split.${index}`, `PDF ${index + 1}`), GUIDEBOOK_PAGE_ICONS[index]));
        });
    }

    function renderPdfLink(url, title, icon) {
        return $("<a>")
            .addClass("guidebook-link card")
            .attr({
                href: url,
                target: "_blank",
                rel: "noopener noreferrer"
            })
            .append(
                $("<span>")
                    .addClass("guidebook-link-visual")
                    .append(
                        $("<iconify-icon>")
                            .attr("icon", icon || "material-symbols:article-rounded")
                            .attr("width", "24")
                            .attr("height", "24")
                            .attr("aria-hidden", "true")
                    )
            )
            .append(
                $("<div>")
                    .append(
                        $("<p>")
                            .addClass("guidebook-link-title")
                            .html(title)
                    )
            )
            .append(
                $("<iconify-icon>")
                    .addClass("guidebook-link-icon")
                    .attr("icon", "material-symbols:open-in-new-rounded")
                    .attr("width", "24")
                    .attr("height", "24")
                    .attr("aria-hidden", "true")
            );
    }

    function getGuidebookPdfTitle(key, fallback) {
        return getI18nText(`guidebook.pdfTitles.${key}`, fallback);
    }

    function getGuidebookLanguageCode(languageCode) {
        const activeLanguageCode = languageCode || window.normalizedLanguageCode || (window.i18next && i18next.isInitialized ? i18next.language : "en");
        const normalized = normalizeGuidebookLanguage(activeLanguageCode);
        return GUIDEBOOK_DATA[normalized] ? normalized : "en";
    }

    function normalizeGuidebookLanguage(languageCode) {
        const code = String(languageCode || "").toLowerCase();
        const baseCode = code.split("-")[0];
        const aliases = {
            pr: "pt",
            fa: "prs",
            ve: "vi",
            soft: "en",
            ja: "en"
        };
        return aliases[code] || aliases[baseCode] || code || "en";
    }

    function getI18nText(key, fallback) {
        return window.i18next && i18next.isInitialized ? i18next.t(key, {defaultValue: fallback}) : fallback;
    }

    function setLocalizedDocumentTitle() {
        const title = getI18nText("title.guidebook", "ガイドブック").replace(/<[^>]*>/g, "");
        document.title = `${title} | Pregnancy Support`;
    }
