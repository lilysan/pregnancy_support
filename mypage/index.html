<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Page Settings | Pregnancy Support</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/i18next@23/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="https://unpkg.com/jquery-i18next@1/jquery-i18next.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="../common/js/config.js"></script>
    <script src="../common/js/modal.js"></script>
    <script src="../common/js/toast.js"></script>
    <link rel="stylesheet" href="../style.css"/>
    <style>
        .link-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 16px;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .link-hospital-title {
            margin: 0;
        }

        .link-hospital-subtitle {
            margin: 2px 0 0;
            color: var(--sub-text);
            font-size: 15px;
            line-height: 1.45;
        }

        .link-detail-list {
            display: grid;
            gap: 10px;
        }

        .link-detail {
            display: grid;
            gap: 2px;
        }

        .link-detail-label {
            color: var(--sub-text);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.45;
        }

        .link-detail-value {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .link-extra-form {
            display: grid;
            gap: 14px;
            padding-top: 16px;
            border-top: 1px solid var(--divider);
        }

        .link-extra-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }

        .link-labor-toggle {
            display: grid;
            gap: 6px;
        }

        .link-empty {
            display: none;
        }

        .link-empty.is-visible {
            display: block;
        }

        .contact-form {
            display: grid;
            gap: 14px;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 16px;
        }

        .contact-card {
            display: grid;
            gap: 14px;
            position: relative;
        }

        .contact-draft-close {
            position: absolute;
            top: 12px;
            right: 12px;
            min-width: 34px;
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 999px;
        }

        .contact-draft-close + label {
            padding-right: 42px;
        }

        .contact-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .contact-card .contact-actions,
        .user-form .contact-actions {
            justify-content: flex-start;
        }

        .form-save-btn {
            width: 100%;
            justify-content: center;
            flex-basis: 100%;
        }

        .form-reset-btn {
            justify-content: center;
        }

        .btn:disabled {
            background: var(--border);
            color: var(--sub-text);
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.75;
        }

        .contact-add-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-start;
        }

        .contact-add-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .user-form {
            display: grid;
            gap: 14px;
        }

        .user-level-grid {
            display: grid;
            gap: 12px;
        }

        .hospital-badge {
            display: inline-flex;
            align-items: center;
            margin-left: 6px;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.45;
            vertical-align: middle;
        }

        .hospital-badge-required {
            background: var(--toast-bg-error);
            color: var(--error);
        }

        .hospital-badge-optional {
            background: var(--surface);
            color: var(--sub-text);
        }

        .user-level-label {
            display: inline-flex;
            align-items: center;
        }

    </style>
</head>
<body>
<div id="header-container" class="header-wrapper"></div>

<main>
    <article class="main-container">
        <h1 data-i18n="[html]title.mypage"></h1>
        <p class="desc" data-i18n="[html]link.desc"></p>

        <section>
            <h2 data-i18n="[html]link.section.user"></h2>
            <p class="desc" data-i18n="[html]link.userDesc"></p>

            <form id="userForm" class="card user-form">
                <label>
                    <span data-i18n="[html]link.label.name"></span>
                    <span class="hospital-badge hospital-badge-required" data-i18n="[html]link.badge.required"></span>
                    <input id="userNameInput" type="text" autocomplete="name" required data-i18n="[placeholder]link.placeholder.name">
                </label>
                <label>
                    <span data-i18n="[html]link.label.nameFurigana"></span>
                    <span class="hospital-badge hospital-badge-optional" data-i18n="[html]link.badge.optional"></span>
                    <input id="userNameFuriganaInput" type="text" data-i18n="[placeholder]link.placeholder.nameFurigana">
                </label>
                <label>
                    <span data-i18n="[html]link.label.age"></span>
                    <span class="hospital-badge hospital-badge-required" data-i18n="[html]link.badge.required"></span>
                    <input id="userAgeInput" type="number" inputmode="numeric" min="0" step="1" required data-i18n="[placeholder]link.placeholder.age">
                </label>
                <label>
                    <span data-i18n="[html]link.label.nationality"></span>
                    <span class="hospital-badge hospital-badge-required" data-i18n="[html]link.badge.required"></span>
                    <input id="userNationalityInput" type="text" list="userNationalityOptions" autocomplete="country-name" required>
                    <datalist id="userNationalityOptions"></datalist>
                </label>
                <label>
                    <span data-i18n="[html]link.label.native"></span>
                    <span class="hospital-badge hospital-badge-required" data-i18n="[html]link.badge.required"></span>
                    <input id="userNativeInput" type="text" list="userNativeOptions" required>
                    <datalist id="userNativeOptions"></datalist>
                    <input id="userNativeOtherInput" type="text" hidden>
                </label>
                <label>
                    <span data-i18n="[html]link.label.dueDate"></span>
                    <span class="hospital-badge hospital-badge-required" data-i18n="[html]link.badge.required"></span>
                    <input id="userDueDateInput" type="date" required>
                </label>
                <div>
                    <span class="field-label user-level-label" data-i18n="[html]link.label.level"></span>
                    <span class="hospital-badge hospital-badge-optional" data-i18n="[html]link.badge.optional"></span>
                    <div class="user-level-grid">
                        <label>
                            <span data-i18n="[html]link.label.levelSpeaking"></span>
                            <select id="userLevelSInput" class="user-level-input"></select>
                        </label>
                        <label>
                            <span data-i18n="[html]link.label.levelListening"></span>
                            <select id="userLevelLInput" class="user-level-input"></select>
                        </label>
                        <label>
                            <span data-i18n="[html]link.label.levelWriting"></span>
                            <select id="userLevelWInput" class="user-level-input"></select>
                        </label>
                        <label>
                            <span data-i18n="[html]link.label.levelReading"></span>
                            <select id="userLevelRInput" class="user-level-input"></select>
                        </label>
                    </div>
                </div>
                <div class="contact-actions">
                    <button type="button" id="saveUserBtn" class="btn primary btn-small form-save-btn">
                        <iconify-icon icon="material-symbols:save-rounded" width="18" height="18" aria-hidden="true"></iconify-icon>
                        <span data-i18n="[html]button.save"></span>
                    </button>
                    <button type="button" id="resetUserBtn" class="btn tertiary btn-small form-reset-btn">
                        <iconify-icon icon="material-symbols:restart-alt-rounded" width="18" height="18" aria-hidden="true"></iconify-icon>
                        <span data-i18n="[html]button.reset"></span>
                    </button>
                </div>
            </form>
        </section>

        <section>
            <h2 data-i18n="[html]link.section.hospitals"></h2>
            <div class="card card-info">
                <div class="state-card-inner">
                    <iconify-icon icon="material-symbols:info-rounded" width="24" height="24" style="color:var(--info-state)"></iconify-icon>
                    <div>
                        <p class="small" data-i18n="[html]link.info"></p>
                    </div>
                </div>
            </div>
            <div id="emptyState" class="card link-empty link-list">
                <div class="state-card-inner">
                    <iconify-icon icon="material-symbols:link-off-rounded" width="24" height="24" style="color:var(--sub-text)"></iconify-icon>
                    <p class="small" data-i18n="[html]link.empty"></p>
                </div>
            </div>
            <div id="hospitalList" class="link-list"></div>
            <div class="link-actions">
                <button type="button" id="scanHospitalBtn" class="btn primary">
                    <iconify-icon icon="material-symbols:qr-code-scanner-rounded" width="22" height="22" aria-hidden="true"></iconify-icon>
                    <span data-i18n="[html]link.button.scan"></span>
                </button>
            </div>
        </section>

        <section>
            <h2 data-i18n="[html]link.section.contacts"></h2>
            <p class="desc" data-i18n="[html]link.contactDesc"></p>

            <div id="emptyContactsState" class="card link-empty contact-list">
                <div class="state-card-inner">
                    <iconify-icon icon="material-symbols:phone-disabled-rounded" width="24" height="24" style="color:var(--sub-text)"></iconify-icon>
                    <p class="small" data-i18n="[html]link.emptyContacts"></p>
                </div>
            </div>
            <div id="contactList" class="contact-list"></div>
            <div class="contact-add-actions">
                <button type="button" id="addContactFormBtn" class="btn tertiary btn-small contact-add-btn">
                    <iconify-icon icon="material-symbols:add-rounded" width="20" height="20" aria-hidden="true"></iconify-icon>
                    <span data-i18n="[html]link.button.addContact"></span>
                </button>
            </div>
        </section>
    </article>
</main>

<div class="overlay is-open" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<div class="overlay" id="hospitalRegistrationOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="hospitalRegistrationTitle">
        <button type="button" class="modal-close" id="closeHospitalRegistrationBtn" aria-label="close">
            <iconify-icon icon="material-symbols:close-rounded" width="22" height="22" aria-hidden="true"></iconify-icon>
        </button>
        <h2 id="hospitalRegistrationTitle" class="modal-title" data-i18n="[html]link.modal.registerHospital.title"></h2>
        <p class="modal-message small" data-i18n="[html]link.modal.registerHospital.desc"></p>
        <form id="hospitalRegistrationForm" class="link-extra-form">
            <label>
                <span data-i18n="[html]link.label.cardNo"></span>
                <span class="hospital-badge hospital-badge-required" data-i18n="[html]link.badge.required"></span>
                <input id="hospitalRegistrationCardNoInput" type="text" inputmode="text" autocomplete="off" required data-i18n="[placeholder]link.placeholder.cardNo">
            </label>
            <label>
                <span data-i18n="[html]link.label.travelTime"></span>
                <span class="hospital-badge hospital-badge-required" data-i18n="[html]link.badge.required"></span>
                <input id="hospitalRegistrationTravelTimeInput" type="number" inputmode="numeric" min="0" step="1" required data-i18n="[placeholder]link.placeholder.travelTime">
            </label>
            <div class="link-labor-toggle">
                <span class="field-label">
                    <span data-i18n="[html]link.label.isLaborPatient"></span>
                    <span class="hospital-badge hospital-badge-required" data-i18n="[html]link.badge.required"></span>
                </span>
                <div id="hospitalRegistrationLaborButtons" class="radio-row single-select">
                    <button type="button" class="radio-chip" data-value="1" data-i18n="[html]link.option.yes"></button>
                    <button type="button" class="radio-chip" data-value="0" data-i18n="[html]link.option.no"></button>
                    <button type="button" class="radio-chip" data-value="2" data-i18n="[html]link.option.undecided"></button>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelHospitalRegistrationBtn" class="btn tertiary btn-small" data-i18n="[html]button.cancel"></button>
                <button type="button" id="submitHospitalRegistrationBtn" class="btn primary btn-small" data-i18n="[html]link.button.registerHospital"></button>
            </div>
        </form>
    </div>
</div>

    async function main(idToken) {
        state.idToken = idToken;
        const results = await Promise.allSettled([
            reloadUser(),
            reloadHospitals(),
            reloadContacts()
        ]);
        results.forEach((result) => {
            if (result.status === "rejected") {
                console.error("initial data load failed:", result.reason);
            }
        });
    }

    function loadHeader() {
        return new Promise((resolve, reject) => {
            $("#header-container").load("../common/header.html", function (responseText, status) {
                if (status === "error") {
                    reject(new Error("Failed to load header.html"));
                    return;
                }

                document.addEventListener("i18n-initialized", function () {
                    resolve();
                }, {once: true});

                $.getScript("../common/js/header.js")
                    .fail(function () {
                        reject(new Error("Failed to load header.js"));
                    });
            });
        });
    }

    function localizeLinkPage() {
        if ($.fn.localize && window.i18next && i18next.isInitialized) {
            bindFormOptionLanguageListener();
            renderLocalizedSelectOptions();
            $("main, #hospitalRegistrationOverlay").localize();
        }
    }

    function bindFormOptionLanguageListener() {
        if (formOptionLanguageListenerBound || !window.i18next) {
            return;
        }
        i18next.on("languageChanged", renderLocalizedSelectOptions);
        formOptionLanguageListenerBound = true;
    }

    async function reloadUser() {
        const response = await apiRequest({
            path: "user",
            method: "get",
            idToken: state.idToken
        }, "user");

        state.user = response && response.data ? response.data : {};
        renderUserForm();
    }

    async function reloadHospitals() {
        const response = await apiRequest({
            path: "link",
            method: "get",
            idToken: state.idToken
        }, "link");

        state.hospitals = response && response.data && Array.isArray(response.data.hospitals)
            ? response.data.hospitals
            : [];
        renderHospitals();
    }

    async function reloadContacts() {
        const response = await apiRequest({
            path: "contact",
            method: "get",
            idToken: state.idToken
        }, "contact");

        state.contacts = response && response.data && Array.isArray(response.data.contacts)
            ? response.data.contacts
            : [];
        renderContacts();
    }

    function renderHospitals() {
        const list = $("#hospitalList");
        list.empty();

        $("#emptyState").toggleClass("is-visible", state.hospitals.length === 0);

        state.hospitals.forEach((hospital) => {
            list.append(renderHospitalCard(hospital));

        localizeLinkPage();

    async function handleScanHospital() {
        if (!liff.scanCodeV2) {
            alert(tText("link.error.scanUnavailable", "QR code scanning is not available."));
            return;
        }

        try {
            const result = await liff.scanCodeV2();
            if (!result || !result.value) {
                return;
            }

            const qrToken = extractQrToken(result.value);
            if (!qrToken) {
                showInvalidHospitalQrModal();
                return;
            }

            openHospitalRegistrationModal(qrToken);
        } catch (error) {
            console.error("scan failed:", error);
            if (!error || !error.isApiError) {
                alert(tText("link.error.scanFailed", "ScanCode failed."));
            }
        }
    }

            return;
        }

        $("#loadingOverlay").addClass("is-open");
        try {
            await apiRequest({
                path: "link",
                method: "post",
                idToken: state.idToken,
                postData: getHospitalRegistrationFormData()
            }, "linkPost");
            closeHospitalRegistrationModal();
            await reloadHospitals();
            showSuccessToast("success.register");
        } catch (error) {
            console.error("register hospital failed:", error);
        } finally {
            $("#loadingOverlay").removeClass("is-open");
        }
    }

    async function handleUnlinkHospital(hospital) {
        if (!hospital || !hospital.hospitalId) {
            return;
        }
        const action = await showDeleteConfirmModal({
            messageKey: "link.confirm.unlink",
            fallbackMessage: "Do you want to delete this hospital registration?"
        });
        if (action !== "positive") {
            return;
        }

        $("#loadingOverlay").addClass("is-open");
        try {
            await apiRequest({
                path: "link",
                method: "delete",
                idToken: state.idToken,
                postData: {
                    hospitalId: hospital.hospitalId
                }
            }, "linkDelete");
            await reloadHospitals();
            showSuccessToast("success.delete");
        } catch (error) {
            console.error("unlink failed:", error);
        } finally {
            $("#loadingOverlay").removeClass("is-open");
        }
    }

    async function handleSaveExtraInfo(hospital, form) {
        if (!hospital || !hospital.hospitalId) {
            return;
        }
        if (!form[0].reportValidity() || !validateLaborPatientSelection(form)) {
            return;
        }

        const travelTime = form.find('input[type="number"]').val();
        const selectedLaborPatient = form.find(".radio-chip.active").data("value");
        const postData = {
            hospitalId: hospital.hospitalId,
            cardNo: String(form.find('input[type="text"]').val() || "").trim(),
            travelTime: Number(travelTime),
            isLaborPatient: Number(selectedLaborPatient)
        };

        $("#loadingOverlay").addClass("is-open");
        try {
            await apiRequest({
                path: "extraLinkInfo",
                method: "post",
                idToken: state.idToken,
                postData: postData
            }, "extraLinkInfoPost");
            await reloadHospitals();
            showSuccessToast("success.save");
        } catch (error) {
            console.error("save extra link info failed:", error);
        } finally {
            $("#loadingOverlay").removeClass("is-open");
        }
    }

    async function handleAddContact(form) {
        if (!form[0].reportValidity()) {
            return;
        }

        $("#loadingOverlay").addClass("is-open");
        try {
            await apiRequest({
                path: "contact",
                method: "post",
                idToken: state.idToken,
                postData: getContactFormData(form)
            }, "contactPost");
            await reloadContacts();
            showSuccessToast("success.register");
        } catch (error) {
            console.error("add contact failed:", error);
        } finally {
            $("#loadingOverlay").removeClass("is-open");
        }
    }

    async function handleSaveUser() {
        const form = $("#userForm");
        if (!form[0].reportValidity()) {
            return;
        }

        $("#loadingOverlay").addClass("is-open");
        try {
            await apiRequest({
                path: "user",
                method: "post",
                idToken: state.idToken,
                postData: getUserFormData()
            }, "userPost");
            await reloadUser();
            showSuccessToast("success.save");
        } catch (error) {
            console.error("save user failed:", error);
        } finally {
            $("#loadingOverlay").removeClass("is-open");
        }
    }

    async function handleResetUser() {
        const action = await modalManager.show({
            title: tText("link.modal.resetUser.title", "リセットしますか？"),
            message: tText("link.modal.resetUser.message", "あなたの情報をリセットしますか？"),
            negativeText: tText("button.cancel", "キャンセル"),
            deleteText: tText("button.reset", "リセット")
        });
        if (action !== "positive") {
            return;
        }

        $("#loadingOverlay").addClass("is-open");
        try {
            await apiRequest({
                path: "user",
                method: "post",
                idToken: state.idToken,
                postData: getUserResetFormData()
            }, "userResetPost");
            await reloadUser();
            showSuccessToast("success.save");
        } catch (error) {
            console.error("reset user failed:", error);
        } finally {
            $("#loadingOverlay").removeClass("is-open");
        }
    }

    async function handleSaveContact(contact, form) {
        if (!contact || contact.contactId == null) {
            return;
        }
        if (!form[0].reportValidity()) {
            return;
        }

        const postData = getContactFormData(form);
        postData.contactId = Number(contact.contactId);

        $("#loadingOverlay").addClass("is-open");
        try {
            await apiRequest({
                path: "contact",
                method: "post",
                idToken: state.idToken,
                postData: postData
            }, "contactPut");
            await reloadContacts();
            showSuccessToast("success.save");
        } catch (error) {
            console.error("save contact failed:", error);
        } finally {
            $("#loadingOverlay").removeClass("is-open");
        }
    }

    async function handleDeleteContact(contact) {
        if (!contact || contact.contactId == null) {
            return;
        }
        const action = await showDeleteConfirmModal({
            messageKey: "link.confirm.deleteContact",
            fallbackMessage: "Do you want to delete this contact?"
        });
        if (action !== "positive") {
            return;
        }

        $("#loadingOverlay").addClass("is-open");
        try {
            await apiRequest({
                path: "contact",
                method: "delete",
                idToken: state.idToken,
                postData: {
                    contactId: Number(contact.contactId)
                }
            }, "contactDelete");
            await reloadContacts();
            showSuccessToast("success.delete");
        } catch (error) {
            console.error("delete contact failed:", error);
        } finally {
            $("#loadingOverlay").removeClass("is-open");
        }
    }

    function apiRequest(payload, label) {
        return $.ajax({
            url: API_URL,
            type: "POST",
            dataType: "json",
            data: JSON.stringify(payload),
            timeout: 30000,
        }).then(function (response) {
            if (response.statusCode === 401) {
                liff.logout();
                window.location.reload();
                return null;
            }
            if (response.statusCode !== 200) {
                console.error(response.message);
                alert(response.message);
                const error = new Error(response.message || `${label} failed`);
                error.isApiError = true;
                throw error;
            }
            return response;
        }, function () {
            alert(`Network error!${label}`);
            const error = new Error(`Network error: ${label}`);
            error.isApiError = true;
            throw error;
        });
    }

    function extractQrToken(value) {
        const qrToken = String(value || "").trim();
        return qrToken.startsWith(HOSPITAL_QR_TOKEN_PREFIX) ? qrToken : "";
    }

    function showInvalidHospitalQrModal() {
        return modalManager.show({
            title: tText("link.modal.invalidQr.title", "病院QRコードを読み取ってください"),
            message: tText("link.error.invalidQr", "Invalid QR code."),
            positiveText: tText("button.ok", "OK")
        });
    }

    function showDeleteConfirmModal({messageKey, fallbackMessage}) {
        return modalManager.show({
            title: tText("link.modal.confirmDelete.title", "削除しますか？"),
            message: tText(messageKey, fallbackMessage),
            negativeText: tText("button.cancel", "キャンセル"),
            deleteText: tText("button.delete", "削除")
        });
    }

    function formatAddress(hospital) {
        return [
            hospital.hospitalPostalcode ? `〒${hospital.hospitalPostalcode}` : "",
            hospital.hospitalAddress1,
            hospital.hospitalAddress2,
            hospital.hospitalAddress3,
            hospital.hospitalAddress4
        ].filter(Boolean).join(" ");
    }

    function normalizeLaborPatientValue(value) {
        if (value === 1 || value === "1") {
            return "1";
        }
        if (value === 0 || value === "0") {
            return "0";
        }
        if (value === 2 || value === "2") {
            return "2";
        }
        return "";
    }

    function getContactFormData(form) {
        return {
            contactName: String(form.find(".contact-name-input").val() || "").trim(),
            phoneNumber: String(form.find(".contact-phone-input").val() || "").trim()
        };
    }

    function openHospitalRegistrationModal(qrToken) {
        state.pendingQrToken = qrToken;
        $("#hospitalRegistrationForm")[0].reset();
        $("#hospitalRegistrationLaborButtons .radio-chip").removeClass("active");
        $("#hospitalRegistrationOverlay").addClass("is-open");
        $("#hospitalRegistrationCardNoInput").trigger("focus");
        updateHospitalRegistrationButtonState();
        localizeLinkPage();
    }

    function closeHospitalRegistrationModal() {
        state.pendingQrToken = "";
        $("#hospitalRegistrationOverlay").removeClass("is-open");
        $("#hospitalRegistrationForm")[0].reset();
        $("#hospitalRegistrationLaborButtons .radio-chip").removeClass("active");
        updateHospitalRegistrationButtonState();
    }

    function getHospitalRegistrationFormData() {
        const travelTime = $("#hospitalRegistrationTravelTimeInput").val();
        const selectedLaborPatient = $("#hospitalRegistrationLaborButtons .radio-chip.active").data("value");
        return {
            qrToken: state.pendingQrToken,
            cardNo: String($("#hospitalRegistrationCardNoInput").val() || "").trim(),
            travelTime: Number(travelTime),
            isLaborPatient: Number(selectedLaborPatient)
        };
    }

    function validateLaborPatientSelection(form) {
        if (form.find(".radio-chip.active").length > 0) {
            return true;
        }
        alert(tText("link.error.isLaborPatientRequired", "Please select whether this is your delivery hospital."));
        form.find(".radio-chip").first().trigger("focus");
        return false;
    }

    function updateUserSaveButtonState() {
        const form = $("#userForm");
        validateSearchableProfileInputs();
        $("#saveUserBtn").prop("disabled", !isFormComplete(form));
    }

    function updateHospitalRegistrationButtonState() {
        const form = $("#hospitalRegistrationForm");
        const isComplete = Boolean(state.pendingQrToken) && isFormComplete(form) && hasLaborPatientSelection(form);
        $("#submitHospitalRegistrationBtn").prop("disabled", !isComplete);
    }

    function updateExtraInfoSaveButtonState(form) {
        form.find(".extra-info-save-btn").prop("disabled", !(isFormComplete(form) && hasLaborPatientSelection(form)));
    }

    function updateContactFormSaveButtonState(form) {
        form.find(".contact-save-btn").prop("disabled", !isFormComplete(form));
    }

    function isFormComplete(form) {
        return form.length > 0 && form[0].checkValidity();
    }

    function hasLaborPatientSelection(form) {
        return form.find(".radio-chip.active").length > 0;
    }

    function validateSearchableProfileInputs() {
        const nationalityInput = $("#userNationalityInput")[0];
        const nativeInput = $("#userNativeInput")[0];
        if (nationalityInput) {
            nationalityInput.setCustomValidity(
                nationalityInput.value && !normalizeNationalityToJapanese(nationalityInput.value)
                    ? tText("link.error.selectFromList", "Please select from the list.")
                    : ""
            );
        }
        if (nativeInput) {
            nativeInput.setCustomValidity(
                nativeInput.value && !normalizeNativeLanguageToJapanese(nativeInput.value)
                    ? tText("link.error.selectFromList", "Please select from the list.")
                    : ""
            );
        }
    }

    function getUserFormData() {
        const name = String($("#userNameInput").val() || "").trim();
        const nameFurigana = String($("#userNameFuriganaInput").val() || "").trim();
        const age = $("#userAgeInput").val();
        const nationality = normalizeNationalityToJapanese($("#userNationalityInput").val());
        const selectedNativeLanguage = normalizeNativeLanguageToJapanese($("#userNativeInput").val());
        const nativeLanguage = selectedNativeLanguage === "その他"
            ? String($("#userNativeOtherInput").val() || "").trim()
            : selectedNativeLanguage;
        const dueDate = $("#userDueDateInput").val();

        return {
            lang: window.normalizedLanguageCode || "",
            name: name,
            nameFurigana: nameFurigana,
            age: age === "" ? "" : Number(age),
            nationality: nationality,
            native: nativeLanguage,
            dueDate: dueDate ? toApiDateValue(dueDate) : "",
            level: {
                s: toOptionalIntOrBlank($("#userLevelSInput").val()),
                l: toOptionalIntOrBlank($("#userLevelLInput").val()),
                w: toOptionalIntOrBlank($("#userLevelWInput").val()),
                r: toOptionalIntOrBlank($("#userLevelRInput").val())
            }
        };
    }

    function getUserResetFormData() {
        return {
            lang: window.normalizedLanguageCode || "",
            name: "",
            nameFurigana: "",
            age: "",
            nationality: "",
            native: "",
            dueDate: "",
            level: {
                s: "",
                l: "",
                w: "",
                r: ""
            }
        };
    }

    function renderLocalizedSelectOptions() {
        renderNationalityOptions();
        renderNativeLanguageOptions();
        renderLevelOptions();
    }

    function renderNationalityOptions() {
        const input = $("#userNationalityInput");
        const currentValue = normalizeNationalityToJapanese(input.val());
        const list = $("#userNationalityOptions");

        list.empty();
        NATIONALITY_OPTIONS.forEach((option) => {
            list.append($("<option>").attr("value", option.label));
        });
        input
            .attr("placeholder", tText("link.option.notSet", "未設定"))
            .val(getNationalityLabelByValue(currentValue) || currentValue || "");
    }


    function renderNativeLanguageOptions() {
        const input = $("#userNativeInput");
        const currentValue = normalizeNativeLanguageToJapanese(input.val());
        const list = $("#userNativeOptions");

        list.empty();
        NATIVE_LANGUAGE_OPTIONS.forEach((option) => {
            list.append($("<option>").attr("value", option.label));
        });
        list.append($("<option>").attr("value", getOtherOptionLabel()));
        input
            .attr("placeholder", tText("link.option.notSet", "未設定"))
            .val(getNativeLanguageLabelByValue(currentValue) || (currentValue === "その他" ? getOtherOptionLabel() : currentValue || ""));
        updateNativeOtherInputState();
    }

    function setNationalityValue(value) {
        const normalizedValue = normalizeNationalityToJapanese(value);
        $("#userNationalityInput").val(getNationalityLabelByValue(normalizedValue) || "");
        updateUserSaveButtonState();
    }

    function setNativeLanguageValue(value) {
        const raw = String(value || "").trim();
        const normalizedValue = normalizeNativeLanguageToJapanese(raw);
        const isListedValue = Boolean(normalizedValue && normalizedValue !== "その他");

        $("#userNativeInput").val(isListedValue ? getNativeLanguageLabelByValue(normalizedValue) : (raw ? getOtherOptionLabel() : ""));
        $("#userNativeOtherInput").val(isListedValue || normalizedValue === "その他" ? "" : raw);
        updateNativeOtherInputState();
    }

    function updateNativeOtherInputState() {
        const isOtherSelected = normalizeNativeLanguageToJapanese($("#userNativeInput").val()) === "その他";
        const input = $("#userNativeOtherInput");
        input
            .prop("hidden", !isOtherSelected)
            .prop("required", isOtherSelected)
            .attr("placeholder", tText("link.placeholder.nativeOther", tText("button.other", "Other")));
        if (!isOtherSelected) {
            input.val("");
        }
        updateUserSaveButtonState();
    }

    function bindSearchableProfileInput(input) {
        input.on("focus", function () {
            const currentValue = String(input.val() || "").trim();
            if (!isKnownSearchableProfileLabel(this.id, currentValue)) {
                return;
            }
            input.data(SEARCHABLE_INPUT_RESTORE_VALUE_KEY, currentValue);
            input.val("");
            updateUserSaveButtonState();
        });

        input.on("blur", function () {
            const restoreValue = input.data(SEARCHABLE_INPUT_RESTORE_VALUE_KEY);
            input.removeData(SEARCHABLE_INPUT_RESTORE_VALUE_KEY);
            if (String(input.val() || "").trim() === "" && restoreValue) {
                input.val(restoreValue);
                handleSearchableProfileInputChanged(this.id);
            }
        });
    }

    function isKnownSearchableProfileLabel(inputId, value) {
        if (!value) {
            return false;
        }
        if (inputId === "userNationalityInput") {
            return NATIONALITY_OPTIONS.some((option) => option.label === value);
        }
        if (inputId === "userNativeInput") {
            return NATIVE_LANGUAGE_OPTIONS.some((option) => option.label === value) || isOtherOptionText(value);
        }
        return false;
    }

    function handleSearchableProfileInputChanged(inputId) {
        if (inputId === "userNativeInput") {
            updateNativeOtherInputState();
            return;
        }
        updateUserSaveButtonState();
    }

    function getOtherOptionLabel() {
        return tText("button.other", "Other");
    }

    function getNationalityLabelByValue(value) {
        const option = NATIONALITY_OPTIONS.find((item) => item.value === value);
        return option ? option.label : "";
    }

    function getNativeLanguageLabelByValue(value) {
        const option = NATIVE_LANGUAGE_OPTIONS.find((item) => item.value === value);
        return option ? option.label : "";
    }

    function normalizeNationalityToJapanese(value) {
        const raw = String(value || "").trim();
        if (!raw) {
            return "";
        }
        const rawLower = raw.toLocaleLowerCase();
        const matchedOption = NATIONALITY_OPTIONS.find((option) => {
            return option.value === raw || option.label.toLocaleLowerCase() === rawLower;
        });
        return matchedOption ? matchedOption.value : "";
    }

    function normalizeNativeLanguageToJapanese(value) {
        const raw = String(value || "").trim();
        if (!raw) {
            return "";
        }
        if (isOtherOptionText(raw)) {
            return "その他";
        }

        const rawLower = raw.toLocaleLowerCase();
        const matchedOption = NATIVE_LANGUAGE_OPTIONS.find((option) => {
            return option.value === raw || option.label.toLocaleLowerCase() === rawLower;
        });
        return matchedOption ? matchedOption.value : "";
    }

    function isOtherOptionText(value) {
        const rawLower = String(value || "").trim().toLocaleLowerCase();
        return OTHER_OPTION_TEXTS.some((text) => text.toLocaleLowerCase() === rawLower)
            || getOtherOptionLabel().toLocaleLowerCase() === rawLower;
    }

    function renderLevelOptions() {
        const levelKeysByInputId = {
            userLevelSInput: "s",
            userLevelLInput: "l",
            userLevelWInput: "w",
            userLevelRInput: "r"
        };

        $(".user-level-input").each(function () {
            const select = $(this);
            const currentValue = select.val();
            const levelKey = levelKeysByInputId[this.id];
            select.empty();
            select.append($("<option>").attr("value", "").text(tText("link.option.notSet", "未設定")));
            [1, 2, 3, 4].forEach((level) => {
                const label = tText(`link.levelTable.rows.${level}.${levelKey}`, `Lv.${level}`);
                select.append(
                    $("<option>")
                        .attr("value", String(level))
                        .text(`${level}：${label}`)
                );
            });
            select.val(currentValue || "");
        });
    }

    function toOptionalIntOrBlank(value) {
        if (value === "" || value == null) {
            return "";
        }
        return Number(value);
    }

    function toDateInputValue(value) {
        if (!value) {
            return "";
        }
        const normalized = String(value).trim().replace(/\//g, "-");
        return /^\d{4}-\d{2}-\d{2}$/.test(normalized) ? normalized : "";
    }

    function toApiDateValue(value) {
        return String(value || "").replace(/-/g, "/");
    }

    function tText(key, fallback) {
        if (!window.i18next || !i18next.isInitialized) {
            return fallback;
        }
        return $("<span>").html(i18next.t(key, fallback)).text();
    }

    function showSuccessToast(messageKey) {
        const toastManager = createToastManager();
        toastManager.show({
            title: i18next.t("toast.success", "成功"),
            message: i18next.t(messageKey, "保存しました。"),
            color: "var(--success)",
            bg: "var(--toast-bg-success)",
            icon: "material-symbols:check-circle-rounded"
        });
    }
</script>
</body>
</html>
